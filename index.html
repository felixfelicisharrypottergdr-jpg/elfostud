  /* v71 - Anno Scolastico: modifica sempre disponibile + promemoria confermabile ogni agosto */
  /* v70 - fix Camera Blindata Studente: rimosso riferimento a funzione solo Adulto */
  /* v69 - Da accreditare: riepilogo ultimo Post + evidenza valori */
  /* Postazione / Cubicolo / Recinto: blocchi, colori entità, tendine Agenda/Cicli/Archivio e griglie allineate */
  /* Camera Blindata: Bonus «Tutti i post» senza checkbox; si applica automaticamente a ogni post valido */
  /* Camera Blindata: post.pp legacy ignorato; PP conteggiati solo dai Bonus correnti */
  /* Cronologia sessione: Annulla / Ripristina disponibile in tutte le interfacce del PG */
  /* Dispensa: tre blocchi; Incolla + aggiunta manuale riuniti nel Blocco 1 */
  /* Dispensa: quattro grandi blocchi numerati e visivamente separati */
  /* Dispensa: layout riordinato, sezioni a tendina, colori per Classificazione, titoli in maiuscoletto */
  /* Dispensa: editor del lotto resta aperto durante il cambio provenienza (es. 10d90) */
  /* Dispensa: 10d90 Benvenuto + import Generatore Ricerca Ingredienti + auto-somma dosi */
  /* Rimozione PG: richiesta salvata nel documento; cancellazione definitiva solo dal Narratore */
  /* Barra DA ACCREDITARE: usa i totali mensili effettivi e spazio dopo i due punti */
  /* CB: rimosso Totale complessivo ridondante; restano Galeoni accumulati + Totale Bonus */
  /* Riepilogo Bonus: mostra Post del mese e N. globale degli utilizzi */
  /* Totali per singolo post: Totale Bonus + Totale complessivo; contatore usi solo nel riepilogo Bonus */
  /* Bonus variabile: valore solo per singolo post; Azzera elimina tutti i Bonus */
  /* Utilizzi a consumo: stato iniziale obbligatorio prima dei post; rimossi casi non-CB */
  /* Bonus a utilizzi: fisso/variabile, link tiro, stato Bagaglio */
  /* CB compatta: Link / Galeoni / N. globale / Bonus; valori Bonus dinamici */
  /* Bonus multipli: aggiunta/rimozione indipendente e esclusione per singolo post */
  /* Bonus generalizzato: Eventi / Premi FT / Trame / altri bonus */
  /* v68 - Evento: PP / Galeoni / Altro + fix numero globale */
  /* v67 - palette pulsanti per sezione */

  body.screen-taccuino{

  .tacc-local-banner{

  .tacc-empty{padding:18px 12px;text-align:center;border:1px dashed rgba(82,61,37,.35);border-radius:10px;color:#6b5a45;background:rgba(255,255,255,.35);}

    display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;

    background:#efe3c7;color:#4a3420 !important;text-decoration:none !important;font-size:.76rem;font-weight:800;
    word-break:normal;overflow-wrap:anywhere;transition:background .15s ease,transform .15s ease;
  }

  .tacc-link:hover{background:#e3d1aa;color:#2f2115 !important;text-decoration:none !important;transform:translateY(-1px);}
  .tacc-role-meta{font-size:.78rem;color:#6d5a43;margin:4px 0;}

  .tacc-collection-manager>summary::-webkit-details-marker{display:none;}

  .tacc-collection-manager[open]>summary::after{content:" −";}
  .tacc-collection-manager-body{padding:0 12px 12px;}
  .tacc-category-title{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(83,60,33,.18);padding-bottom:7px;margin-bottom:9px;}

  .tacc-history-role{border:1px solid rgba(93,68,38,.24);background:rgba(255,252,241,.92);border-radius:10px;margin:8px 0;overflow:hidden;box-shadow:0 1px 4px rgba(34,23,13,.05);}

  .tacc-history-role[open]>summary::after{content:"▾";}

  .tacc-history-role-body{padding:11px 12px 12px;}

  @media(max-width:760px){
    .tacc-grid-2,.tacc-grid-3{grid-template-columns:1fr;}

  /* Azioni Illegali — stato storico/importato, nessun rilancio nell'Elfo */

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, deleteField, serverTimestamp, collection, addDoc, runTransaction, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
  import { getAuth, signInAnonymously, signOut, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCvd56bSEL02s2OY2PSk7uyFX-CYRB4Vz0",
    authDomain: "conteggi-eee1b.firebaseapp.com",
    projectId: "conteggi-eee1b",
    storageBucket: "conteggi-eee1b.firebasestorage.app",
    messagingSenderId: "481320219586",
    appId: "1:481320219586:web:87e974d618a302adfadc5b"
  };

  var fbApp = initializeApp(firebaseConfig);
  var fbDb = getFirestore(fbApp);
  var PERSON_COLLECTION = "personaggi_studenti";

  var fbAuth = getAuth(fbApp);
  var NARRATOR_UID = "TFgqfVrFLjW5SwqRFXmEi8tDhtM2";
  var ELFO_TYPE = "studente";
  var PASSWORD_COLLECTION = "elfo_passwords_studenti";
  var EDIT_SESSION_COLLECTION = "elfo_edit_sessions";
  var authReadyPromise = new Promise(function(resolve){
    var settled=false;
    onAuthStateChanged(fbAuth,function(user){if(!settled){settled=true;resolve(user||null);}});
  });
  function authReady(){return authReadyPromise.catch(function(){return null;});}
  function isNarratorUser(user){return !!(user&&user.uid===NARRATOR_UID);}
  async function ensurePlayerAuth(){
    await authReady();
    if(fbAuth.currentUser){return fbAuth.currentUser;}
    await setPersistence(fbAuth,browserSessionPersistence);
    var cred=await signInAnonymously(fbAuth);
    return cred.user;
  }
  window.fbListPublicPgs = function(){
    return getDocs(collection(fbDb,PERSON_COLLECTION)).then(function(snap){
      var out=[];
      snap.forEach(function(d){
        var x=d.data()||{};
        if(!x._deleted&&!x._archiviato){out.push({id:d.id,passwordConfigured:x._editPasswordConfigured===true});}
      });
      out.sort(function(a,b){return String(a.id).localeCompare(String(b.id),'it',{sensitivity:'base'});});
      return out;
    });
  };
  var HEALING_IMPORT_COLLECTION = "elfo_healing_imports";
  window.fbListHealingImports = async function(pgId){
    await authReady();
    if(!fbAuth.currentUser){return [];}
    var qh=query(collection(fbDb,HEALING_IMPORT_COLLECTION),where("targetName","==",String(pgId||"")));
    var snap=await getDocs(qh),out=[];
    snap.forEach(function(d){out.push({id:d.id,data:d.data()||{}});});
    return out;
  };
  window.fbDeleteHealingImport = async function(importId){
    await authReady();
    if(!fbAuth.currentUser){return false;}
    await deleteDoc(doc(fbDb,HEALING_IMPORT_COLLECTION,String(importId||"")));
    return true;
  };
  window.fbHasEditSession = async function(pgId){
    await authReady();
    var user=fbAuth.currentUser;
    if(!user){return false;}
    if(isNarratorUser(user)){return true;}
    try{
      var snap=await getDoc(doc(fbDb,EDIT_SESSION_COLLECTION,user.uid));
      if(!snap.exists()){return false;}
      var d=snap.data()||{};
      return d.uid===user.uid && d.pgId===String(pgId||'') && d.tipo===ELFO_TYPE && !Object.prototype.hasOwnProperty.call(d,'proof');
    }catch(e){return false;}
  };
  window.fbUnlockEditing = async function(pgId,password){
    try{
      var user=await ensurePlayerAuth();
      if(isNarratorUser(user)){return {ok:true,narrator:true};}
      var ref=doc(fbDb,EDIT_SESSION_COLLECTION,user.uid);
      await setDoc(ref,{uid:user.uid,pgId:String(pgId||''),tipo:ELFO_TYPE,proof:String(password||''),createdAt:serverTimestamp()});
      await updateDoc(ref,{proof:deleteField()});
      return {ok:true};
    }catch(e){console.error(e);return {ok:false,code:(e&&e.code)||'wrong-password'};}
  };
  window.fbEndEditSession = async function(){
    await authReady();
    var user=fbAuth.currentUser;
    if(!user||isNarratorUser(user)){return true;}
    /* v103/v102: la cancellazione del documento-sessione non deve poter bloccare
       Disconnetti a tempo indefinito. Anche se Firebase è lento/offline, dopo un
       breve timeout eseguiamo comunque signOut: una sessione rimasta orfana non è
       riutilizzabile perché le Rules la legano allo stesso auth.uid. */
    try{
      await Promise.race([
        deleteDoc(doc(fbDb,EDIT_SESSION_COLLECTION,user.uid)),
        new Promise(function(resolve){setTimeout(resolve,1800);})
      ]);
    }catch(e){}
    try{await signOut(fbAuth);}catch(e){}
    return true;
  };
  window.fbClaimExistingPgPassword = async function(pgId,password,sessionId){
    var user;
    try{user=await ensurePlayerAuth();}catch(e){return {ok:false,code:'auth'};}
    if(isNarratorUser(user)){return {ok:false,code:'narrator-use-panel'};}
    var pgRef=doc(fbDb,PERSON_COLLECTION,pgId);
    var passRef=doc(fbDb,PASSWORD_COLLECTION,pgId);
    var sessRef=doc(fbDb,EDIT_SESSION_COLLECTION,user.uid);
    try{
      var revision=await runTransaction(fbDb,async function(tx){
        var snap=await tx.get(pgRef);
        if(!snap.exists()){throw new Error('missing-pg');}
        var cur=snap.data()||{};
        if(cur._deleted){throw new Error('deleted-pg');}
        if(cur._archiviato){throw new Error('archived-pg');}
        if(cur._editPasswordConfigured===true){throw new Error('already-configured');}
        var rev=(parseInt(cur._dbRevision,10)||0)+1;
        tx.set(passRef,{pgId:pgId,tipo:ELFO_TYPE,password:String(password||''),createdAt:serverTimestamp(),createdByUid:user.uid});
        tx.set(sessRef,{uid:user.uid,pgId:pgId,tipo:ELFO_TYPE,proof:String(password||''),createdAt:serverTimestamp()});
        tx.set(pgRef,{
          _editPasswordConfigured:true,
          _dbRevision:rev,
          _lastModifiedAt:serverTimestamp(),
          _lastModifiedBy:'pg',
          _lastSessionId:String(sessionId||'')
        },{merge:true});
        return rev;
      });

    if(name){for(i=0;i<list.length;i++){if(txNormMonth(list[i]&&list[i].nome)===name){return list[i];}}}

  }

  window.fbSaveState = function(pgId, dataObj, sessionId, mustAlreadyExist, auditObj, baselineObj){
    var ref = doc(fbDb, PERSON_COLLECTION, pgId);
    var accCollection = PERSON_COLLECTION === "personaggi_adulti" ? "accrediti_adulti" : "accrediti_studenti";
    var accRef = doc(fbDb, accCollection, pgId);
    var auditRef = auditObj ? doc(collection(fbDb, PERSON_COLLECTION, pgId, "audit")) : null;
    var expectedRevision = Math.max(0, parseInt(dataObj && dataObj._dbRevision,10) || 0);
    window.fbLastSaveError = null; window.fbLastSavedRevision = null; window.fbLastCommittedState = null;
    return runTransaction(fbDb, async function(tx){
      var snap = await tx.get(ref), accSnap = await tx.get(accRef);
      var next = Object.assign({}, dataObj || {});
      if(mustAlreadyExist && !snap.exists()){ throw new Error("not-found"); }
      if(snap.exists()){
        var remoteData=snap.data()||{};
        if(remoteData._deleted){ throw new Error("deleted-pg"); }
        var remoteRevision = Math.max(0, parseInt(remoteData._dbRevision,10) || 0);
        if(remoteRevision !== expectedRevision){
          /* In anteprima (e durante alcuni rerender asincroni) due istanze dello stesso
             Elfo possono condividere la medesima SESSION_ID. Se l'ultima revisione è
             stata scritta proprio da QUESTA sessione, non è un conflitto esterno:
             assorbiamo la revisione corrente e continuiamo nella stessa transazione. */
          var remoteSession=String(remoteData._lastSessionId||"");

            expectedRevision=remoteRevision;
          }else{
            var revErr=new Error("revision-conflict");
            revErr.expectedRevision=expectedRevision;revErr.remoteRevision=remoteRevision;
            revErr.remoteSessionId=remoteSession;revErr.localSessionId=String(sessionId||"");
            throw revErr;
          }
        }
        next=txProtectAccreditedMonths(remoteData,next,accSnap.exists()?accSnap.data():{},baselineObj||{});
      } else if(expectedRevision !== 0){
        var missingRevErr=new Error("revision-conflict");
        missingRevErr.expectedRevision=expectedRevision;missingRevErr.remoteRevision=0;
        throw missingRevErr;
      }
      next._dbRevision = expectedRevision + 1;
      next._lastModifiedAt = serverTimestamp();
      next._lastModifiedBy = "pg";
      next._lastSessionId = String(sessionId || "");
      tx.set(ref, next, {merge:true});
      if(auditRef && auditObj){
        var ev = Object.assign({}, auditObj || {});
        ev.pgId = pgId;
        ev.actor = "pg";
        ev.sessionId = String(sessionId || "");

    });
  };

  /* ================================================================

  function staffTokenNormalizeName(v){

      String(payload.postId==null?"":payload.postId),

            pgId:pgId,
            pgKind:pgKind,
            monthId:String(payload.monthId==null?"":payload.monthId),
            monthName:String(payload.monthName||""),
            postId:String(payload.postId==null?"":payload.postId),
            globalNo:parseInt(payload.globalNo,10)||null,
            link:String(payload.link||"").trim(),
            spendLogId:logRef.id,
            usedAt:serverTimestamp(),
            updatedAt:serverTimestamp()
          },{merge:true});
          tx.set(logRef,{
            tipo:"spesa_elfo",
            azione:"spesa",
            source:"elfo_cb",
            usageId:usageId,
            staffId:staffId,
            nomeVisualizzato:staffName,
            pgId:pgId,
            pgKind:pgKind,
            delta:-1,
            guadagnati:-1,
            saldoPrima:balance,
            saldoDopo:after,
            movimentoPrecedenteId:staff.ultimoMovimentoId||null,
            obiettivi:[{
              id:"spesa_elfo",
              nome:"Camera Blindata — "+pgId,
              ft:-1,
              dettaglio:"1 Staff Token usato da "+pgId+" su "+postLabel+".",
              riferimenti:String(payload.link||"").trim()
            }],
            data:serverTimestamp(),
            registratoIl:serverTimestamp()
          });
          return {balance:after,usageId:usageId,changed:true};
        }

        if(staff.stafferAttivo===false)throw new Error("staff-token-staffer-inactive");
        if(!usage||usage.active!==true){
          return {balance:balance,usageId:usageId,changed:false};
        }
        if(String(usage.staffId||staffId)!==staffId)throw new Error("staff-token-owner-mismatch");
        var afterRefund=balance+1;
        var staffNameRefund=String(staff.nomeVisualizzato||usage.staffName||payload.staffName||staffId);
        var refLink=String(payload.link||usage.link||"").trim();
        var refundPostLabel=staffTokenPostLabel({
          globalNo:payload.globalNo||usage.globalNo
        });
        tx.set(staffRef,{
          st_totali:afterRefund,
          ultimoMovimentoId:logRef.id,
          ultimoAggiornamento:serverTimestamp()
        },{merge:true});
        tx.set(usageRef,{
          active:false,
          link:refLink,
          globalNo:parseInt(payload.globalNo||usage.globalNo,10)||null,
          refundLogId:logRef.id,
          refundedAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        },{merge:true});
        tx.set(logRef,{
          tipo:"spesa_elfo",
          azione:"rimborso",
          source:"elfo_cb",
          usageId:usageId,
          staffId:staffId,
          nomeVisualizzato:staffNameRefund,
          pgId:pgId,
          pgKind:pgKind,
          delta:1,
          guadagnati:1,
          saldoPrima:balance,
          saldoDopo:afterRefund,
          movimentoPrecedenteId:staff.ultimoMovimentoId||null,
          obiettivi:[{
            id:"rimborso_elfo",
            nome:"Camera Blindata — "+pgId,
            ft:1,
            dettaglio:"1 Staff Token restituito da "+pgId+" dopo la rimozione dell’uso su "+refundPostLabel+".",
            riferimenti:refLink
          }],
          data:serverTimestamp(),
          registratoIl:serverTimestamp()
        });
        return {balance:afterRefund,usageId:usageId,changed:true};
      });
      return Object.assign({ok:true},result||{});
    }catch(e){
      console.error("Staff Token transaction:",e);
      var code=(e&&e.code)||((e&&e.message)||"staff-token-error");
      return {ok:false,code:code,raw:e};
    }
  };

  window.fbUpdateStaffTokenUsageReference=async function(payload){
    payload=Object.assign({},payload||{});
    var usageId=staffTokenUsageId(payload);
    try{
      await ensurePlayerAuth();
      if(window.fbHasEditSession){
        var ok=await window.fbHasEditSession(String(payload.pgId||"").trim());
        if(!ok)throw new Error("edit-session-missing");
      }
      var usageRef=doc(fbDb,"staff_token_usi",usageId);
      await runTransaction(fbDb,async function(tx){
        var snap=await tx.get(usageRef);
        if(!snap.exists())return;
        var usage=snap.data()||{};
        if(usage.active!==true)return;
        var link=String(payload.link||"").trim();
        var logId=String(usage.spendLogId||"").trim();
        var logRef=logId?doc(fbDb,"staff_token_log",logId):null;
        var logSnap=logRef?await tx.get(logRef):null;
        tx.set(usageRef,{link:link,globalNo:parseInt(payload.globalNo,10)||null,updatedAt:serverTimestamp()},{merge:true});
        if(logRef&&logSnap&&logSnap.exists()){
          var log=logSnap.data()||{},objs=Array.isArray(log.obiettivi)?log.obiettivi.slice():[];
          if(objs.length){
            objs[0]=Object.assign({},objs[0],{riferimenti:link});
            tx.set(logRef,{obiettivi:objs},{merge:true});
          }
        }
      });
      return {ok:true};
    }catch(e){
      console.error("Staff Token reference update:",e);
      return {ok:false,code:(e&&e.code)||((e&&e.message)||"staff-token-error"),raw:e};
    }
  };

  window.fbReady = true;
  if(window.fbOnReady){ window.fbOnReady(); }
</script>

<script>
(function(){

  "use strict";

  /* ================================================================
     STAFF TOKEN — stato live e controlli Camera Blindata
     ================================================================ */
  var STAFF_TOKEN_KIND="studenti";
  var STAFF_TOKEN_STATE={
    pg:"",associated:false,loading:false,error:"",
    staffId:"",staffName:"",balance:0,
    usageLoaded:false,usageError:"",usageById:{},
    unsubOwner:null,unsubUsage:null
  };
  var STAFF_TOKEN_BUSY={};
  var staffTokenRenderTimer=null;

  function staffTokenCurrentPgName(){
    return String(typeof STUDENTE!=="undefined"&&STUDENTE&&STUDENTE.nome?STUDENTE.nome:"").trim();
  }
  function staffTokenOwnerShort(v){
    var s=String(v||"");
    if(/lulu/i.test(s))return "Lulu";
    if(/gideon/i.test(s))return "Gideon";
    if(/noah/i.test(s))return "Noah";
    if(/odette/i.test(s))return "Odette";
    return s||"Staff";
  }
  function staffTokenPayload(post,mese,enabled){
    return {
      enabled:enabled===true,
      staffId:String(post&&post.staffTokenStaffId||STAFF_TOKEN_STATE.staffId||""),
      staffName:String(post&&post.staffTokenStaffName||STAFF_TOKEN_STATE.staffName||""),
      pgId:staffTokenCurrentPgName(),
      pgKind:STAFF_TOKEN_KIND,
      monthId:mese&&mese.id!=null?mese.id:"",
      monthName:String(mese&&mese.nome||""),
      postId:post&&post.id!=null?post.id:"",
      globalNo:post&&post.globalNo!=null?post.globalNo:null,
      link:String(post&&post.link||"").trim()
    };
  }
  function staffTokenUsageIdForPost(post,mese){
    if(!window.fbStaffTokenUsageId)return "";
    try{return window.fbStaffTokenUsageId(staffTokenPayload(post,mese,true));}catch(e){return "";}
  }
  function staffTokenIsUsed(post,mese){
    if(!post)return false;
    var id=staffTokenUsageIdForPost(post,mese);
    if(STAFF_TOKEN_STATE.usageLoaded&&id&&Object.prototype.hasOwnProperty.call(STAFF_TOKEN_STATE.usageById,id)){
      return STAFF_TOKEN_STATE.usageById[id]&&STAFF_TOKEN_STATE.usageById[id].active===true;
    }
    return post.staffTokenUsato===true;
  }
  function staffTokenCountForPosts(posts,endExclusive,mese){
    posts=Array.isArray(posts)?posts:[];
    var limit=Math.min(posts.length,endExclusive==null?posts.length:endExclusive),n=0;
    for(var i=0;i<limit;i++){if(posts[i]&&isValidPostLink(posts[i].link)&&staffTokenIsUsed(posts[i],mese))n++;}
    return n;
  }
  function staffTokenErrorText(code){
    code=String(code||"");
    if(code.indexOf("permission-denied")>=0)return "Firebase non consente all’Elfo di aggiornare il saldo Staff Token. Verifica di avere pubblicato le Rules v44 e di essere entrato in modifica con la Password del PG.";
    if(code==="edit-session-missing")return "Entra prima in modifica con la Password del PG.";
    if(code==="staff-token-empty")return "Non ci sono Staff Token disponibili.";
    if(code==="staff-token-staffer-inactive")return "Questo Staffer è segnato come «Non è più Staffer»: gli ST già usati restano consumati, ma non sono consentiti nuovi utilizzi o restituzioni dagli Elfi.";
    if(code==="staff-token-pg-not-associated")return "Questo PG non risulta più associato allo Staffer nel Gestore Staff Token.";
    if(code==="staff-token-owner-not-found")return "Non trovo il saldo dello Staffer.";
    if(code==="staff-token-owner-mismatch")return "L’uso registrato appartiene a un altro saldo Staffer.";
    return "Non riesco ad aggiornare gli Staff Token ("+code+").";
  }
  function staffTokenScheduleRender(){
    if(currentStep!=="blindata")return;
    if(staffTokenRenderTimer)clearTimeout(staffTokenRenderTimer);
    staffTokenRenderTimer=setTimeout(function(){staffTokenRenderTimer=null;renderAll({skipAutoSave:true});},70);
  }
  function staffTokenRefreshDom(){
    var nodes=document.querySelectorAll("[data-staff-token-balance]");
    for(var i=0;i<nodes.length;i++)nodes[i].textContent=String(STAFF_TOKEN_STATE.balance)+" ST";
    var btns=document.querySelectorAll("button.staff-token-use");
    for(var j=0;j<btns.length;j++){
      var b=btns[j],used=b.getAttribute("data-staff-token-used")==="1";
      if(!used&&STAFF_TOKEN_STATE.balance<=0)b.disabled=true;
    }
  }
  function staffTokenApplyUsageCache(){
    if(!STAFF_TOKEN_STATE.usageLoaded)return false;
    var changed=false;
    for(var mi=0;mi<MESI.length;mi++){
      var mese=MESI[mi],posts=Array.isArray(mese&&mese.posts)?mese.posts:[];
      for(var pi=0;pi<posts.length;pi++){
        var post=posts[pi],id=staffTokenUsageIdForPost(post,mese);
        if(!id)continue;
        var rec=STAFF_TOKEN_STATE.usageById[id]||null;
        var active=!!(rec&&rec.active===true);
        if(post.staffTokenUsato!==active){post.staffTokenUsato=active;changed=true;}
        if(rec){
          var sid=String(rec.staffId||"");
          var sn=String(rec.staffName||"");
          if(String(post.staffTokenStaffId||"")!==sid){post.staffTokenStaffId=sid;changed=true;}
          if(String(post.staffTokenStaffName||"")!==sn){post.staffTokenStaffName=sn;changed=true;}
        }else if(!active){
          if(post.staffTokenStaffId){post.staffTokenStaffId="";changed=true;}
          if(post.staffTokenStaffName){post.staffTokenStaffName="";changed=true;}
        }
      }
    }
    if(changed&&EDIT_UNLOCKED){DATA_DIRTY=true;} /* cache ST derivata: niente scrittura passiva del PG */
    return changed;
  }
  function staffTokenStopWatchers(){
    try{if(typeof STAFF_TOKEN_STATE.unsubOwner==="function")STAFF_TOKEN_STATE.unsubOwner();}catch(e){}
    try{if(typeof STAFF_TOKEN_STATE.unsubUsage==="function")STAFF_TOKEN_STATE.unsubUsage();}catch(e){}
    STAFF_TOKEN_STATE.unsubOwner=null;STAFF_TOKEN_STATE.unsubUsage=null;
  }
  function staffTokenEnsureWatcher(){
    var pg=String(staffTokenCurrentPgName()||"").trim();
    if(!pg){
      if(STAFF_TOKEN_STATE.pg){staffTokenStopWatchers();}
      STAFF_TOKEN_STATE.pg="";STAFF_TOKEN_STATE.associated=false;STAFF_TOKEN_STATE.loading=false;
      return;
    }
    if(STAFF_TOKEN_STATE.pg===pg&&(STAFF_TOKEN_STATE.unsubOwner||STAFF_TOKEN_STATE.loading))return;
    staffTokenStopWatchers();
    STAFF_TOKEN_STATE.pg=pg;
    STAFF_TOKEN_STATE.loading=true;
    STAFF_TOKEN_STATE.error="";
    STAFF_TOKEN_STATE.associated=false;
    STAFF_TOKEN_STATE.staffId="";
    STAFF_TOKEN_STATE.staffName="";
    STAFF_TOKEN_STATE.balance=0;
    STAFF_TOKEN_STATE.usageLoaded=false;
    STAFF_TOKEN_STATE.usageError="";
    STAFF_TOKEN_STATE.usageById={};

    function start(){
      if(!window.fbWatchStaffTokenForPg){
        setTimeout(start,120);return;
      }
      STAFF_TOKEN_STATE.unsubOwner=window.fbWatchStaffTokenForPg(pg,STAFF_TOKEN_KIND,function(owner){
        var oldAssoc=STAFF_TOKEN_STATE.associated,oldId=STAFF_TOKEN_STATE.staffId,oldBalance=STAFF_TOKEN_STATE.balance;
        STAFF_TOKEN_STATE.loading=false;STAFF_TOKEN_STATE.error="";
        STAFF_TOKEN_STATE.associated=!!owner;
        STAFF_TOKEN_STATE.staffId=owner?String(owner.staffId||""):"";
        STAFF_TOKEN_STATE.staffName=owner?String(owner.staffName||""):"";
        STAFF_TOKEN_STATE.balance=owner?(parseInt(owner.balance,10)||0):0;
        if(currentStep==="blindata"){
          if(oldAssoc!==STAFF_TOKEN_STATE.associated||oldId!==STAFF_TOKEN_STATE.staffId||((oldBalance<=0)!==(STAFF_TOKEN_STATE.balance<=0)))staffTokenScheduleRender();
          else staffTokenRefreshDom();
        }
      },function(e){
        STAFF_TOKEN_STATE.loading=false;STAFF_TOKEN_STATE.error=(e&&e.code)||((e&&e.message)||"error");
        if(currentStep==="blindata"&&STAFF_TOKEN_STATE.associated)staffTokenScheduleRender();
      });
      if(window.fbWatchStaffTokenUsagesForPg){
        STAFF_TOKEN_STATE.unsubUsage=window.fbWatchStaffTokenUsagesForPg(pg,STAFF_TOKEN_KIND,function(list){
          var map={};(Array.isArray(list)?list:[]).forEach(function(x){if(x&&x.id)map[x.id]=x;});
          STAFF_TOKEN_STATE.usageById=map;STAFF_TOKEN_STATE.usageLoaded=true;STAFF_TOKEN_STATE.usageError="";
          var changed=staffTokenApplyUsageCache();
          if(currentStep==="blindata"&&changed)staffTokenScheduleRender();
        },function(e){
          STAFF_TOKEN_STATE.usageLoaded=false;STAFF_TOKEN_STATE.usageError=(e&&e.code)||((e&&e.message)||"error");
        });
      }
    }
    start();
  }
  function appendStaffTokenLiveCard(parent){
    if(!STAFF_TOKEN_STATE.associated)return;
    var box=el("div","staff-token-live");
    var left=el("div","staff-token-live-main");
    left.appendChild(el("div","staff-token-live-title","<i class=\"fa-solid fa-pen-nib\"></i> Staff Token di "+staffTokenOwnerShort(STAFF_TOKEN_STATE.staffName)));
    left.appendChild(el("div","staff-token-live-note","Ogni Staff Token usato su un Post vale <b>+1 PP</b>. Il saldo si aggiorna in tempo reale anche nel Gestore."));
    if(STAFF_TOKEN_STATE.error)left.appendChild(el("div","staff-token-live-error",staffTokenErrorText(STAFF_TOKEN_STATE.error)));
    box.appendChild(left);
    var bal=el("div","staff-token-live-balance");
    bal.innerHTML="<span>Disponibili</span><b data-staff-token-balance>"+STAFF_TOKEN_STATE.balance+" ST</b>";
    box.appendChild(bal);parent.appendChild(box);
  }
  async function setStaffTokenOnPost(post,mese,enabled,opts){
    opts=opts||{};
    if(!post||!mese)return false;
    if(!EDIT_UNLOCKED){if(!opts.silent)alert("Entra in modifica con la Password del PG per usare gli Staff Token.");return false;}
    var staffId=String(post.staffTokenStaffId||STAFF_TOKEN_STATE.staffId||"");
    if(enabled&&!STAFF_TOKEN_STATE.associated){if(!opts.silent)alert("Questo PG non è associato a uno Staffer nel Gestore Staff Token.");return false;}
    if(!staffId){if(!opts.silent)alert("Non trovo lo Staffer proprietario di questo PG.");return false;}
    if(!isValidPostLink(post.link)){if(!opts.silent)alert("Inserisci prima un link valido per il Post.");return false;}
    if(enabled&&STAFF_TOKEN_STATE.balance<=0){if(!opts.silent)alert("Non ci sono Staff Token disponibili.");return false;}
    if(!window.fbSetStaffTokenUsage){if(!opts.silent)alert("Il collegamento Staff Token con Firebase non è ancora disponibile.");return false;}
    var payload=staffTokenPayload(post,mese,enabled);
    payload.staffId=staffId;
    var key=staffTokenUsageIdForPost(post,mese)||[mese.id,post.id].join(":");
    if(STAFF_TOKEN_BUSY[key])return false;
    STAFF_TOKEN_BUSY[key]=true;
    try{
      var res=await window.fbSetStaffTokenUsage(payload);
      if(!res||!res.ok){
        if(!opts.silent)alert(staffTokenErrorText(res&&res.code));
        return false;
      }
      post.staffTokenUsato=enabled===true;
      if(STAFF_TOKEN_STATE.usageLoaded&&key){
        STAFF_TOKEN_STATE.usageById[key]=Object.assign({},STAFF_TOKEN_STATE.usageById[key]||{},payload,{id:key,active:enabled===true,staffId:staffId,staffName:String(STAFF_TOKEN_STATE.staffName||post.staffTokenStaffName||"")});
      }
      if(enabled){
        post.staffTokenStaffId=staffId;
        post.staffTokenStaffName=String(STAFF_TOKEN_STATE.staffName||post.staffTokenStaffName||"");
        post.staffTokenUsedAt=(new Date()).toISOString();
      }else{
        post.staffTokenStaffId="";
        post.staffTokenStaffName="";
        post.staffTokenUsedAt="";
      }
      if(Number.isFinite(Number(res.balance)))STAFF_TOKEN_STATE.balance=parseInt(res.balance,10)||0;
      if(!opts.deferSave){scheduleSave(0);}
      if(!opts.deferRender){renderAll();}
      return true;
    }finally{delete STAFF_TOKEN_BUSY[key];}
  }
  async function syncStaffTokenReference(post,mese){
    if(!post||!mese||!staffTokenIsUsed(post,mese)||!window.fbUpdateStaffTokenUsageReference)return true;
    var payload=staffTokenPayload(post,mese,true);
    payload.staffId=String(post.staffTokenStaffId||STAFF_TOKEN_STATE.staffId||"");
    var res=await window.fbUpdateStaffTokenUsageReference(payload);
    if(!res||!res.ok){alert(staffTokenErrorText(res&&res.code));return false;}
    return true;
  }
  function makeStaffTokenCell(post,mese,locked){
    var td=el("td","staff-token-cell"),used=staffTokenIsUsed(post,mese);
    var btn=el("button","action small staff-token-use"+(used?" active":""));
    btn.type="button";
    btn.setAttribute("data-staff-token-used",used?"1":"0");
    btn.innerHTML=used?"<i class=\"fa-solid fa-check\"></i> ST +1":"<i class=\"fa-solid fa-pen-nib\"></i> Usa ST";
    var busy=!!STAFF_TOKEN_BUSY[staffTokenUsageIdForPost(post,mese)];
    btn.disabled=!!locked||!EDIT_UNLOCKED||!isValidPostLink(post.link)||busy||(!used&&STAFF_TOKEN_STATE.balance<=0);
    if(locked)btn.title="Il Mese è in sola lettura.";
    else if(!EDIT_UNLOCKED)btn.title="Entra in modifica per usare o restituire lo Staff Token.";
    else if(!isValidPostLink(post.link))btn.title="Inserisci prima il link del Post.";
    else if(!used&&STAFF_TOKEN_STATE.balance<=0)btn.title="Nessuno Staff Token disponibile.";
    else btn.title=used?"Clicca per restituire questo Staff Token.":"Usa 1 Staff Token su questo Post (+1 PP).";
    btn.addEventListener(EV,function(){setStaffTokenOnPost(post,mese,!staffTokenIsUsed(post,mese),{});});
    td.appendChild(btn);
    td.appendChild(el("div","staff-token-post-note",used?"+1 PP applicato":"1 ST = +1 PP"));
    return td;
  }


  function staffTokenMonthHasHistory(posts,mese){
    posts=Array.isArray(posts)?posts:[];
    for(var i=0;i<posts.length;i++){
      if(posts[i]&&isValidPostLink(posts[i].link)&&staffTokenIsUsed(posts[i],mese))return true;
    }
    return false;
  }
  function makeStaffTokenHistoricalCell(post,mese){
    var td=el("td","staff-token-cell"),used=staffTokenIsUsed(post,mese);
    if(used){
      td.appendChild(el("span","staff-token-history-badge","<i class=\"fa-solid fa-check\"></i> ST usato"));

    }else{
      td.appendChild(el("span","cb-bonus-none","—"));
    }

  }


  function getAnonymousSessionId(kind){
    var key="ff_tracker_session_"+String(kind||"pg");
    try{
      /* sessionStorage distingue le singole schede/browser-session e sopravvive ai reload della stessa tab. */
      var existing=sessionStorage.getItem(key);
      if(existing){return existing;}
      var id="";
      if(window.crypto && typeof window.crypto.randomUUID==="function"){id=window.crypto.randomUUID();}
      else if(window.crypto && typeof window.crypto.getRandomValues==="function"){
        var a=new Uint32Array(4);window.crypto.getRandomValues(a);id=Array.prototype.map.call(a,function(x){return x.toString(16).padStart(8,"0");}).join("");
      }else{id=Date.now().toString(36)+Math.random().toString(36).slice(2);}
      sessionStorage.setItem(key,id);return id;
    }catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
  }
  function cloneHistoryState(v){try{return JSON.parse(JSON.stringify(v||{}));}catch(e){return {};}}
  /* v57: serializzazione canonica per i confronti di stato. Le chiavi delle mappe
     vengono ordinate ricorsivamente, mentre gli array mantengono il loro ordine
     perché per liste/post/movimenti la posizione resta semanticamente significativa. */
  function stableComparableValue(v){
    if(Array.isArray(v)){return v.map(stableComparableValue);}
    if(v && typeof v === "object"){
      if(v instanceof Date){return v.toISOString();}
      if(typeof v.toJSON === "function"){
        try{return stableComparableValue(v.toJSON());}catch(e){}
      }
      var out={};
      Object.keys(v).sort().forEach(function(k){out[k]=stableComparableValue(v[k]);});
      return out;
    }
    return v;
  }
  function stableComparableJson(v){return JSON.stringify(stableComparableValue(v));}
  /* v49: snapshot immutabile per una singola transazione di salvataggio.
     Clona array e oggetti semplici, ma conserva intatti oggetti Firebase/Date
     (Timestamp ecc.), che sono immutabili e non devono essere convertiti in JSON. */
  function cloneStateForSave(v){
    if(Array.isArray(v)){return v.map(cloneStateForSave);}
    if(v && typeof v === "object"){
      if(v instanceof Date){return new Date(v.getTime());}
      var proto=Object.getPrototypeOf(v);
      if(proto && proto!==Object.prototype){return v;}
      var out={};Object.keys(v).forEach(function(k){out[k]=cloneStateForSave(v[k]);});return out;
    }
    return v;
  }
  /* v50: separa ciò che conta per la persistenza da ciò che deve comparire nel Registro.
     Il draft della Dispensa è un dato persistito e deve quindi partecipare ai confronti
     di salvataggio/race, ma resta escluso dallo storico perché è solo una bozza UI. */
  function persistenceComparableState(v){
    var c=cloneHistoryState(v||{});
    ["_lastModifiedAt","_lastModifiedBy","_lastSessionId","_archiveUnlockUntil"].forEach(function(k){delete c[k];});
    return c;
  }
  /* v51: proietta il documento Firebase sui soli campi realmente gestiti dal
     Tracker. Serve a capire se applyState() ha eseguito una migrazione/normalizzazione
     automatica, ignorando metadati esterni che il Tracker non deve riscrivere. */
  function loadedPersistenceProjection(raw,currentState){
    raw=raw||{};currentState=currentState||{};var projected={};
    Object.keys(currentState).forEach(function(k){
      if(Object.prototype.hasOwnProperty.call(raw,k)){projected[k]=raw[k];}
    });
    return persistenceComparableState(projected);
  }
  /* v117: se Firebase ha avanzato soltanto la revisione tecnica,
     senza cambiare alcun dato dell'Elfo rispetto alla nostra ultima baseline, il
     salvataggio viene riallineato automaticamente. Un vero cambiamento concorrente
     resta invece protetto dal normale avviso di conflitto. */
  function revisionConflictComparable(v){
    var c=cloneHistoryState(v||{});
    ["_schemaVersion","_dbRevision","_pgName","_editPasswordConfigured","_lastModifiedAt","_lastModifiedBy","_lastSessionId","_archiveUnlockUntil","_tutorialState","_dispensaBatchDraft"].forEach(function(k){delete c[k];});
    return c;
  }
  /* Confronta la baseline solo sulla forma realmente presente nel documento remoto.
     I salvataggi più vecchi possono non avere ancora campi/default introdotti da versioni
     successive del tool: quelle assenze non sono una modifica concorrente. */
  function revisionProjectToRemoteShape(base,remote){

  function ensurePermanentGlobalNumbers(){
    var maxN = Math.max(0, num(globalPostCounter, 0));
    for(var i=0;i<MESI.length;i++){
      var mp = Array.isArray(MESI[i].posts) ? MESI[i].posts : [];
      for(var j=0;j<mp.length;j++){
        var p = mp[j];
        if(!p){ continue; }
        var existing = parseInt(p.globalNo,10);
        if(!isNaN(existing) && existing > 0){ if(existing > maxN){ maxN = existing; } }
      }
    }
    /* Migrazione automatica dei salvataggi creati prima della numerazione permanente. */
    for(var mi=0;mi<MESI.length;mi++){
      var posts = Array.isArray(MESI[mi].posts) ? MESI[mi].posts : [];
      for(var pi=0;pi<posts.length;pi++){
        var post = posts[pi];
        if(!post || !isValidPostLink(post.link)){ continue; }
        var n = parseInt(post.globalNo,10);
        if(isNaN(n) || n <= 0){ maxN++; post.globalNo = maxN; DATA_DIRTY=true; }
      }
    }
    globalPostCounter = maxN;
  }
  function ensurePostGlobalNo(post){
    if(!post || !isValidPostLink(post.link)){ return; }
    var n = parseInt(post.globalNo,10);
    if(isNaN(n) || n <= 0){ globalPostCounter++; post.globalNo = globalPostCounter; }
    else if(n > globalPostCounter){ globalPostCounter = n; }
  }
  function nextGlobalPostNumber(){ return Math.max(0,num(globalPostCounter,0)) + 1; }
  function isDraftGeneralPost(post){ return !!(post && /^draft_/.test(String(post.id||""))); }
  function ensurePersistentGeneralPostId(post){

  function generalPostHasPersistenceContent(post){
    if(!post){return false;}
    if(String(post.link||"").trim() || String(post.nota||"").trim() || String(post.pp||"").trim()){return true;}
    if((parseInt(post.globalNo,10)||0)>0 || post.eventoBonusEscluso===true || post.staffTokenUsato===true){return true;}
    if(post.bonusUtilizzi && typeof post.bonusUtilizzi==="object" && Object.keys(post.bonusUtilizzi).length){return true;}
    return false;

  function collectActiveGlobalPostReferences(){
    var refs={};
    function add(n,label){n=parseInt(n,10);if(!(n>0)){return;}if(!refs[n]){refs[n]=[];}if(refs[n].indexOf(label)<0){refs[n].push(label);}}
    function addRange(start,count,label){start=parseInt(start,10);count=parseInt(count,10);if(!(start>0)||!(count>0)){return;}for(var r=0;r<count;r++){add(start+r,label);}}

      if(Object.prototype.hasOwnProperty.call(obj,"startIndex")&&Object.prototype.hasOwnProperty.call(obj,"postRichiesti")){addRange(obj.startIndex,obj.postRichiesti,label);}
      if(Array.isArray(obj)){for(var i=0;i<obj.length;i++){scan(obj[i],label);}return;}
      Object.keys(obj).forEach(function(k){if(k.indexOf("ARCHIVIO_")===0||k==="archivioTotali"||k==="movimenti"||k==="ARCHIVIO_DB"){return;}scan(obj[k],label);});

    for(var c=0;c<CALDERONI.length;c++){scan(CALDERONI[c],"Postazione: "+String(CALDERONI[c].nomePozione||("Calderone "+(c+1))));}

    for(var p=0;p<PIANTE.length;p++){scan(PIANTE[p],"Cubicolo: "+String(PIANTE[p].nome||("Pianta "+(p+1))));}
    for(var pa=0;pa<ARCHIVIO_PIANTE.length;pa++){scan(ARCHIVIO_PIANTE[pa],"Pianta archiviata ripristinabile: "+String(ARCHIVIO_PIANTE[pa].nome||("Pianta "+(pa+1))));}
    for(var r=0;r<CREATURE.length;r++){scan(CREATURE[r],"Recinto: "+String(CREATURE[r].nome||("Creatura "+(r+1))));}

    return refs;
  }

  function archivedMonthDeleteBlockReason(mese){
    if(!mese || !mese.chiuso){return "Il Mese deve essere prima archiviato.";}
    if(fbConnected && !accreditiVerified()){return "Non posso verificare lo stato dell'accredito su Firebase. Riprova quando la connessione è disponibile.";}
    if(monthIsAccredited(mese)){return "Il Mese è già stato accreditato: il Narratore deve prima revocare l'accredito.";}
    if(archiveLocked(mese)){return "L'Archivio è consolidato: il Narratore deve prima usare «Sblocca archivi 24h».";}

    var refs=[];
    var posts=Array.isArray(mese.posts)?mese.posts:[];
    /* Gli Staff Token sono una spesa storica: se il Mese viene eliminato,
       NON vengono rimborsati e non bloccano l'eliminazione. Il saldo e il
       registro Firebase continuano a rappresentare correttamente l'uso già avvenuto. */
    for(var i=0;i<posts.length;i++){
      var p=posts[i];
      if(!p){continue;}
      var labels=globalPostReferenceLabels(p);
      if(labels.length){
        var gn=parseInt(p.globalNo,10);
        refs.push("Post globale n° "+(gn>0?gn:"?")+" ("+labels.join("; ")+")");
      }
    }
    if(refs.length){return "Alcuni Post del Mese sono ancora usati da lavorazioni attive: "+refs.join(" · ");}

  }

  function deleteArchivedMonthAsPlayer(mese){
    var reason=archivedMonthDeleteBlockReason(mese);

      renderAll();
      return;
    }

    var nome=String(mese&&mese.nome||"").trim() || "Mese senza nome";
    var typed=prompt(
      "Stai per eliminare definitivamente dalla Camera Blindata «"+nome+"».\n\n"+
      "Verranno rimossi dal database del PG il Mese, i suoi Post e i suoi Bonus. "+
      "Gli Staff Token già usati in questi Post RESTANO CONSUMATI e registrati nello storico: l’eliminazione del Mese non li rimborsa. "+
      "I numeri globali già assegnati NON verranno riutilizzati.\n\n"+
      "Per confermare, riscrivi esattamente il nome del Mese:"
    );
    if(typed===null){return;}
    if(String(typed).trim()!==nome){
      alert("Nome del Mese non corrispondente. Eliminazione annullata.");
      return;
    }
    if(!confirm("Confermi l'eliminazione definitiva di «"+nome+"»?\n\nIl Mese sparirà dal Tracker e dalla Camera Blindata.")){return;}

    var idx=MESI.indexOf(mese);
    if(idx<0){return;}

    var sk=socialMonthKey(mese.nome);
    if(sk && VERIFICHE_PARAMETRI_SOCIALI[sk]){delete VERIFICHE_PARAMETRI_SOCIALI[sk];}

    MESI.splice(idx,1);

    /* Ricostruisce l'elenco dei Post conservati, ma NON abbassa
       globalPostCounter: i numeri globali eliminati restano buchi storici. */
    recomputePosts();

    if(meseSelezionatoBlindataIdx===idx){
      meseSelezionatoBlindataIdx=Math.min(idx,MESI.length-1);
    }else if(meseSelezionatoBlindataIdx>idx){
      meseSelezionatoBlindataIdx--;
    }
    if(!MESI.length){meseSelezionatoBlindataIdx=-1;}

    DATA_DIRTY=true;
    FORCE_PERSIST_SAVE=true;
    scheduleSave(0);
    renderAll();
  }

    m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    if(m){ return String(m[1]).padStart(2,"0") + "/" + String(m[2]).padStart(2,"0") + "/" + m[3]; }
    var mesiIt = {gennaio:1,febbraio:2,marzo:3,aprile:4,maggio:5,giugno:6,luglio:7,agosto:8,settembre:9,ottobre:10,novembre:11,dicembre:12};
    m = v.toLowerCase().match(/^(\d{1,2})\s+([a-zàèéìòù]+)\s+(\d{4})$/i);
    if(m && mesiIt[m[2]]){ return String(m[1]).padStart(2,"0") + "/" + String(mesiIt[m[2]]).padStart(2,"0") + "/" + m[3]; }
    return v;
  }

  function canonicalStageLabel(stages, label){
    var raw = String(label || "").trim();
    for(var i=0;i<stages.length;i++){
      if(stages[i].label === raw){ return stages[i].label; }
      if(stages[i].label.toLowerCase() === raw.toLowerCase()){ return stages[i].label; }
    }
    var aliases = {
      "infante":"Infanzia", "adolescente":"Adolescenza", "adulta":"Adultità", "anziana":"Vecchiaia",
      "cucciolo":"Uovo/Cucciolo", "uovo":"Uovo/Cucciolo"
    };
    var aliased = aliases[raw.toLowerCase()];
    if(aliased){
      for(var j=0;j<stages.length;j++){ if(stages[j].label === aliased){ return aliased; } }
    }
    return stages.length ? stages[0].label : raw;
  }
  function makeCyclesForStage(stage){
    if(stage.type === "gestazione" || stage.type === "passaggio"){ return { evento: newSubEntry() }; }
    if(stage.type === "cicli"){
      var list = []; for(var i=0;i<stage.count;i++){ list.push(newSubEntry()); }
      return { list:list };
    }
    if(stage.type === "ripro"){
      var list2 = []; for(var j=0;j<stage.count;j++){ list2.push(newSubEntry()); }
      return { evento:newSubEntry(), list:list2 };
    }
    return {};
  }
  function ensureOccupantStageData(occupant, stages){
    if(!occupant.cicli){ occupant.cicli = {}; }
    occupant.faseAttuale = canonicalStageLabel(stages, occupant.faseAttuale);
    for(var i=0;i<stages.length;i++){
      var st = stages[i];
      if(!occupant.cicli[st.key]){ occupant.cicli[st.key] = makeCyclesForStage(st); }
      var data = occupant.cicli[st.key];
      if(st.type === "gestazione" || st.type === "passaggio"){
        if(!data.evento){data.evento=newSubEntry();}
        data.evento=normalizeSubEntry(data.evento);
      }
      if(st.type === "cicli" || st.type === "ripro"){
        if(!Array.isArray(data.list)){ data.list = []; }
        while(data.list.length < st.count){ data.list.push(newSubEntry()); }
        for(var si=0;si<data.list.length;si++){data.list[si]=normalizeSubEntry(data.list[si]);}
      }

  function fallbackCopyText(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
    var ok = false;

  function attachCopy(btnId, sourceId){
    var btn = document.getElementById(btnId);
    if(!btn){ return; }
    btn.addEventListener(EV, function(){
      var src = document.getElementById(sourceId);
      var txt = src.textContent;
      var handledAsync = false;
      if(navigator.clipboard){
        if(navigator.clipboard.writeText){
          handledAsync = true;
          navigator.clipboard.writeText(txt).then(function(){ flashCopied(btn, true); })
            .catch(function(){ var ok = fallbackCopyText(txt); flashCopied(btn, ok); });
        }

    });
  }

  /* ---------- SALVATAGGIO AUTOMATICO UNIVERSALE ---------- */
  function installUniversalAutosave(){
    if(window.__ffUniversalAutosaveInstalled){ return; }
    window.__ffUniversalAutosaveInstalled = true;

    function isEditableControl(target){
      if(!target || !target.matches){ return false; }
      if(!target.matches("input, textarea, select")){ return false; }
      /* Il nome PG prima della connessione non produce comunque scritture: scheduleSave
         esce subito quando fbConnected è false. */
      return true;
    }

    /* v52: il listener globale NON marca DATA_DIRTY a priori. Alcuni input/textarea
       sono temporanei e non fanno parte di collectState(); scheduleSave(..., false)
       lascia al confronto di persistenza il compito di decidere se esiste una modifica reale. */
    /* input copre digitazione e, nei browser moderni, anche l'incolla. */
    document.addEventListener("input", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      setTimeout(function(){captureUndoHistory(false);},0);
      scheduleSave(250, false);
    }, true);

    /* change e focusout rendono persistenti rapidamente anche checkbox, select e campi
       modificati senza dover cambiare schermata. */
    document.addEventListener("change", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      setTimeout(function(){captureUndoHistory(true);},0);
      scheduleSave(80, false);
    }, true);
    document.addEventListener("focusout", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      scheduleSave(80, false);
    }, true);

    document.addEventListener("click", function(ev){
      var b=ev.target&&ev.target.closest?ev.target.closest("button"):null;
      if(!b){return;}
      setTimeout(function(){captureUndoHistory(true);},0);
    }, true);

    /* Fallback esplicito per l'incolla: il salvataggio parte dopo che il browser ha
       effettivamente inserito il testo e l'handler del campo ha aggiornato lo stato. */
    document.addEventListener("paste", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      setTimeout(function(){ scheduleSave(80, false); }, 0);
    }, true);
  }

  /* ---------- NAV ---------- */
  function navDefaultOrder(){
    return STEPS.map(function(s){return s.key;});
  }
  function navLoadOrder(){
    var def=navDefaultOrder(),raw=null;
    try{raw=JSON.parse(localStorage.getItem(NAV_ORDER_STORAGE_KEY)||"null");}catch(e){raw=null;}
    if(!Array.isArray(raw)){return def;}
    var seen={},out=[NAV_FIXED_KEY];seen[NAV_FIXED_KEY]=true;
    for(var i=0;i<raw.length;i++){
      var k=String(raw[i]||"");
      if(k===NAV_FIXED_KEY||seen[k]){continue;}
      if(def.indexOf(k)>=0){out.push(k);seen[k]=true;}
    }
    for(var j=0;j<def.length;j++){if(!seen[def[j]]){out.push(def[j]);seen[def[j]]=true;}}
    return out;
  }
  function navSaveOrder(keys){
    try{localStorage.setItem(NAV_ORDER_STORAGE_KEY,JSON.stringify(keys));}catch(e){}
  }
  function navOrderedSteps(){
    var keys=navLoadOrder(),byKey={};
    for(var i=0;i<STEPS.length;i++){byKey[STEPS[i].key]=STEPS[i];}
    return keys.map(function(k){return byKey[k];}).filter(Boolean);

  function isStepVisibleInNav(step){
    if(!step){ return false; }
    if(step.key === "taccuino" && !STRUTTURE.taccuino){ return false; }
    if(step.key === "dispensa" && !STRUTTURE.dispensa){ return false; }
    if(step.key === "postazione" && !STRUTTURE.postazione){ return false; }
    if(step.key === "cubicolo" && !STRUTTURE.cubicolo){ return false; }
    if(step.key === "recinto" && !STRUTTURE.recinto){ return false; }
    if(step.key === "esporta" && !STRUTTURE.esporta){ return false; }
    return true;
  }
  function navVisibleSteps(){ return navOrderedSteps().filter(isStepVisibleInNav); }
  function navStepByKey(key){
    key=String(key||"");
    for(var i=0;i<STEPS.length;i++){if(STEPS[i]&&STEPS[i].key===key){return STEPS[i];}}
    return null;
  }
  function navCanOpenStepKey(key){var step=navStepByKey(key);return !!(step&&isStepVisibleInNav(step));}
  function navResolvedTargetKey(key){return navCanOpenStepKey(key)?String(key):NAV_FIXED_KEY;}

  var NAV_DRAG_KEY = "";
  var NAV_DRAG_JUST_DROPPED = false;
  function navMoveKeyRelative(key,targetKey,placeAfter){
    var keys=navLoadOrder(),from=keys.indexOf(key),target=keys.indexOf(targetKey);
    if(from<=0||target<0||key===targetKey){return false;}
    keys.splice(from,1);
    target=keys.indexOf(targetKey);
    var insertAt=target+(placeAfter?1:0);
    insertAt=Math.max(1,Math.min(keys.length,insertAt));
    keys.splice(insertAt,0,key);
    navSaveOrder(keys);
    return true;
  }
  function navClearDropMarkers(nav){

  }
  function navDropAfterForPointer(ev,button){
    var r=button.getBoundingClientRect(),midX=r.left+r.width/2,midY=r.top+r.height/2;
    if(Math.abs(ev.clientY-midY)>r.height*.38){return ev.clientY>midY;}
    return ev.clientX>midX;

  function makeNavButtonDraggable(nav,b,s,index){
    b.dataset.navKey=s.key;

    b.draggable=true;
    b.classList.add("nav-draggable");

    b.addEventListener("dragstart",function(ev){
      NAV_DRAG_KEY=s.key;

      if(ev.dataTransfer){ev.dataTransfer.effectAllowed="move";try{ev.dataTransfer.setData("text/plain",s.key);}catch(e){}}
    });
    b.addEventListener("dragend",function(){
      b.classList.remove("nav-dragging");

      NAV_DRAG_KEY="";
    });

      ev.preventDefault();

  function historyUserSnapshot(){
    var st=cloneHistoryState(collectState());
    /* Metadati tecnici Firebase non devono mai tornare indietro. */
    ["_schemaVersion","_dbRevision","_pgName","_lastModifiedAt","_lastModifiedBy","_lastSessionId","_archiveUnlockUntil","_archiviato","RICHIESTA_ELIMINAZIONE"].forEach(function(k){delete st[k];});

  function clearUndoRedoCoalesce(){
    if(HISTORY_COALESCE_TIMER){clearTimeout(HISTORY_COALESCE_TIMER);HISTORY_COALESCE_TIMER=null;}
    HISTORY_COALESCE_ACTIVE=false;
  }

  function trimHistoryStack(stack){
    while(stack.length>HISTORY_MAX){stack.shift();}
  }

  function resetUndoRedoHistory(){
    clearUndoRedoCoalesce();
    UNDO_STACK=[];
    REDO_STACK=[];
    HISTORY_LAST_STATE=fbConnected?historyUserSnapshot():null;
    HISTORY_MOVE_PENDING=false;
    updateUndoRedoButtons();
  }

  function captureUndoHistory(discrete){
    if(!fbConnected||HISTORY_RESTORING||HISTORY_MOVE_PENDING||SAVE_CONFLICT_LOCKED){return;}
    var now=historyUserSnapshot();
    if(!HISTORY_LAST_STATE){
      HISTORY_LAST_STATE=cloneHistoryState(now);
      updateUndoRedoButtons();
      return;
    }
    if(stableComparableJson(now)===stableComparableJson(HISTORY_LAST_STATE)){return;}

    if(discrete){
      clearUndoRedoCoalesce();
      UNDO_STACK.push(cloneHistoryState(HISTORY_LAST_STATE));
      trimHistoryStack(UNDO_STACK);
    }else{
      /* Digitazione/incolla: tutto ciò che avviene in rapida successione
         viene trattato come una sola modifica, non una lettera alla volta. */
      if(!HISTORY_COALESCE_ACTIVE){
        UNDO_STACK.push(cloneHistoryState(HISTORY_LAST_STATE));
        trimHistoryStack(UNDO_STACK);
        HISTORY_COALESCE_ACTIVE=true;
      }
      if(HISTORY_COALESCE_TIMER){clearTimeout(HISTORY_COALESCE_TIMER);}
      HISTORY_COALESCE_TIMER=setTimeout(function(){
        HISTORY_COALESCE_TIMER=null;
        HISTORY_COALESCE_ACTIVE=false;
      },700);
    }

    HISTORY_LAST_STATE=cloneHistoryState(now);
    REDO_STACK=[];
    updateUndoRedoButtons();
  }

  function restoreUndoRedoSnapshot(snapshot){
    if(!snapshot){return false;}

    if(fbSaveTimer){clearTimeout(fbSaveTimer);fbSaveTimer=null;}

    /* applyState() normalizza correttamente tutti i dati del Tool, ma resetta
       anche variabili tecniche. Le preserviamo perché Undo/Redo non deve
       alterare revisione Firebase, sessione o baseline di concorrenza. */
    var keep={
      pgDocExists:PG_DOC_EXISTS,
      dbRevision:DB_REVISION,
      lastPersisted:LAST_PERSISTED_STATE?cloneHistoryState(LAST_PERSISTED_STATE):null,
      lastAudited:LAST_AUDITED_STATE?cloneHistoryState(LAST_AUDITED_STATE):null,
      pendingAudit:PENDING_AUDIT_STATE?cloneHistoryState(PENDING_AUDIT_STATE):null,
      sessionSnapshotDone:SESSION_SNAPSHOT_DONE,
      lastSnapshotMs:LAST_SNAPSHOT_MS,
      lastModifiedAt:LAST_MODIFIED_AT,
      lastModifiedBy:LAST_MODIFIED_BY,
      lastSessionId:LAST_SESSION_ID,
      lastNarratorAt:LAST_NARRATOR_AT,
      lastNarratorAction:LAST_NARRATOR_ACTION,
      archiveUnlockUntil:ARCHIVE_UNLOCK_UNTIL,
      pgArchiviato:PG_ARCHIVIATO,
      deletionRequested:DELETE_REQUESTED,

      accreditiCache:accreditiCache?cloneHistoryState(accreditiCache):accreditiCache,
      accreditiLoadState:ACCREDITI_LOAD_STATE
    };

    var merged=cloneHistoryState(snapshot);
    merged._schemaVersion=28;
    merged._dbRevision=keep.dbRevision;
    merged._pgName=String(STUDENTE.nome||"");
    merged._lastModifiedAt=keep.lastModifiedAt;
    merged._lastModifiedBy=keep.lastModifiedBy;
    merged._lastSessionId=keep.lastSessionId;
    merged._archiveUnlockUntil=keep.archiveUnlockUntil;
    merged._archiviato=keep.pgArchiviato;
    merged.RICHIESTA_ELIMINAZIONE=keep.deletionRequested;

    HISTORY_RESTORING=true;
    applyState(merged);

    PG_DOC_EXISTS=keep.pgDocExists;
    DB_REVISION=keep.dbRevision;
    LAST_PERSISTED_STATE=keep.lastPersisted;
    LAST_AUDITED_STATE=keep.lastAudited;
    PENDING_AUDIT_STATE=keep.pendingAudit;
    SESSION_SNAPSHOT_DONE=keep.sessionSnapshotDone;
    LAST_SNAPSHOT_MS=keep.lastSnapshotMs;
    LAST_MODIFIED_AT=keep.lastModifiedAt;
    LAST_MODIFIED_BY=keep.lastModifiedBy;
    LAST_SESSION_ID=keep.lastSessionId;
    LAST_NARRATOR_AT=keep.lastNarratorAt;
    LAST_NARRATOR_ACTION=keep.lastNarratorAction;
    ARCHIVE_UNLOCK_UNTIL=keep.archiveUnlockUntil;
    PG_ARCHIVIATO=keep.pgArchiviato;
    DELETE_REQUESTED=keep.deletionRequested;

    OPEN_DETAILS=keep.openDetails||{};
    accreditiCache=keep.accreditiCache;
    ACCREDITI_LOAD_STATE=keep.accreditiLoadState;
    HISTORY_RESTORING=false;

    /* applyState() interrompe il listener degli accrediti: lo riattiviamo
       senza buttare la cache già caricata. */
    if(fbConnected && window.fbReady){
      startAccreditiWatch(String(STUDENTE.nome||""),true);
    }

    DATA_DIRTY=true;
    renderAll();
    scheduleSave(0,false);
    return true;
  }

  function runUndoRedo(direction){
    if(HISTORY_MOVE_PENDING||SAVE_CONFLICT_LOCKED||!fbConnected){return;}
    var source=direction==="undo"?UNDO_STACK:REDO_STACK;
    if(!source.length){return;}

    if(SAVE_IN_FLIGHT_PROMISE){
      HISTORY_MOVE_PENDING=true;
      fbStatusText="Attendo il salvataggio prima di "+(direction==="undo"?"annullare…":"ripristinare…");
      updateFbIndicator();updateUndoRedoButtons();
      Promise.resolve(SAVE_IN_FLIGHT_PROMISE).catch(function(){return false;}).then(function(){
        HISTORY_MOVE_PENDING=false;
        updateUndoRedoButtons();
        runUndoRedo(direction);
      });
      return;
    }

    clearUndoRedoCoalesce();
    var current=historyUserSnapshot();
    var target=source.pop();

    if(direction==="undo"){
      REDO_STACK.push(cloneHistoryState(current));
      trimHistoryStack(REDO_STACK);
    }else{
      UNDO_STACK.push(cloneHistoryState(current));
      trimHistoryStack(UNDO_STACK);
    }

    HISTORY_LAST_STATE=cloneHistoryState(target);
    restoreUndoRedoSnapshot(target);
    updateUndoRedoButtons();
  }

  function repairCountersFromData(){
    var changed=false;
    function idNum(v){var n=parseInt(v,10);return (!isNaN(n)&&n>0)?n:0;}
    function maxIds(list){var m=0;if(!Array.isArray(list))return 0;for(var i=0;i<list.length;i++){m=Math.max(m,idNum(list[i]&&list[i].id));}return m;}
    function lift(current,maxv,setter){if(maxv>current){setter(maxv);changed=true;}}
    lift(meseCounter,maxIds(MESI),function(v){meseCounter=v;});
    var maxPost=0;for(var mi=0;mi<MESI.length;mi++){maxPost=Math.max(maxPost,maxIds(MESI[mi]&&MESI[mi].posts));}
    lift(postCounter,maxPost,function(v){postCounter=v;});
    var maxIng=maxIds(DISPENSA.ingredienti);
    if(Array.isArray(DISPENSA.ingredienti)){for(var di=0;di<DISPENSA.ingredienti.length;di++){var aliases=DISPENSA.ingredienti[di]&&DISPENSA.ingredienti[di].legacyIds;if(Array.isArray(aliases)){for(var ai=0;ai<aliases.length;ai++){maxIng=Math.max(maxIng,idNum(aliases[ai]));}}}}
    lift(ingredienteCounter,maxIng,function(v){ingredienteCounter=v;});
    lift(movimentoCounter,maxIds(DISPENSA.movimenti),function(v){movimentoCounter=v;});
    lift(calderoneCounter,Math.max(maxIds(CALDERONI),maxIds(ARCHIVIO_CALDERONI)),function(v){calderoneCounter=v;});
    lift(piantaCounter,Math.max(maxIds(PIANTE),maxIds(ARCHIVIO_PIANTE)),function(v){piantaCounter=v;});
    lift(creaturaCounter,Math.max(maxIds(CREATURE),maxIds(ARCHIVIO_CREATURE)),function(v){creaturaCounter=v;});
    if(changed){DATA_DIRTY=true;}
    return changed;
  }

    if(data.globalPostCounter){ globalPostCounter = data.globalPostCounter; }

    if(typeof STRUTTURE.dispensa === "undefined"){ STRUTTURE.dispensa = false; }
    /* v99: i salvataggi precedenti non conoscono ancora questa preferenza.
       Deve nascere esplicitamente come false, così resta nascosta fino a fine VII anno

  function scheduleAuditForState(savedState){
    PENDING_AUDIT_STATE = null;
    if(savedState){ LAST_AUDITED_STATE = cloneHistoryState(historyComparableState(savedState)); }
    if(auditFlushTimer){ clearTimeout(auditFlushTimer); auditFlushTimer=null; }
  }

  function stateHasUsefulContent(st){
    if(!st)return false;
    try{return JSON.stringify(st).length>450;}catch(e){return true;}
  }

  /* Dopo una transazione che ha protetto un vecchio Mese accreditato, riallinea
     soltanto quel Mese nella copia locale se nel frattempo l'utente non lo ha toccato.
     Così la baseline rappresenta davvero ciò che è stato scritto su Firebase senza
     cancellare modifiche effettuate mentre il salvataggio era in corso. */
  function reconcileAccreditedMonthsAfterSave(sentState,committedState){
    if(!sentState||!committedState||!Array.isArray(sentState.MESI)||!Array.isArray(committedState.MESI)){return;}
    function key(m){m=m||{};var id=String(m.id==null?"":m.id);return id?("id:"+id):("name:"+normalizeMonthName(m.nome||""));}
    var sentByKey={},committedByKey={};
    sentState.MESI.forEach(function(m){sentByKey[key(m)]=m;});
    committedState.MESI.forEach(function(m){committedByKey[key(m)]=m;});
    Object.keys(committedByKey).forEach(function(k){
      var sm=sentByKey[k],cm=committedByKey[k];
      if(sm&&stableComparableJson(sm)===stableComparableJson(cm)){return;}
      var idx=-1;
      for(var i=0;i<MESI.length;i++){if(key(MESI[i])===k){idx=i;break;}}
      if(sm){
        /* Sostituisci solo se la copia visibile è ancora identica a quella inviata. */
        if(idx>=0&&stableComparableJson(MESI[idx])===stableComparableJson(sm)){MESI[idx]=cloneHistoryState(cm);}
      }else if(idx<0){
        /* Mese remoto protetto comparso durante la sessione: rendilo visibile senza
           toccare le altre Camere Blindate. */
        MESI.push(cloneHistoryState(cm));
      }
    });
  }

  function saveStateWithHistory(state){
    /* Congela lo stato di QUESTA operazione: le modifiche UI successive non possono
       mutare per riferimento l'oggetto che verrà scritto dalla transazione. */
    state=cloneStateForSave(state);
    var comparable=persistenceComparableState(state);
    var auditComparable=historyComparableState(state);
    var prev=LAST_PERSISTED_STATE?cloneHistoryState(LAST_PERSISTED_STATE):null;
    var prevAudit=LAST_AUDITED_STATE?cloneHistoryState(LAST_AUDITED_STATE):null;
    var substantiveChange=!!(prevAudit&&stableComparableJson(auditComparable)!==stableComparableJson(prevAudit));
    var destructive=!!(prevAudit&&anyArrayShrank(prevAudit,auditComparable,0));
    var periodic=(Date.now()-LAST_SNAPSHOT_MS)>=SNAPSHOT_INTERVAL_MS;
    /* Le modifiche alla sola bozza multipla non richiedono snapshot: vengono persistite,
       ma non sono modifiche sostanziali allo stato di gioco. */
    var needSnapshot=!!(prev&&stateHasUsefulContent(prev)&&substantiveChange&&(!SESSION_SNAPSHOT_DONE||destructive||periodic));
    var reason=!SESSION_SNAPSHOT_DONE?"Checkpoint prima delle modifiche della sessione":(destructive?"Backup automatico prima di una rimozione":"Checkpoint periodico");
    var snapPromise=Promise.resolve(true), snapshotAttempted=false;
    if(needSnapshot && window.fbCreateSnapshot && window.fbLoadState){
      snapshotAttempted=true;
      /* Fotografa lo stato realmente presente su Firebase PRIMA della nuova
         scrittura: il backup resta verificabile e ripristinabile dal Narratore. */
      snapPromise=window.fbLoadState(STUDENTE.nome).then(function(remoteBefore){
        if(!remoteBefore){ return true; }
        return window.fbCreateSnapshot(STUDENTE.nome,{state:remoteBefore,reason:reason,sessionId:SESSION_ID,sizeBytes:stateSizeBytes(remoteBefore),schemaVersion:28});
      });
    }
    var auditEvent=null, auditTarget=cloneHistoryState(auditComparable);
    if(LAST_AUDITED_STATE){
      var auditChanges=[];
      diffHistory(LAST_AUDITED_STATE,auditTarget,"",auditChanges,0);
      if(auditChanges.length){
        var auditSection=historySection(auditChanges);
        auditEvent={
          section:auditSection,
          summary:"Modifiche in "+auditSection+" ("+auditChanges.length+(auditChanges.length>=30?"+":"")+" variazioni)",
          changes:auditChanges.slice(0,30)
        };
      }
    }
    return Promise.resolve(snapPromise).catch(function(e){console.error(e);return false;}).then(function(snapshotOk){
      if(snapshotAttempted && snapshotOk){ SESSION_SNAPSHOT_DONE=true; LAST_SNAPSHOT_MS=Date.now(); }
      if(snapshotAttempted && !snapshotOk && window.fbLastSaveError && (window.fbLastSaveError.code==="deleted-pg"||window.fbLastSaveError.code==="not-found")){return false;}
      if(destructive && snapshotAttempted && !snapshotOk){ window.fbLastSaveError={code:"snapshot-failed"}; return false; }
      return window.fbSaveState(STUDENTE.nome,state,SESSION_ID,PG_DOC_EXISTS,auditEvent,prev);
    }).then(function(ok){
      if(ok||!window.fbLastSaveError||window.fbLastSaveError.code!=="revision-conflict"){return ok;}
      return tryAutoRebaseRevisionConflict(prev,state).then(function(rebased){
        if(!rebased||!rebased.ok){return false;}
        /* Se il server ha cambiato una SEZIONE DIVERSA da quella modificata localmente,
           inglobiamo quei dati e ritentiamo senza chiedere all'utente di ricaricare. */
        state=cloneStateForSave(rebased.state||state);
        state._dbRevision=DB_REVISION;
        comparable=persistenceComparableState(state);
        auditComparable=historyComparableState(state);
        window.fbLastSaveError=null;
        return window.fbSaveState(STUDENTE.nome,state,SESSION_ID,PG_DOC_EXISTS,auditEvent,prev);
      });
    }).then(function(ok){
      if(ok){
        PG_DOC_EXISTS=true;
        var committedState=(window.fbLastCommittedState&&typeof window.fbLastCommittedState==="object")?cloneStateForSave(window.fbLastCommittedState):cloneStateForSave(state);
        reconcileAccreditedMonthsAfterSave(state,committedState);
        comparable=persistenceComparableState(committedState);
        auditComparable=historyComparableState(committedState);
        var savedRevision=Math.max(DB_REVISION,parseInt(window.fbLastSavedRevision,10)||0);
        DB_REVISION=savedRevision;
        LAST_MODIFIED_AT=new Date(); LAST_MODIFIED_BY="pg"; LAST_SESSION_ID=SESSION_ID;
        /* v50: la baseline deve descrivere ESATTAMENTE ciò che questa transazione
           ha salvato, non lo stato locale eventualmente modificato mentre Firebase
           era ancora in corso. Aggiorniamo soltanto la revisione realmente ottenuta. */
        var savedComparable=cloneHistoryState(comparable);
        savedComparable._dbRevision=savedRevision;
        LAST_PERSISTED_STATE=cloneHistoryState(savedComparable);
        var savedAuditComparable=cloneHistoryState(auditComparable);
        savedAuditComparable._dbRevision=savedRevision;
        LAST_AUDITED_STATE=cloneHistoryState(savedAuditComparable);
        PENDING_AUDIT_STATE=null;
        if(auditFlushTimer){clearTimeout(auditFlushTimer);auditFlushTimer=null;}
        var currentComparable=persistenceComparableState(collectState());
        DATA_DIRTY=stableComparableJson(currentComparable)!==stableComparableJson(LAST_PERSISTED_STATE);
        FORCE_PERSIST_SAVE=false;
      }
      else if(window.fbLastSaveError&&(window.fbLastSaveError.code==="revision-conflict"||window.fbLastSaveError.code==="accredited-month-conflict"||window.fbLastSaveError.code==="deleted-pg"||window.fbLastSaveError.code==="not-found")){lockAfterRevisionConflict(window.fbLastSaveError.code);}
      return ok;
    });
  }

  function serializedSaveLatest(){
    if(DELETING_PG){ return Promise.resolve(true); }
    if(SAVE_IN_FLIGHT_PROMISE){ SAVE_FORCE_AGAIN=true; return SAVE_IN_FLIGHT_PROMISE; }
    SAVE_FORCE_AGAIN=false;
    function loop(){
      var state=collectState(), bytes=stateSizeBytes(state), comparable=persistenceComparableState(state);
      if(bytes>900000){ fbStatusText="Salvataggio troppo grande ("+sizeLabel(bytes)+"): archivia i dati vecchi con il Narratore"; updateFbIndicator(); return Promise.resolve(false); }
      var changed=!LAST_PERSISTED_STATE || stableComparableJson(comparable)!==stableComparableJson(LAST_PERSISTED_STATE);
      /* v55: DATA_DIRTY è solo un indizio UI. La scrittura è necessaria soltanto
         se lo stato netto è diverso, il documento non esiste ancora o una migrazione
         tecnica ha richiesto esplicitamente il consolidamento. */
      if(PG_DOC_EXISTS && !changed && !FORCE_PERSIST_SAVE){
        DATA_DIRTY=false; SAVE_FORCE_AGAIN=false; return Promise.resolve(true);
      }
      if(changed){ DATA_DIRTY=true; }
      SAVE_FORCE_AGAIN=false;
      return saveStateWithHistory(state).then(function(ok){
        if(!ok){ return false; }
        var fresh=persistenceComparableState(collectState());
        var again=SAVE_FORCE_AGAIN || FORCE_PERSIST_SAVE || !LAST_PERSISTED_STATE || stableComparableJson(fresh)!==stableComparableJson(LAST_PERSISTED_STATE);
        SAVE_FORCE_AGAIN=false;
        return again ? loop() : true;
      });
    }
    var work=loop();
    SAVE_IN_FLIGHT_PROMISE=work.then(function(ok){SAVE_IN_FLIGHT_PROMISE=null;return ok;},function(err){SAVE_IN_FLIGHT_PROMISE=null;throw err;});
    return SAVE_IN_FLIGHT_PROMISE;
  }

  function scheduleSave(delayMs, registraModifica){
    if(DELETING_PG){ return; }
    if(fbConnected && !EDIT_UNLOCKED){ updateFbIndicator(); return; }
    if(registraModifica !== false){
      captureUndoHistory(true);
      DATA_DIRTY = true;
    }
    if(SAVE_CONFLICT_LOCKED){fbStatusText="Salvataggio bloccato: ricarica il Tool";updateFbIndicator();return;}
    if(!fbConnected || !window.fbReady){ return; }
    if(fbSaveTimer){ clearTimeout(fbSaveTimer); }
    fbStatusText = "Salvataggio in corso…";
    fbSaveTimer = setTimeout(function(){
      var state = collectState(); var bytes=stateSizeBytes(state); var comparable=persistenceComparableState(state);
      if(bytes>900000){ fbStatusText="Salvataggio troppo grande ("+sizeLabel(bytes)+"): archivia i dati vecchi con il Narratore"; updateFbIndicator(); return; }
      var changed=!LAST_PERSISTED_STATE || stableComparableJson(comparable)!==stableComparableJson(LAST_PERSISTED_STATE);
      if(PG_DOC_EXISTS && !changed && !FORCE_PERSIST_SAVE){ DATA_DIRTY=false; fbStatusText="Salvato su Firebase"; updateFbIndicator(); return; }
      if(changed){ DATA_DIRTY=true; }
      serializedSaveLatest().then(function(ok){
        fbStatusText = ok ? "Salvato su Firebase" : saveErrorStatus();
        updateFbIndicator();
      }).catch(function(e){console.error(e);fbStatusText="Errore nel salvataggio, riprova";updateFbIndicator();});
    }, (typeof delayMs === "number" ? delayMs : 300));
    updateFbIndicator();
  }

  function taccCloudIsMeaningful(data){
    data=data&&typeof data==="object"?data:{};
    if(Array.isArray(data.roles)&&data.roles.length){return true;}
    if(Array.isArray(data.healings)&&data.healings.length){return true;}
    if(data.activityState&&typeof data.activityState==="object"&&Object.keys(data.activityState).length){return true;}
    if(data.activityAlertsInitialized===true){return true;}
    if(Array.isArray(data.customRoleTypes)&&data.customRoleTypes.length){return true;}
    if(Array.isArray(data.png)&&data.png.length){return true;}
    if(Array.isArray(data.relations)&&data.relations.length){return true;}
    if(Array.isArray(data.links)&&data.links.length){return true;}
    if(Array.isArray(data.media)&&data.media.length){return true;}
    if(Array.isArray(data.legacyImports)&&data.legacyImports.length){return true;}
    if(String(data.notes||"").trim()){return true;}
    var ms=data.missions&&typeof data.missions==="object"?data.missions:{};
    return Object.keys(ms).some(function(k){
      var m=ms[k]||{};
      if(m.active||String(m.notes||"").trim()||String(m.period||"").trim()){return true;}
      if(Array.isArray(m.people)&&m.people.length){return true;}
      if(m.counters&&Object.keys(m.counters).some(function(x){return Number(m.counters[x]||0)!==0;})){return true;}
      if(m.entries&&Object.keys(m.entries).some(function(x){return Array.isArray(m.entries[x])&&m.entries[x].length;})){return true;}
      return false;
    });
  }

  function taccSwitchLocalProfile(pg){
    pg=normalizePgName(pg||""); if(!pg){return;}
    var nextKey=taccProfileStorageKey(pg);
    if(TACC_STORAGE_KEY===nextKey){try{localStorage.setItem(TACC_LAST_PROFILE_KEY,pg);}catch(e){} return;}
    var oldKey=TACC_STORAGE_KEY,oldData=TACCUINO,raw=null;
    try{raw=localStorage.getItem(nextKey);}catch(e){}
    if(raw){
      try{TACCUINO=taccNormalize(JSON.parse(raw));}catch(e){TACCUINO=taccDefault();}
    }else if(oldKey===TACC_STORAGE_BASE_KEY&&taccCloudIsMeaningful(oldData)){
      TACCUINO=taccNormalize(oldData);
      try{localStorage.setItem(nextKey,JSON.stringify(TACCUINO));localStorage.removeItem(TACC_STORAGE_BASE_KEY);}catch(e){}
    }else{
      TACCUINO=taccDefault();
      try{localStorage.setItem(nextKey,JSON.stringify(TACCUINO));}catch(e){}
    }
    TACC_STORAGE_KEY=nextKey;

  function taccCloudStoreLocal(data){

      TACC_STORAGE_OK=true; TACC_STATUS="Salvato automaticamente in questo browser";
    }catch(e){
      console.warn("Salvataggio locale del Taccuino cloud fallito",e);

  function taccCloudPush(force){
    if(fbConnected && !EDIT_UNLOCKED){if(force){taccCloudSetStatus("Sola visualizzazione: il Taccuino non viene modificato.",false);}return Promise.resolve(false);}
    var pg=taccCurrentPgName();
    if(!pg||!fbConnected||!window.fbReady){
      if(force){taccCloudSetStatus("Cloud non disponibile finché non carichi il PG nell’Elfo.",true);}
      return Promise.resolve(false);
    }
    /* Se un invio è già in corso, non scartare la nuova richiesta: attendi il primo
       e rilancia una sola sincronizzazione con lo stato più recente del Taccuino. */
    if(TACC_CLOUD_BUSY){
      TACC_CLOUD_PENDING=true;
      var waitForCurrent=TACC_CLOUD_IN_FLIGHT||Promise.resolve(true);
      return waitForCurrent.then(function(){
        if(!TACC_CLOUD_PENDING){return true;}
        TACC_CLOUD_PENDING=false;
        return taccCloudPush(force);
      });
    }
    var bytes=taccCloudBytes(TACCUINO);
    if(bytes>TACC_CLOUD_MAX_BYTES){
      taccCloudSetStatus("Taccuino troppo grande per il backup cloud singolo ("+Math.round(bytes/1024)+" KB). Esporta un backup JSON.",true);
      return Promise.resolve(false);
    }
    clearTimeout(TACC_CLOUD_TIMER); TACC_CLOUD_TIMER=null; TACC_CLOUD_BUSY=true; TACC_CLOUD_PENDING=false;
    taccCloudSetStatus("Sincronizzazione cloud in corso…",false);
    /* Congela i dati di questo invio: eventuali modifiche fatte mentre Firebase
       sta scrivendo verranno spedite dalla richiesta accodata, non mutate per riferimento. */
    var frozen;
    try{frozen=taccNormalize(JSON.parse(JSON.stringify(TACCUINO)));}catch(e){frozen=TACCUINO;}
    var updated=(frozen.meta&&frozen.meta.updatedAt)||new Date().toISOString();
    var payload={schemaVersion:1,pgId:pg,mode:TACC_MODE,updatedAt:updated,data:frozen};
    if(typeof window.fbTaccCloudSave!=="function"){TACC_CLOUD_BUSY=false;taccCloudSetStatus("Cloud non disponibile: helper Firebase non inizializzato",true);return Promise.resolve(false);}
    var work=window.fbTaccCloudSave(TACC_CLOUD_COLLECTION,pg,payload).then(function(){
      TACC_CLOUD_LOGIN_PG=pg; taccCloudSetStatus("Cloud sincronizzato · "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),false);
      return true;
    }).catch(function(e){
      console.error("Sincronizzazione Taccuino Firebase fallita",e);
      taccCloudSetStatus("Cloud non sincronizzato: "+((e&&e.code)?e.code:"controlla le regole Firebase o la connessione"),true);
      return false;
    });
    TACC_CLOUD_IN_FLIGHT=work.finally(function(){TACC_CLOUD_BUSY=false;TACC_CLOUD_IN_FLIGHT=null;});
    return TACC_CLOUD_IN_FLIGHT;
  }
  function taccScheduleCloudSync(){
    if(TACC_CLOUD_APPLYING){return;}
    if(fbConnected && !EDIT_UNLOCKED){return;}
    var pg=taccCurrentPgName();
    if(!pg||!fbConnected||!window.fbReady){taccCloudSetStatus("Copia locale aggiornata · cloud in attesa del caricamento PG",false);return;}
    clearTimeout(TACC_CLOUD_TIMER);
    taccCloudSetStatus("Modifiche locali in attesa di sincronizzazione…",false);
    TACC_CLOUD_TIMER=setTimeout(function(){taccCloudPush(false);},1800);
  }
  function taccCloudSyncAfterLogin(pgName){
    var pg=normalizePgName(pgName||"");
    if(!pg||!window.fbReady){return Promise.resolve(false);}
    taccSwitchLocalProfile(pg);
    /* In sola visualizzazione mostriamo sempre la copia cloud pubblica e non la
       salviamo sopra l'eventuale copia locale del proprietario. Quando la Password
       viene sbloccata, ricarichiamo invece la copia locale e la confrontiamo col cloud. */
    if(EDIT_UNLOCKED){taccReloadLocalForEditing(pg);}
    TACC_CLOUD_LOGIN_PG=pg; clearTimeout(TACC_CLOUD_TIMER); TACC_CLOUD_TIMER=null;
    taccCloudSetStatus(EDIT_UNLOCKED?"Controllo della copia cloud…":"Caricamento del Taccuino pubblico…",false);
    if(typeof window.fbTaccCloudLoad!=="function"){taccCloudSetStatus("Cloud non disponibile: helper Firebase non inizializzato",true);return Promise.resolve(false);}
    return window.fbTaccCloudLoad(TACC_CLOUD_COLLECTION,pg).then(function(remote){
      if(!remote||!remote.exists){
        if(!EDIT_UNLOCKED){
          TACC_CLOUD_APPLYING=true; TACCUINO=taccDefault(); TACC_CLOUD_APPLYING=false;
          taccCloudSetStatus("Taccuino pubblico non ancora sincronizzato",false); renderAll(); return true;
        }
        if(taccCloudIsMeaningful(TACCUINO)){return taccCloudPush(true);}
        taccCloudSetStatus("Cloud pronto · nessun backup ancora presente",false); return true;
      }
      var envelope=remote.data||{},cloud=taccNormalize(envelope.data||{});
      if(!EDIT_UNLOCKED){
        TACC_CLOUD_APPLYING=true; TACCUINO=cloud; TACC_CLOUD_APPLYING=false;
        taccCloudSetStatus("Taccuino pubblico aggiornato dal cloud",false); renderAll(); return true;
      }
      var localMeaning=taccCloudIsMeaningful(TACCUINO),cloudMeaning=taccCloudIsMeaningful(cloud);
      var lt=Date.parse((TACCUINO.meta&&TACCUINO.meta.updatedAt)||"")||0;
      var ct=Date.parse(envelope.updatedAt||(cloud.meta&&cloud.meta.updatedAt)||"")||0;
      if(!localMeaning&&cloudMeaning){
        TACC_CLOUD_APPLYING=true; taccCloudStoreLocal(cloud); TACC_CLOUD_APPLYING=false;
        taccCloudSetStatus("Copia cloud recuperata su questo dispositivo",false); renderAll(); return true;
      }
      if(localMeaning&&!cloudMeaning){return taccCloudPush(true);}
      if(ct>lt){
        TACC_CLOUD_APPLYING=true; taccCloudStoreLocal(cloud); TACC_CLOUD_APPLYING=false;
        taccCloudSetStatus("Copia cloud più recente recuperata",false); renderAll(); return true;
      }
      if(lt>ct){return taccCloudPush(true);}
      taccCloudSetStatus("Locale e cloud sono già allineati",false); return true;
    }).catch(function(e){
      console.error("Lettura Taccuino Firebase fallita",e);
      taccCloudSetStatus("Cloud non disponibile: "+((e&&e.code)?e.code:"controlla le regole Firebase o la connessione"),true);
      return false;
    });
  }
  function taccSave(){
    if(taccCurrentPgName()&&!EDIT_UNLOCKED){taccCloudSetStatus("Sola visualizzazione: inserisci la Password per modificare il Taccuino.",false);return false;}
    TACCUINO.meta=TACCUINO.meta||{}; TACCUINO.meta.updatedAt=new Date().toISOString();
    var ok=true;
    try{
      localStorage.setItem(TACC_STORAGE_KEY,JSON.stringify(TACCUINO));
      TACC_STORAGE_OK=true; TACC_STATUS="Salvato automaticamente in questo browser";
    }catch(e){

      TACC_STORAGE_OK=false; TACC_STATUS="Salvataggio locale non riuscito: la copia cloud può comunque funzionare, ma esporta anche un backup JSON."; ok=false;
    }
    taccScheduleCloudSync();
    return ok;
  }
