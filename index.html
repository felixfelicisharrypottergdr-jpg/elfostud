<div style="width:100%;max-width:1400px;margin:0 auto;overflow:hidden;">
  <iframe
    id="trackerFrame"
    src="URL_GITHUB_TRACKER_STUDENTI"
    style="display:block;width:100%;height:700px;min-height:0!important;border:0;margin:0;padding:0;overflow:hidden;"
    scrolling="no"
    frameborder="0"
    allow="clipboard-write">
  </iframe>
</div>

<script type="text/javascript">
(function(){
  var frame=document.getElementById("trackerFrame");
  if(!frame){return;}

  function applicaAltezza(valore){
    var h=Math.ceil(Number(valore));
    if(!isFinite(h)||h<100){return;}

    frame.style.setProperty("height",(h+4)+"px","important");
    frame.style.setProperty("min-height","0px","important");
    frame.setAttribute("height",String(h+4));
  }

  window.addEventListener("message",function(event){
    if(event.source!==frame.contentWindow){return;}

    var data=event.data||{};
    if(data.tipo!=="felix-tool-height"){return;}

    applicaAltezza(
      data.height!=null ? data.height : data.altezza
    );
  });

  function chiediAltezza(){
    try{
      frame.contentWindow.postMessage(
        {tipo:"felix-tool-height-request"},
        "*"
      );
    }catch(e){}
  }

  frame.addEventListener("load",function(){
    chiediAltezza();
    window.setTimeout(chiediAltezza,150);
    window.setTimeout(chiediAltezza,600);
  });
})();
</script>
