  /* v118 - CB: l'aggiornamento/rimozione dei Premi a utilizzi

  function txAccreditedMonthBase(month){

  function txAccreditedMonthEquivalent(remoteMonth,proposedMonth){

  window.fbSaveState = function(pgId, dataObj, sessionId, mustAlreadyExist, auditObj){

  }

  function normalizeDateText(v){
    v = String(v || "").trim();
    if(v === ""){ return ""; }
    var m;
    m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m){ return String(m[3]).padStart(2,"0") + "/" + String(m[2]).padStart(2,"0") + "/" + m[1]; }
    m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    if(m){ return String(m[1]).padStart(2,"0") + "/" + String(m[2]).padStart(2,"0") + "/" + m[3]; }
    var mesiIt = {gennaio:1,febbraio:2,marzo:3,aprile:4,maggio:5,giugno:6,luglio:7,agosto:8,settembre:9,ottobre:10,novembre:11,dicembre:12};
    m = v.toLowerCase().match(/^(\d{1,2})\s+([a-zàèéìòù]+)\s+(\d{4})$/i);
    if(m && mesiIt[m[2]]){ return String(m[1]).padStart(2,"0") + "/" + String(mesiIt[m[2]]).padStart(2,"0") + "/" + m[3]; }
    return v;
  }
  function buildDateInput(currentValue, onValue){

    i.title = "Formato data: GG/MM/AAAA";

    }
    i.addEventListener("input", function(){ onValue(i.value); scheduleSave(250); });
    i.addEventListener("change", syncDate);
    i.addEventListener("blur", syncDate);
    return i;
  }
  function stageIndex(stages, label){
    for(var i=0;i<stages.length;i++){ if(stages[i].label === label){ return i; } }
    return -1;
  }
  function canonicalStageLabel(stages, label){
    var raw = String(label || "").trim();
    for(var i=0;i<stages.length;i++){
      if(stages[i].label === raw){ return stages[i].label; }
      if(stages[i].label.toLowerCase() === raw.toLowerCase()){ return stages[i].label; }
    }
    var aliases = {
      "infante":"Infanzia", "adolescente":"Adolescenza", "adulta":"Adultità", "anziana":"Vecchiaia",
      "cucciolo":"Uovo/Cucciolo", "uovo":"Uovo/Cucciolo"
    };
    var aliased = aliases[raw.toLowerCase()];
    if(aliased){
      for(var j=0;j<stages.length;j++){ if(stages[j].label === aliased){ return aliased; } }
    }
    return stages.length ? stages[0].label : raw;
  }
  function makeCyclesForStage(stage){
    if(stage.type === "gestazione"){ return { evento: newSubEntry() }; }
    if(stage.type === "cicli"){
      var list = []; for(var i=0;i<stage.count;i++){ list.push(newSubEntry()); }
      return { list:list };
    }
    if(stage.type === "ripro"){
      var list2 = []; for(var j=0;j<stage.count;j++){ list2.push(newSubEntry()); }
      return { evento:newSubEntry(), list:list2 };
    }
    return {};
  }
  function ensureOccupantStageData(occupant, stages){
    if(!occupant.cicli){ occupant.cicli = {}; }
    occupant.faseAttuale = canonicalStageLabel(stages, occupant.faseAttuale);
    for(var i=0;i<stages.length;i++){
      var st = stages[i];
      if(!occupant.cicli[st.key]){ occupant.cicli[st.key] = makeCyclesForStage(st); }
      var data = occupant.cicli[st.key];
      if(st.type === "gestazione"){ if(!data.evento){ data.evento = newSubEntry(); } }
      if(st.type === "cicli" || st.type === "ripro"){
        if(!Array.isArray(data.list)){ data.list = []; }
        while(data.list.length < st.count){ data.list.push(newSubEntry()); }
      }
      if(st.type === "ripro" && !data.evento){ data.evento = newSubEntry(); }
    }
  }

  function fallbackCopyText(txt){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
    var ok = false;

  function attachCopy(btnId, sourceId){
    var btn = document.getElementById(btnId);
    if(!btn){ return; }
    btn.addEventListener(EV, function(){
      var src = document.getElementById(sourceId);
      var txt = src.textContent;
      var handledAsync = false;
      if(navigator.clipboard){
        if(navigator.clipboard.writeText){
          handledAsync = true;
          navigator.clipboard.writeText(txt).then(function(){ flashCopied(btn, true); })
            .catch(function(){ var ok = fallbackCopyText(txt); flashCopied(btn, ok); });
        }
      }
      if(!handledAsync){ var ok2 = fallbackCopyText(txt); flashCopied(btn, ok2); }
    });
  }

  function installUniversalAutosave(){
    if(window.__ffUniversalAutosaveInstalled){ return; }
    window.__ffUniversalAutosaveInstalled = true;

    function isEditableControl(target){
      if(!target || !target.matches){ return false; }
      if(!target.matches("input, textarea, select")){ return false; }
      /* Il nome PG prima della connessione non produce comunque scritture: scheduleSave
         esce subito quando fbConnected è false. */
      return true;
    }

    /* v52: il listener globale NON marca DATA_DIRTY a priori. Alcuni input/textarea
       sono temporanei e non fanno parte di collectState(); scheduleSave(..., false)
       lascia al confronto di persistenza il compito di decidere se esiste una modifica reale. */
    /* input copre digitazione e, nei browser moderni, anche l'incolla. */
    document.addEventListener("input", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      setTimeout(function(){captureUndoHistory(false);},0);
      scheduleSave(250, false);
    }, true);

    /* change e focusout rendono persistenti rapidamente anche checkbox, select e campi
       modificati senza dover cambiare schermata. */
    document.addEventListener("change", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      setTimeout(function(){captureUndoHistory(true);},0);
      scheduleSave(80, false);
    }, true);
    document.addEventListener("focusout", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      scheduleSave(80, false);
    }, true);

    document.addEventListener("click", function(ev){
      var b=ev.target&&ev.target.closest?ev.target.closest("button"):null;
      if(!b){return;}
      setTimeout(function(){captureUndoHistory(true);},0);
    }, true);

    /* Fallback esplicito per l'incolla: il salvataggio parte dopo che il browser ha
       effettivamente inserito il testo e l'handler del campo ha aggiornato lo stato. */
    document.addEventListener("paste", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      setTimeout(function(){ scheduleSave(80, false); }, 0);
    }, true);
  }

  /* ANNULLA / RIPRISTINA — cronologia della sessione      */
  /* ==================================================== */
  var UNDO_STACK = [];
  var REDO_STACK = [];
  var HISTORY_LAST_STATE = null;
  var HISTORY_COALESCE_ACTIVE = false;
  var HISTORY_COALESCE_TIMER = null;
  var HISTORY_RESTORING = false;
  var HISTORY_MOVE_PENDING = false;
  var HISTORY_MAX = 30;

  function historyUserSnapshot(){
    var st=cloneHistoryState(collectState());
    /* Metadati tecnici Firebase non devono mai tornare indietro. */
    ["_schemaVersion","_dbRevision","_pgName","_lastModifiedAt","_lastModifiedBy","_lastSessionId","_archiveUnlockUntil","_archiviato"].forEach(function(k){delete st[k];});
    return st;
  }

  function updateUndoRedoButtons(){
    var u=document.getElementById("undo-session-btn");
    var r=document.getElementById("redo-session-btn");
    var blocked=HISTORY_MOVE_PENDING||SAVE_CONFLICT_LOCKED||!fbConnected;
    if(u){u.disabled=blocked||UNDO_STACK.length===0;u.title=UNDO_STACK.length?"Annulla l'ultima modifica ai dati":"Nessuna modifica da annullare";}
    if(r){r.disabled=blocked||REDO_STACK.length===0;r.title=REDO_STACK.length?"Ripristina l'ultima modifica annullata":"Nessuna modifica da ripristinare";}
  }

  function clearUndoRedoCoalesce(){
    if(HISTORY_COALESCE_TIMER){clearTimeout(HISTORY_COALESCE_TIMER);HISTORY_COALESCE_TIMER=null;}
    HISTORY_COALESCE_ACTIVE=false;
  }

  function trimHistoryStack(stack){
    while(stack.length>HISTORY_MAX){stack.shift();}
  }

  function resetUndoRedoHistory(){
    clearUndoRedoCoalesce();
    UNDO_STACK=[];
    REDO_STACK=[];
    HISTORY_LAST_STATE=fbConnected?historyUserSnapshot():null;
    HISTORY_MOVE_PENDING=false;
    updateUndoRedoButtons();
  }

  function captureUndoHistory(discrete){
    if(!fbConnected||HISTORY_RESTORING||HISTORY_MOVE_PENDING||SAVE_CONFLICT_LOCKED){return;}
    var now=historyUserSnapshot();
    if(!HISTORY_LAST_STATE){
      HISTORY_LAST_STATE=cloneHistoryState(now);
      updateUndoRedoButtons();
      return;
    }
    if(stableComparableJson(now)===stableComparableJson(HISTORY_LAST_STATE)){return;}

    if(discrete){
      clearUndoRedoCoalesce();
      UNDO_STACK.push(cloneHistoryState(HISTORY_LAST_STATE));
      trimHistoryStack(UNDO_STACK);
    }else{
      /* Digitazione/incolla: tutto ciò che avviene in rapida successione
         viene trattato come una sola modifica, non una lettera alla volta. */
      if(!HISTORY_COALESCE_ACTIVE){
        UNDO_STACK.push(cloneHistoryState(HISTORY_LAST_STATE));
        trimHistoryStack(UNDO_STACK);
        HISTORY_COALESCE_ACTIVE=true;
      }
      if(HISTORY_COALESCE_TIMER){clearTimeout(HISTORY_COALESCE_TIMER);}
      HISTORY_COALESCE_TIMER=setTimeout(function(){
        HISTORY_COALESCE_TIMER=null;
        HISTORY_COALESCE_ACTIVE=false;
      },700);
    }

    HISTORY_LAST_STATE=cloneHistoryState(now);
    REDO_STACK=[];
    updateUndoRedoButtons();
  }

  function restoreUndoRedoSnapshot(snapshot){
    if(!snapshot){return false;}

    if(fbSaveTimer){clearTimeout(fbSaveTimer);fbSaveTimer=null;}

    /* applyState() normalizza correttamente tutti i dati del Tool, ma resetta
       anche variabili tecniche. Le preserviamo perché Undo/Redo non deve
       alterare revisione Firebase, sessione o baseline di concorrenza. */
    var keep={
      pgDocExists:PG_DOC_EXISTS,
      dbRevision:DB_REVISION,
      lastPersisted:LAST_PERSISTED_STATE?cloneHistoryState(LAST_PERSISTED_STATE):null,
      lastAudited:LAST_AUDITED_STATE?cloneHistoryState(LAST_AUDITED_STATE):null,
      pendingAudit:PENDING_AUDIT_STATE?cloneHistoryState(PENDING_AUDIT_STATE):null,
      sessionSnapshotDone:SESSION_SNAPSHOT_DONE,
      lastSnapshotMs:LAST_SNAPSHOT_MS,
      lastModifiedAt:LAST_MODIFIED_AT,
      lastModifiedBy:LAST_MODIFIED_BY,
      lastSessionId:LAST_SESSION_ID,
      lastNarratorAt:LAST_NARRATOR_AT,
      lastNarratorAction:LAST_NARRATOR_ACTION,
      archiveUnlockUntil:ARCHIVE_UNLOCK_UNTIL,
      pgArchiviato:PG_ARCHIVIATO,
      forcePersist:FORCE_PERSIST_SAVE,
      conflictLocked:SAVE_CONFLICT_LOCKED,
      openDetails:cloneHistoryState(OPEN_DETAILS),
      accreditiCache:accreditiCache?cloneHistoryState(accreditiCache):accreditiCache,
      accreditiLoadState:ACCREDITI_LOAD_STATE
    };

    var merged=cloneHistoryState(snapshot);
    merged._schemaVersion=25;
    merged._dbRevision=keep.dbRevision;
    merged._pgName=String(STUDENTE.nome||"");
    merged._lastModifiedAt=keep.lastModifiedAt;
    merged._lastModifiedBy=keep.lastModifiedBy;
    merged._lastSessionId=keep.lastSessionId;
    merged._archiveUnlockUntil=keep.archiveUnlockUntil;
    merged._archiviato=keep.pgArchiviato;

    HISTORY_RESTORING=true;
    applyState(merged);

    PG_DOC_EXISTS=keep.pgDocExists;
    DB_REVISION=keep.dbRevision;
    LAST_PERSISTED_STATE=keep.lastPersisted;
    LAST_AUDITED_STATE=keep.lastAudited;
    PENDING_AUDIT_STATE=keep.pendingAudit;
    SESSION_SNAPSHOT_DONE=keep.sessionSnapshotDone;
    LAST_SNAPSHOT_MS=keep.lastSnapshotMs;
    LAST_MODIFIED_AT=keep.lastModifiedAt;
    LAST_MODIFIED_BY=keep.lastModifiedBy;
    LAST_SESSION_ID=keep.lastSessionId;
    LAST_NARRATOR_AT=keep.lastNarratorAt;
    LAST_NARRATOR_ACTION=keep.lastNarratorAction;
    ARCHIVE_UNLOCK_UNTIL=keep.archiveUnlockUntil;
    PG_ARCHIVIATO=keep.pgArchiviato;
    FORCE_PERSIST_SAVE=keep.forcePersist;
    SAVE_CONFLICT_LOCKED=keep.conflictLocked;
    OPEN_DETAILS=keep.openDetails||{};
    accreditiCache=keep.accreditiCache;
    ACCREDITI_LOAD_STATE=keep.accreditiLoadState;
    HISTORY_RESTORING=false;

    /* applyState() interrompe il listener degli accrediti: lo riattiviamo
       senza buttare la cache già caricata. */
    if(fbConnected && window.fbReady){
      startAccreditiWatch(String(STUDENTE.nome||""),true);
    }

    DATA_DIRTY=true;
    renderAll();
    scheduleSave(0,false);
    return true;
  }

  function runUndoRedo(direction){
    if(HISTORY_MOVE_PENDING||SAVE_CONFLICT_LOCKED||!fbConnected){return;}
    var source=direction==="undo"?UNDO_STACK:REDO_STACK;
    if(!source.length){return;}

    if(SAVE_IN_FLIGHT_PROMISE){
      HISTORY_MOVE_PENDING=true;
      fbStatusText="Attendo il salvataggio prima di "+(direction==="undo"?"annullare…":"ripristinare…");
      updateFbIndicator();updateUndoRedoButtons();
      Promise.resolve(SAVE_IN_FLIGHT_PROMISE).catch(function(){return false;}).then(function(){
        HISTORY_MOVE_PENDING=false;
        updateUndoRedoButtons();
        runUndoRedo(direction);
      });
      return;
    }

    clearUndoRedoCoalesce();
    var current=historyUserSnapshot();
    var target=source.pop();

    if(direction==="undo"){
      REDO_STACK.push(cloneHistoryState(current));
      trimHistoryStack(REDO_STACK);
    }else{
      UNDO_STACK.push(cloneHistoryState(current));
      trimHistoryStack(UNDO_STACK);
    }

    HISTORY_LAST_STATE=cloneHistoryState(target);
    restoreUndoRedoSnapshot(target);
    updateUndoRedoButtons();
  }

    updateUndoRedoButtons();
  }

  function repairCountersFromData(){
    var changed=false;
    function idNum(v){var n=parseInt(v,10);return (!isNaN(n)&&n>0)?n:0;}
    function maxIds(list){var m=0;if(!Array.isArray(list))return 0;for(var i=0;i<list.length;i++){m=Math.max(m,idNum(list[i]&&list[i].id));}return m;}
    function lift(current,maxv,setter){if(maxv>current){setter(maxv);changed=true;}}
    lift(meseCounter,maxIds(MESI),function(v){meseCounter=v;});
    var maxPost=0;for(var mi=0;mi<MESI.length;mi++){maxPost=Math.max(maxPost,maxIds(MESI[mi]&&MESI[mi].posts));}
    lift(postCounter,maxPost,function(v){postCounter=v;});
    var maxIng=maxIds(DISPENSA.ingredienti);
    if(Array.isArray(DISPENSA.ingredienti)){for(var di=0;di<DISPENSA.ingredienti.length;di++){var aliases=DISPENSA.ingredienti[di]&&DISPENSA.ingredienti[di].legacyIds;if(Array.isArray(aliases)){for(var ai=0;ai<aliases.length;ai++){maxIng=Math.max(maxIng,idNum(aliases[ai]));}}}}
    lift(ingredienteCounter,maxIng,function(v){ingredienteCounter=v;});
    lift(movimentoCounter,maxIds(DISPENSA.movimenti),function(v){movimentoCounter=v;});
    lift(calderoneCounter,Math.max(maxIds(CALDERONI),maxIds(ARCHIVIO_CALDERONI)),function(v){calderoneCounter=v;});
    lift(piantaCounter,Math.max(maxIds(PIANTE),maxIds(ARCHIVIO_PIANTE)),function(v){piantaCounter=v;});
    lift(creaturaCounter,Math.max(maxIds(CREATURE),maxIds(ARCHIVIO_CREATURE)),function(v){creaturaCounter=v;});
    if(changed){DATA_DIRTY=true;}
    return changed;
  }

  function scheduleAuditForState(savedState){
    PENDING_AUDIT_STATE = null;
    if(savedState){ LAST_AUDITED_STATE = cloneHistoryState(historyComparableState(savedState)); }
    if(auditFlushTimer){ clearTimeout(auditFlushTimer); auditFlushTimer=null; }
  }
  function flushAuditNow(){

    PENDING_AUDIT_STATE = null;
    return Promise.resolve(true);
  }
  function stateHasUsefulContent(st){
    if(!st)return false;
    try{return JSON.stringify(st).length>450;}catch(e){return true;}
  }
  function saveStateWithHistory(state){
    /* Congela lo stato di QUESTA operazione: le modifiche UI successive non possono
       mutare per riferimento l'oggetto che verrà scritto dalla transazione. */
    state=cloneStateForSave(state);
    var comparable=persistenceComparableState(state);
    var auditComparable=historyComparableState(state);
    var prev=LAST_PERSISTED_STATE?cloneHistoryState(LAST_PERSISTED_STATE):null;
    var prevAudit=LAST_AUDITED_STATE?cloneHistoryState(LAST_AUDITED_STATE):null;
    var substantiveChange=!!(prevAudit&&stableComparableJson(auditComparable)!==stableComparableJson(prevAudit));
    var destructive=!!(prevAudit&&anyArrayShrank(prevAudit,auditComparable,0));
    var periodic=(Date.now()-LAST_SNAPSHOT_MS)>=SNAPSHOT_INTERVAL_MS;
    /* Le modifiche alla sola bozza multipla non richiedono snapshot: vengono persistite,
       ma non sono modifiche sostanziali allo stato di gioco. */
    var needSnapshot=!!(prev&&stateHasUsefulContent(prev)&&substantiveChange&&(!SESSION_SNAPSHOT_DONE||destructive||periodic));
    var reason=!SESSION_SNAPSHOT_DONE?"Checkpoint prima delle modifiche della sessione":(destructive?"Backup automatico prima di una rimozione":"Checkpoint periodico");
    var snapPromise=Promise.resolve(true), snapshotAttempted=false;
    if(needSnapshot && window.fbCreateSnapshot && window.fbLoadState){
      snapshotAttempted=true;
      /* Fotografa lo stato realmente presente su Firebase PRIMA della nuova
         scrittura: il backup resta verificabile e ripristinabile dal Narratore. */
      snapPromise=window.fbLoadState(STUDENTE.nome).then(function(remoteBefore){
        if(!remoteBefore){ return true; }
        return window.fbCreateSnapshot(STUDENTE.nome,{state:remoteBefore,reason:reason,sessionId:SESSION_ID,sizeBytes:stateSizeBytes(remoteBefore),schemaVersion:25});
      });
    }
    var auditEvent=null, auditTarget=cloneHistoryState(auditComparable);
    if(LAST_AUDITED_STATE){
      var auditChanges=[];
      diffHistory(LAST_AUDITED_STATE,auditTarget,"",auditChanges,0);
      if(auditChanges.length){
        var auditSection=historySection(auditChanges);
        auditEvent={
          section:auditSection,
          summary:"Modifiche in "+auditSection+" ("+auditChanges.length+(auditChanges.length>=30?"+":"")+" variazioni)",
          changes:auditChanges.slice(0,30)
        };
      }
    }
    return Promise.resolve(snapPromise).catch(function(e){console.error(e);return false;}).then(function(snapshotOk){
      if(snapshotAttempted && snapshotOk){ SESSION_SNAPSHOT_DONE=true; LAST_SNAPSHOT_MS=Date.now(); }
      if(snapshotAttempted && !snapshotOk && window.fbLastSaveError && (window.fbLastSaveError.code==="deleted-pg"||window.fbLastSaveError.code==="not-found")){return false;}
      if(destructive && snapshotAttempted && !snapshotOk){ window.fbLastSaveError={code:"snapshot-failed"}; return false; }
      return window.fbSaveState(STUDENTE.nome,state,SESSION_ID,PG_DOC_EXISTS,auditEvent);
    }).then(function(ok){
      if(ok){
        PG_DOC_EXISTS=true;
        var savedRevision=Math.max(DB_REVISION,parseInt(window.fbLastSavedRevision,10)||0);
        DB_REVISION=savedRevision;
        LAST_MODIFIED_AT=new Date(); LAST_MODIFIED_BY="pg"; LAST_SESSION_ID=SESSION_ID;
        /* v50: la baseline deve descrivere ESATTAMENTE ciò che questa transazione
           ha salvato, non lo stato locale eventualmente modificato mentre Firebase
           era ancora in corso. Aggiorniamo soltanto la revisione realmente ottenuta. */
        var savedComparable=cloneHistoryState(comparable);
        savedComparable._dbRevision=savedRevision;
        LAST_PERSISTED_STATE=cloneHistoryState(savedComparable);
        var savedAuditComparable=cloneHistoryState(auditComparable);
        savedAuditComparable._dbRevision=savedRevision;
        LAST_AUDITED_STATE=cloneHistoryState(savedAuditComparable);
        PENDING_AUDIT_STATE=null;
        if(auditFlushTimer){clearTimeout(auditFlushTimer);auditFlushTimer=null;}
        var currentComparable=persistenceComparableState(collectState());
        DATA_DIRTY=stableComparableJson(currentComparable)!==stableComparableJson(LAST_PERSISTED_STATE);
        FORCE_PERSIST_SAVE=false;
      }
      else if(window.fbLastSaveError&&(window.fbLastSaveError.code==="revision-conflict"||window.fbLastSaveError.code==="accredited-month-conflict"||window.fbLastSaveError.code==="deleted-pg"||window.fbLastSaveError.code==="not-found")){lockAfterRevisionConflict(window.fbLastSaveError.code);}
      return ok;
    });
  }

  function serializedSaveLatest(){
    if(DELETING_PG){ return Promise.resolve(true); }
    if(SAVE_IN_FLIGHT_PROMISE){ SAVE_FORCE_AGAIN=true; return SAVE_IN_FLIGHT_PROMISE; }
    SAVE_FORCE_AGAIN=false;
    function loop(){
      var state=collectState(), bytes=stateSizeBytes(state), comparable=persistenceComparableState(state);
      if(bytes>900000){ fbStatusText="Salvataggio troppo grande ("+sizeLabel(bytes)+"): archivia i dati vecchi con il Narratore"; updateFbIndicator(); return Promise.resolve(false); }
      var changed=!LAST_PERSISTED_STATE || stableComparableJson(comparable)!==stableComparableJson(LAST_PERSISTED_STATE);
      /* v55: DATA_DIRTY è solo un indizio UI. La scrittura è necessaria soltanto
         se lo stato netto è diverso, il documento non esiste ancora o una migrazione
         tecnica ha richiesto esplicitamente il consolidamento. */
      if(PG_DOC_EXISTS && !changed && !FORCE_PERSIST_SAVE){
        DATA_DIRTY=false; SAVE_FORCE_AGAIN=false; return Promise.resolve(true);
      }
      if(changed){ DATA_DIRTY=true; }
      SAVE_FORCE_AGAIN=false;
      return saveStateWithHistory(state).then(function(ok){
        if(!ok){ return false; }
        var fresh=persistenceComparableState(collectState());
        var again=SAVE_FORCE_AGAIN || FORCE_PERSIST_SAVE || !LAST_PERSISTED_STATE || stableComparableJson(fresh)!==stableComparableJson(LAST_PERSISTED_STATE);
        SAVE_FORCE_AGAIN=false;
        return again ? loop() : true;
      });
    }
    var work=loop();
    SAVE_IN_FLIGHT_PROMISE=work.then(function(ok){SAVE_IN_FLIGHT_PROMISE=null;return ok;},function(err){SAVE_IN_FLIGHT_PROMISE=null;throw err;});
    return SAVE_IN_FLIGHT_PROMISE;
  }

  function scheduleSave(delayMs, registraModifica){
    if(DELETING_PG){ return; }
    if(registraModifica !== false){
      captureUndoHistory(true);
      DATA_DIRTY = true;
    }
    if(SAVE_CONFLICT_LOCKED){fbStatusText="Salvataggio bloccato: ricarica il Tool";updateFbIndicator();return;}
    if(!fbConnected || !window.fbReady){ return; }
    if(fbSaveTimer){ clearTimeout(fbSaveTimer); }
    fbStatusText = "Salvataggio in corso…";
    fbSaveTimer = setTimeout(function(){

  function buildMeseCard(mese){
    var locked = !!(mese.chiuso && archiveLocked(mese));
    var accreditato = monthIsAccredited(mese);
    var contentLocked = locked || accreditato || (fbConnected && !accreditiVerified());
    var card = el("div", "card" + (locked ? " archive-locked" : ""));
    var h = el("h3");
    var titolo = mese.nome !== "" ? mese.nome : "(nuovo Mese senza nome)";
    if(mese.chiuso){ titolo = titolo + " \u2014 archiviato"; }
    h.appendChild(el("span", null, titolo));
    var toggleBlocked=locked||(mese.chiuso&&accreditato)||(fbConnected&&!accreditiVerified());
    var btnToggle = el("button", "action small", locked ? "🔒 Archivio consolidato" : (mese.chiuso ? "Riapri" : "Archivia questo Mese"));
    btnToggle.disabled = toggleBlocked;
    if(mese.chiuso&&accreditato){btnToggle.title="Revoca prima l'accredito del Narratore per riaprire questo Mese.";}
    btnToggle.addEventListener(EV, function(){
      if(fbConnected&&!accreditiVerified()){alert("Non posso verificare lo stato dell'accredito: per sicurezza l'archivio non viene modificato.");return;}

  function valoreG(pos){
    var scale = [30,20,15,10,8,6,4,3,2,2];
    if(pos <= 10){ return scale[pos-1]; }
    return 1;
  }
  function cumulativeG(pos){ var tot=0; for(var i=1;i<=pos;i++){ tot=tot+valoreG(i); } return tot; }
  function valorePP(post){ var v = parseInt(post && post.pp != null ? post.pp : 0, 10); if(isNaN(v) || v < 0){ return 0; } return v; }
  function meseBonusPP(mese){ var v=parseInt(mese && mese.eventoBonusPP != null ? mese.eventoBonusPP : 0,10); if(isNaN(v)||v<0){return 0;} return v; }
  function meseBonusGaleoni(mese){ var v=parseInt(mese && mese.eventoBonusGaleoni != null ? mese.eventoBonusGaleoni : 0,10); if(isNaN(v)||v<0){return 0;} return v; }
  function meseBonusAltro(mese){ return String(mese && mese.eventoBonusAltro != null ? mese.eventoBonusAltro : "").trim(); }
  function newBonusId(){ return "b_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }

  function normalizeBonusMode(v){return ["all","posts","manual"].indexOf(v)>=0?v:"all";}
  function normalizeBonusValueMode(v){return ["fixed","variable"].indexOf(v)>=0?v:"fixed";}
  function normalizeVariableTarget(v){return ["pp","galeoni","altro"].indexOf(v)>=0?v:"pp";}

  function ensureBonusExtras(mese){
    if(!mese){return [];}
    if(!Array.isArray(mese.bonusAggiuntivi)){mese.bonusAggiuntivi=[];}
    for(var i=0;i<mese.bonusAggiuntivi.length;i++){
      var b=mese.bonusAggiuntivi[i]||{};
      if(!b.id){b.id=newBonusId();}
      b.descrizione=String(b.descrizione||"");
      b.pp=Math.max(0,parseInt(b.pp,10)||0);
      b.galeoni=Math.max(0,parseInt(b.galeoni,10)||0);
      b.altro=String(b.altro||"");
      b.modalita=normalizeBonusMode(b.modalita);
      b.valore=normalizeBonusValueMode(b.valore);
      b.maxUtilizzi=Math.max(0,parseInt(b.maxUtilizzi,10)||0);
      b.usatiIniziali=Math.max(0,parseInt(b.usatiIniziali,10)||0);
      b.usatiConfermati=b.usatiConfermati===true;
      if(b.maxUtilizzi>0){b.usatiIniziali=Math.min(b.usatiIniziali,b.maxUtilizzi);}
      b.variabileSu=normalizeVariableTarget(b.variabileSu);
      b.utilizziManuali=Math.max(0,parseInt(b.utilizziManuali,10)||0);
      if(b.maxUtilizzi>0){b.utilizziManuali=Math.min(b.utilizziManuali,Math.max(0,b.maxUtilizzi-b.usatiIniziali));}
      mese.bonusAggiuntivi[i]=b;
    }
    return mese.bonusAggiuntivi;
  }

  function primaryBonusItem(mese){
    return {
      id:"__primary__", primary:true,
      descrizione:String(mese&&mese.eventoBonusDescrizione||""),
      pp:meseBonusPP(mese),
      galeoni:meseBonusGaleoni(mese),
      altro:meseBonusAltro(mese),
      modalita:normalizeBonusMode(mese&&mese.eventoBonusModalita),
      valore:normalizeBonusValueMode(mese&&mese.eventoBonusValore),
      maxUtilizzi:Math.max(0,parseInt(mese&&mese.eventoBonusMaxUtilizzi,10)||0),
      usatiIniziali:Math.max(0,parseInt(mese&&mese.eventoBonusUsatiIniziali,10)||0),
      usatiConfermati:mese&&mese.eventoBonusUsatiConfermati===true,
      variabileSu:normalizeVariableTarget(mese&&mese.eventoBonusVariabileSu),
      utilizziManuali:Math.max(0,parseInt(mese&&mese.eventoBonusUtilizziManuali,10)||0)
    };
  }
  function allMonthBonuses(mese){
    var out=[primaryBonusItem(mese)],extras=ensureBonusExtras(mese);
    for(var i=0;i<extras.length;i++){
      var b=extras[i];
      out.push({
        id:String(b.id),primary:false,
        descrizione:String(b.descrizione||""),
        pp:Math.max(0,parseInt(b.pp,10)||0),
        galeoni:Math.max(0,parseInt(b.galeoni,10)||0),
        altro:String(b.altro||"").trim(),
        modalita:normalizeBonusMode(b.modalita),
        valore:normalizeBonusValueMode(b.valore),
        maxUtilizzi:Math.max(0,parseInt(b.maxUtilizzi,10)||0),
        usatiIniziali:Math.max(0,parseInt(b.usatiIniziali,10)||0),
        usatiConfermati:b.usatiConfermati===true,
        variabileSu:normalizeVariableTarget(b.variabileSu),
        utilizziManuali:Math.max(0,parseInt(b.utilizziManuali,10)||0)
      });
    }
    return out;
  }
  function bonusIsActive(b){
    return !!(b && (
      String(b.descrizione||"").trim()!=="" ||
      b.pp>0 || b.galeoni>0 || String(b.altro||"").trim()!=="" ||
      b.modalita!=="all" || b.maxUtilizzi>0
    ));
  }
  function activeMonthBonuses(mese){
    var all=allMonthBonuses(mese),out=[];
    for(var i=0;i<all.length;i++){if(bonusIsActive(all[i]))out.push(all[i]);}
    return out;
  }
  function bonusDisplayName(b,idx){
    var d=String(b&&b.descrizione||"").trim();
    return d||("Bonus "+(idx+1));
  }

  function primaryBonusFieldName(field){
    return {
      descrizione:"eventoBonusDescrizione",pp:"eventoBonusPP",galeoni:"eventoBonusGaleoni",altro:"eventoBonusAltro",
      modalita:"eventoBonusModalita",valore:"eventoBonusValore",maxUtilizzi:"eventoBonusMaxUtilizzi",
      usatiIniziali:"eventoBonusUsatiIniziali",usatiConfermati:"eventoBonusUsatiConfermati",variabileSu:"eventoBonusVariabileSu",utilizziManuali:"eventoBonusUtilizziManuali"
    }[field];
  }
  function getEditableBonusField(mese,bonus,isPrimary,field){
    if(isPrimary){var k=primaryBonusFieldName(field);return mese[k];}
    return bonus[field];
  }
  function setEditableBonusField(mese,bonus,isPrimary,field,value){
    if(isPrimary){mese[primaryBonusFieldName(field)]=value;}else{bonus[field]=value;}
  }

  function postExcludedFromBonus(post,b){
    if(!post||!b){return false;}
    if(b.primary){return !!post.eventoBonusEscluso;}
    return !!(post.bonusEsclusi&&post.bonusEsclusi[b.id]);
  }
  function setPostExcludedFromBonus(post,b,value){
    if(!post||!b){return;}
    if(b.primary){post.eventoBonusEscluso=!!value;return;}
    if(!post.bonusEsclusi||typeof post.bonusEsclusi!=="object"){post.bonusEsclusi={};}
    if(value){post.bonusEsclusi[b.id]=true;}else{delete post.bonusEsclusi[b.id];}
  }
  function getBonusUsageRecord(post,b,create){
    if(!post||!b){return null;}
    if(!post.bonusUtilizzi||typeof post.bonusUtilizzi!=="object"||Array.isArray(post.bonusUtilizzi)){
      if(!create){return null;}
      post.bonusUtilizzi={};
    }
    var id=String(b.id);
    var r=post.bonusUtilizzi[id];
    if(!r&&create){r={used:false,pp:0,galeoni:0,altro:"",link:""};post.bonusUtilizzi[id]=r;}
    if(r){
      r.used=!!r.used;
      r.pp=Math.max(0,parseInt(r.pp,10)||0);
      r.galeoni=Math.max(0,parseInt(r.galeoni,10)||0);
      r.altro=String(r.altro||"");
      r.link=String(r.link||"");
    }
    return r||null;
  }
  function postUsesLimitedBonus(post,b){
    var r=getBonusUsageRecord(post,b,false);
    return !!(r&&r.used&&isValidPostLink(post&&post.link));
  }
  function bonusPostsUsedThisMonth(b,posts,endExclusive){
    var c=0,limit=Math.min(posts.length,endExclusive==null?posts.length:endExclusive);
    if(b.modalita!=="posts"){return 0;}
    for(var i=0;i<limit;i++){if(postUsesLimitedBonus(posts[i],b))c++;}
    return c;
  }
  function bonusUsedPostRefs(b,posts){
    var out=[],localNo=0;
    if(!b||b.modalita!=="posts"){return out;}
    posts=Array.isArray(posts)?posts:[];
    for(var i=0;i<posts.length;i++){
      var post=posts[i];
      if(!post||!isValidPostLink(post.link)){continue;}
      localNo++;
      if(!postUsesLimitedBonus(post,b)){continue;}
      var globalNo=parseInt(post.globalNo,10);
      var label="Post "+localNo;
      if(!isNaN(globalNo)&&globalNo>0){label+=" (N. globale "+globalNo+")";}
      out.push(label);
    }
    return out;
  }
  function bonusUsedThisMonth(b,posts){
    if(b.modalita==="posts"){return bonusPostsUsedThisMonth(b,posts,posts.length);}
    if(b.modalita==="manual"){return Math.max(0,parseInt(b.utilizziManuali,10)||0);}
    return 0;
  }
  function bonusCurrentUses(b,posts){return Math.max(0,parseInt(b.usatiIniziali,10)||0)+bonusUsedThisMonth(b,posts);}
  function bonusRemainingUses(b,posts){
    if(!(b.maxUtilizzi>0)){return Infinity;}
    return Math.max(0,b.maxUtilizzi-bonusCurrentUses(b,posts));
  }
  function bonusUsageClass(b,posts){
    if(!(b.maxUtilizzi>0)){return "neutral";}
    var current=bonusCurrentUses(b,posts),monthUsed=bonusUsedThisMonth(b,posts);
    if(current>=b.maxUtilizzi){return "exhausted";}
    if(monthUsed>0){return "update";}
    return "neutral";
  }
  function bonusUsageStatusText(b,posts){
    if(!(b.maxUtilizzi>0)){return "";}
    var start=Math.max(0,parseInt(b.usatiIniziali,10)||0),monthUsed=bonusUsedThisMonth(b,posts),current=start+monthUsed;
    if(current>=b.maxUtilizzi){return current+"/"+b.maxUtilizzi+" — ESAURITO: rimuovere dal Bagaglio in Scheda PG.";}
    if(monthUsed>0){return current+"/"+b.maxUtilizzi+" — aggiornare nel Bagaglio in Scheda PG (da "+start+"/"+b.maxUtilizzi+" a "+current+"/"+b.maxUtilizzi+").";}
    return current+"/"+b.maxUtilizzi+" utilizzi.";
  }
  function hasPostUsageBonuses(mese){
    var bonuses=activeMonthBonuses(mese);
    for(var i=0;i<bonuses.length;i++){if(bonuses[i].modalita==="posts"){return true;}}
    return false;
  }
  function bonusUsageProgressAtPost(b,posts,postIndex){
    if(!b||b.modalita!=="posts"||postIndex<0||postIndex>=posts.length){return null;}
    if(!postUsesLimitedBonus(posts[postIndex],b)){return null;}
    var current=Math.max(0,parseInt(b.usatiIniziali,10)||0)+bonusPostsUsedThisMonth(b,posts,postIndex+1);
    var max=Math.max(0,parseInt(b.maxUtilizzi,10)||0);
    return {
      current:current,
      max:max,
      kind:(max>0&&current>=max)?"exhausted":"update",
      label:max>0?(current+"/"+max):(current+" utilizzi")
    };
  }
  function bonusSummaryUsageState(b,posts){
    if(!b||b.modalita!=="posts"){return null;}
    var used=bonusUsedThisMonth(b,posts);
    if(used<=0){return null;}
    var start=Math.max(0,parseInt(b.usatiIniziali,10)||0);
    var current=start+used;
    var max=Math.max(0,parseInt(b.maxUtilizzi,10)||0);
    if(max>0&&current>=max){
      return {kind:"exhausted",text:"TERMINATO — "+current+"/"+max+" · rimuovere dal Bagaglio in Scheda PG"};
    }
    if(max>0){
      return {kind:"update",text:"AGGIORNARE — "+start+"/"+max+" → "+current+"/"+max+" nel Bagaglio in Scheda PG"};
    }
    return {kind:"update",text:"AGGIORNARE — "+current+" utilizzi registrati"};
  }
  function isLastUsagePostForBonus(b,posts,postIndex){
    if(!b||b.modalita!=="posts"){return false;}
    for(var i=postIndex+1;i<posts.length;i++){
      if(postUsesLimitedBonus(posts[i],b)){return false;}
    }
    return postUsesLimitedBonus(posts[postIndex],b);
  }
  function makeBonusUsageProgressCell(post,mese,posts,postIndex){
    var td=el("td","cb-usage-cell"),bonuses=activeMonthBonuses(mese),shown=0;

  function bonusBagWarnings(mese,posts){
    var bonuses=activeMonthBonuses(mese),out=[];
    for(var i=0;i<bonuses.length;i++){

      if((b.modalita!=="posts"&&b.modalita!=="manual")||!(b.maxUtilizzi>0)){continue;}

      var current=bonusCurrentUses(b,posts);
      if(current>=b.maxUtilizzi){
        out.push({kind:"remove",text:bonusDisplayName(b,i)+": "+current+"/"+b.maxUtilizzi+" — RIMUOVERE DAL BAGAGLIO IN SCHEDA PG."});
      }else{
        out.push({kind:"update",text:bonusDisplayName(b,i)+": aggiornare gli utilizzi nel Bagaglio da "+b.usatiIniziali+"/"+b.maxUtilizzi+" a "+current+"/"+b.maxUtilizzi+"."});
      }

  function postEligibleForBonus(post,b){
    if(!post||!isValidPostLink(post.link)){return false;}
    if(b.modalita==="all"){return true;}
    if(b.modalita==="posts"){return postUsesLimitedBonus(post,b);}
    return false;

  function bonusEligibleCount(b,posts,endExclusive){
    if(b.modalita==="manual"){return Math.max(0,parseInt(b.utilizziManuali,10)||0);}
    var count=0,limit=Math.min(endExclusive,posts.length);
    for(var i=0;i<limit;i++){if(postEligibleForBonus(posts[i],b))count++;}
    return count;
  }
  function bonusPPOnPost(b,post){
    if(!postEligibleForBonus(post,b)){return 0;}
    if(b.modalita==="posts"&&b.valore==="variable"){
      var r=getBonusUsageRecord(post,b,false);
      return b.variabileSu==="pp"&&r?Math.max(0,parseInt(r.pp,10)||0):0;
    }
    return Math.max(0,parseInt(b.pp,10)||0);
  }
  function bonusGOnPost(b,post){
    if(!postEligibleForBonus(post,b)){return 0;}

      var r=getBonusUsageRecord(post,b,false);
      return b.variabileSu==="galeoni"&&r?Math.max(0,parseInt(r.galeoni,10)||0):0;
    }
    return Math.max(0,parseInt(b.galeoni,10)||0);
  }
  function bonusAltroOnPost(b,post){
    if(!postEligibleForBonus(post,b)){return "";}
    if(b.modalita==="posts"&&b.valore==="variable"){
      var r=getBonusUsageRecord(post,b,false);
      return b.variabileSu==="altro"&&r?String(r.altro||"").trim():"";
    }

  function bonusManualGTotal(b){return b.modalita==="manual"?Math.max(0,parseInt(b.utilizziManuali,10)||0)*Math.max(0,parseInt(b.galeoni,10)||0):0;}

  function cumulativeBasePP(posts,endExclusive){
    /* post.pp è un residuo delle vecchie versioni della Camera Blindata.
       Non deve più essere sommato: i PP sono gestiti dai Bonus generici. */
    return 0;

  function eventBonusTotal(mese,posts,endExclusive){

  function monthlySocialDecay(postCount){
    var n=Math.max(0,parseInt(postCount,10)||0);
    return n<=3?-1:(n<=9?-.5:0);
  }
  function currentSocialLossParts(postCount){
    var decay=monthlySocialDecay(postCount),parts=[];
    if(decay>=0){return parts;}
    var defs=socialFieldDefs(),values=normalizeSocialValues(PARAMETRI_SOCIALI);
    for(var i=0;i<defs.length;i++){
      var d=defs[i],before=socialNumber(values[d.key]);
      if(before===null)continue;
      var after=before+decay;
      if(Number.isFinite(d.min))after=Math.max(d.min,after);
      if(Number.isFinite(d.max))after=Math.min(d.max,after);
      after=Math.round(after*100)/100;
      var delta=Math.round((after-before)*100)/100;
      if(delta<0)parts.push("−"+fmtSocialValue(Math.abs(delta))+" "+d.label);
    }
    return parts;
  }

      if(b.variabileSu==="altro"&&String(r.altro||"").trim())parts.push(String(r.altro).trim());

    }

  }

    for(var ebi=0;ebi<extraBonuses.length;ebi++)appendBonusEditor(bonusBox,meseObj,extraBonuses[ebi],ebi+1,bonusLocked,false);

    if(!bonusLocked){
      var bonusActions=el("div","bonus-actions");
      var addBonusBtn=el("button","action small","+ Aggiungi Bonus");addBonusBtn.type="button";
      addBonusBtn.addEventListener(EV,function(){
        if(blockIfMonthReadOnly(meseObj))return;
        ensureBonusExtras(meseObj).push({id:newBonusId(),descrizione:"",pp:0,galeoni:0,altro:"",modalita:"all",valore:"fixed",maxUtilizzi:0,usatiIniziali:0,usatiConfermati:false,variabileSu:"pp",utilizziManuali:0});
        scheduleSave(0);renderAll();
      });
      bonusActions.appendChild(addBonusBtn);

      var anyBonusActive=activeMonthBonuses(meseObj).length>0 || ensureBonusExtras(meseObj).length>0;
      if(anyBonusActive){
        var clearBonus=el("button","action danger small","Azzera Bonus");clearBonus.type="button";
        clearBonus.addEventListener(EV,function(){
          if(blockIfMonthReadOnly(meseObj))return;
          if(!confirm("Azzerare tutti i Bonus di questo Mese?"))return;

          meseObj.eventoBonusDescrizione="";
          meseObj.eventoBonusPP=0;
          meseObj.eventoBonusGaleoni=0;
          meseObj.eventoBonusAltro="";
          meseObj.eventoBonusModalita="all";
          meseObj.eventoBonusValore="fixed";
          meseObj.eventoBonusMaxUtilizzi=0;
          meseObj.eventoBonusUsatiIniziali=0;
          meseObj.eventoBonusUsatiConfermati=false;
          meseObj.eventoBonusVariabileSu="pp";
          meseObj.eventoBonusUtilizziManuali=0;
          meseObj.bonusAggiuntivi=[];

          for(var cbi=0;cbi<meseObj.posts.length;cbi++){
            meseObj.posts[cbi].eventoBonusEscluso=false;
            meseObj.posts[cbi].bonusEsclusi={};
            meseObj.posts[cbi].bonusUtilizzi={};
          }
          scheduleSave(0);renderAll();
        });
        bonusActions.appendChild(clearBonus);
      }
      bonusBox.appendChild(bonusActions);
    }
    if(bonusLocked){
      var bonusLockMsg=monthIsAccredited(meseObj)?"Il Mese è già accreditato: i Bonus sono congelati finché il Narratore non revoca l'accredito.":"Il Mese è in un archivio consolidato: il Bonus non è più modificabile.";
      bonusBox.appendChild(el("p","small-note",bonusLockMsg));
    }
    p.appendChild(bonusBox);

    var postiDelMese = meseObj.posts;
    var totFilled = 0;
    for(var j=0;j<postiDelMese.length;j++){ if(isValidPostLink(postiDelMese[j].link)){ totFilled = totFilled + 1; } }
    var totGBase = totFilled > 0 ? cumulativeG(totFilled) : 0;
    var totGEvento = eventBonusGaleoniTotal(meseObj, postiDelMese, postiDelMese.length);
    var totG = totGBase + totGEvento;
    var totPPBase = cumulativeBasePP(postiDelMese, postiDelMese.length);
    var totPPEvento = eventBonusTotal(meseObj, postiDelMese, postiDelMese.length);
    var totPP = totPPBase + totPPEvento;
    var latestCredit = latestCreditInfo(meseObj, postiDelMese);

    var manualCredit=manualCreditParts(meseObj);
    if((latestCredit||manualCredit.pp>0||manualCredit.galeoni>0||manualCredit.altro.length) && !monthIsAccredited(meseObj)){
      var creditParts=[];
      var creditLabel="";
      if(latestCredit){
        creditLabel="Post "+latestCredit.localNo;
      }else{
        creditLabel="Bonus del mese";
      }

      /* Il riquadro rosso mostra sempre il TOTALE effettivo del mese,
         non il valore del solo ultimo post. Viene ricostruito ad ogni renderAll(). */
      creditParts.push("+"+totG+" G");
      creditParts.push("+"+totPP+" PP");

      var allMonthAltro=[];
      if(latestCredit && latestCredit.altro){allMonthAltro.push(latestCredit.altro);}
      if(manualCredit.altro.length){allMonthAltro=allMonthAltro.concat(manualCredit.altro);}
      if(allMonthAltro.length){creditParts.push("Altro: "+allMonthAltro.join(", "));}

      var socialLosses=currentSocialLossParts(totFilled);
      if(socialLosses.length)creditParts.push("Parametri Sociali: "+socialLosses.join(", "));

      var usageCreditActions=bonusCreditUsageActions(meseObj,postiDelMese);
      var creditHtml="<b>DA ACCREDITARE — "+creditLabel+": </b><span class=\"cb-credit-values\">"+creditParts.join(" · ")+"</span>";
      if(usageCreditActions.length){
        creditHtml+=" <b>|</b> "+usageCreditActions.join(" <b>|</b> ");
      }
      p.appendChild(el("div","cb-credit-alert",creditHtml));
    }
    var totals = el("div", "totals");
    totals.appendChild(el("div", "box", "Totale Post<br><b>" + totFilled + "</b>"));
    totals.appendChild(el("div", "box", "Totale Galeoni<br><b>" + totG + " G</b>"));
    totals.appendChild(el("div", "box", "Totale PP<br><b>" + totPP + " PP</b>"));
    p.appendChild(totals);
    var bonusItems=activeMonthBonuses(meseObj);
    for(var bsi=0;bsi<bonusItems.length;bsi++){
      var bi=bonusItems[bsi],parts=[],modeText="";
      if(bi.modalita!=="all"){continue;}
      if(bi.modalita==="all"){
        if(bi.pp>0)parts.push("+"+bi.pp+" PP per post");
        if(bi.galeoni>0)parts.push("+"+bi.galeoni+" G per post");
        if(bi.altro)parts.push("Altro: "+bi.altro);
        modeText="Post ammessi: "+bonusEligibleCount(bi,postiDelMese,postiDelMese.length)+" su "+totFilled;
      }else if(bi.modalita==="posts"){
        if(bi.valore==="variable"){
          parts.push("valore variabile in "+(bi.variabileSu==="pp"?"PP":(bi.variabileSu==="galeoni"?"Galeoni":"Altro"))+" per utilizzo");
          var vpp=0,vg=0;
          for(var _vi=0;_vi<postiDelMese.length;_vi++){vpp+=bonusPPOnPost(bi,postiDelMese[_vi]);vg+=bonusGOnPost(bi,postiDelMese[_vi]);}
          if(vpp>0)parts.push("+"+vpp+" PP nel mese");
          if(vg>0)parts.push("+"+vg+" G nel mese");
        }else{
          if(bi.pp>0)parts.push("+"+bi.pp+" PP per utilizzo");
          if(bi.galeoni>0)parts.push("+"+bi.galeoni+" G per utilizzo");
          if(bi.altro)parts.push("Altro: "+bi.altro);
        }
        var usedRefs=bonusUsedPostRefs(bi,postiDelMese);
        modeText="Utilizzi: "+bonusCurrentUses(bi,postiDelMese)+(bi.maxUtilizzi>0?"/"+bi.maxUtilizzi:"");
        if(usedRefs.length){modeText+=" · "+usedRefs.join(", ");}
      }else{
        if(bi.pp>0)parts.push("+"+bi.pp+" PP per utilizzo");
        if(bi.galeoni>0)parts.push("+"+bi.galeoni+" G per utilizzo");
        if(bi.altro)parts.push("Altro: "+bi.altro);
        modeText="Utilizzi manuali: "+bonusCurrentUses(bi,postiDelMese)+(bi.maxUtilizzi>0?"/"+bi.maxUtilizzi:"");
      }
      if(!parts.length)parts.push("nessun valore economico");
      var summaryLine=el("div","guide-text");
      summaryLine.appendChild(el("b",null,bonusDisplayName(bi,bsi)+": "));
      summaryLine.appendChild(document.createTextNode(parts.join(" · ")+" · "));
      summaryLine.appendChild(el("b",null,modeText));
      var usageState=bonusSummaryUsageState(bi,postiDelMese);
      if(usageState){
        summaryLine.appendChild(document.createTextNode(" · "));
        summaryLine.appendChild(el("span","cb-summary-usage-badge "+usageState.kind,usageState.text));
      }
      p.appendChild(summaryLine);
    }

    var showUsageColumn=hasPostUsageBonuses(meseObj);
    var tblLive = el("table", "posts");
    var cbHeader="<th>N.</th><th>Galeoni accumulati</th><th>N. globale</th><th>Bonus</th><th>Totale Bonus</th>"+(showUsageColumn?"<th>Utilizzi</th>":"")+"<th>Link</th>";
    tblLive.appendChild(el("tr", null, cbHeader));

    var showUpToLive = postiDelMese.length;
    if(showUpToLive < 1){ showUpToLive = 0; }

    var localPostNo = 0;
    for(var li=0; li<showUpToLive; li++){
      let lp = postiDelMese[li];
      if(!lp || !isValidPostLink(lp.link)){continue;}
      localPostNo++;

      var tr = el("tr");
      var isLatestCreditRow = !!(latestCredit && li===latestCredit.index);
      if(isLatestCreditRow){tr.classList.add("cb-latest-row");}

      /* Numero del Post nel Mese: distinto dal numero globale e sempre in grassetto. */
      var localTd=el("td","cb-local-post-number");
      localTd.appendChild(el("span","cb-local-post-badge",String(localPostNo)));
      tr.appendChild(localTd);

      var linkedUpTo = 0;
      for(var gx=0; gx<=li; gx++){
        if(isValidPostLink(postiDelMese[gx].link)){ linkedUpTo++; }
      }
      tr.appendChild(el("td","g-value",(cumulativeG(linkedUpTo) + eventBonusGaleoniTotal(meseObj, postiDelMese, li + 1)) + " G"));

      /* Numero globale: alternanza stabile rosso / giallino basata sul numero stesso. */
      var globalTd=el("td","global-number-cell");
      var globalNo=parseInt(lp.globalNo,10);
      if(!isNaN(globalNo) && globalNo>0){
        globalTd.appendChild(el("span","global-post-number cb-global-alt-"+(globalNo%2),String(globalNo)));
      }else{
        globalTd.appendChild(el("span","cb-bonus-none","—"));
      }
      tr.appendChild(globalTd);

      tr.appendChild(makeEventBonusExclusionCell(lp,meseObj,bonusLocked));

      /* Totale Bonus del singolo post: somma tutti i bonus applicati
         (PP, Galeoni e Altro), inclusi eventuali vecchi PP manuali salvati. */
      var bonusTotals=postBonusTotals(meseObj,lp);
      var bonusTotalTd=el("td","cb-total-bonus");
      appendMoneyParts(bonusTotalTd,bonusTotals,bonusTotals.altro);
      tr.appendChild(bonusTotalTd);

      /* Nessun flag duplicato qui: la colonna mostra soltanto la progressione
         degli utilizzi già selezionati nella colonna Bonus. */
      if(showUsageColumn){
        tr.appendChild(makeBonusUsageProgressCell(lp,meseObj,postiDelMese,li));
      }

      /* Il link del Post è volutamente l'ultima colonna. */
      var linkTd=makeLinkCell(lp.link, "Apri il post");
      linkTd.classList.add("cb-post-link-last");
      tr.appendChild(linkTd);

      tblLive.appendChild(tr);
    }

    if(showUpToLive === 0 || totFilled===0){
      p.appendChild(el("p", "small-note", "Nessun post ancora in questo Mese: aggiungine allo Step precedente per vedere qui Galeoni, N. globale, Bonus, Totale Bonus, Utilizzi (quando presenti) e Link."));
    } else {
      p.appendChild(el("h4", null, "Progressivo del mese"));
      p.appendChild(tblLive);
    }

    container.appendChild(p);
  }

  function renderStruttureStep(container){
    var p = el("div", "panel");
    p.appendChild(el("h2", null, "Le tue Strutture"));
    p.appendChild(el("div", "guide-text", "Puoi avere tutte, alcune o nessuna di queste strutture oltre alla Camera Blindata: seleziona quelle che possiedi."));
    var opts = [
      { key:"postazione", label:"Ho una Postazione di Pozioni" },
      { key:"cubicolo", label:"Ho un Cubicolo (Serra n\u00b07)" },
      { key:"recinto", label:"Ho un Recinto (Cura delle Creature Magiche)" }
    ];
    for(var i=0;i<opts.length;i++){
      (function(o){
        var chk = el("div", "chk-line");
        var box = el("input"); box.type="checkbox"; box.checked = STRUTTURE[o.key];
        box.addEventListener("change", function(){ STRUTTURE[o.key] = box.checked; renderAll(); });
        chk.appendChild(box);
        chk.appendChild(el("span", null, o.label));
        p.appendChild(chk);
      })(opts[i]);
    }
    container.appendChild(p);
  }

  function parseDispensaBulkLine(raw){
    var line=String(raw||"").trim();
    if(!line){return null;}
    if(/^RISULTATI\s+RACCOLTA\s*:?\s*$/i.test(line)){return null;}

    /* Formato del Generatore:
       - X: Nome <i ...></i> (<i ...></i> <i ...></i>)
       La classificazione viene riconosciuta ma i dati ufficiali restano quelli del Glossario. */
    line=line.replace(/^\s*[-•*]\s*/,"");
    line=line.replace(/^(?:X|XX|XXX|XXXX|XXXXX)\s*:\s*/i,"");

    var qty=1, qm=line.match(/^(\d+)\s*(?:\||x|×|-)\s*(.+)$/i);
    if(qm){qty=Math.max(1,parseInt(qm[1],10)||1);line=qm[2].trim();}

    /* Elimina le icone HTML copiate come codice e, se l'utente copia
       la versione visiva, anche i simboli equivalenti. */
    line=line.replace(/<i\b[^>]*>\s*<\/i>/gi," ");
    line=line.replace(/<[^>]+>/g," ");
    line=decodeDispensaHtmlEntities(line);
    line=line.replace(/[🚫⚗✔✅]/g," ");
    line=line.replace(/\(\s*\)/g," ");
    line=line.replace(/\s+/g," ").trim();

    if(!line){return null;}
    return {qty:qty,name:line};
  }

  function nextStageLabel(stages, currentLabel){
    for(var i=0;i<stages.length;i++){
      if(stages[i].label === currentLabel){

  function ensurePhaseHistory(occupant){
    if(!Array.isArray(occupant.faseHistory)){ occupant.faseHistory = []; }
    return occupant.faseHistory;
  }
  function pushPhaseHistory(occupant){
    var hist = ensurePhaseHistory(occupant);
    hist.push({
      faseAttuale: occupant.faseAttuale,
      faseDataInizio: occupant.faseDataInizio || "",
      faseLink: occupant.faseLink || ""
    });
  }
  function undoLastPhaseAdvance(occupant){
    var hist = ensurePhaseHistory(occupant);
    if(!hist.length){ return false; }
    var prev = hist.pop();
    occupant.faseAttuale = prev.faseAttuale;
    occupant.faseDataInizio = prev.faseDataInizio || "";
    occupant.faseLink = prev.faseLink || "";
    return true;
  }

  function buildAdvancementPanel(occupant, stages, listRef, archivioRef){
    ensureOccupantStageData(occupant, stages);
    var wrap = el("div", "guide-text advancement-panel");
    var phaseConfig = { tipoLabel: (stages.length && stages[0].key === "seme") ? "Pianta" : "Creatura" };
    var currentStage = null;
    for(var i=0;i<stages.length;i++){ if(stages[i].label === occupant.faseAttuale){ currentStage = stages[i]; } }
    if(!currentStage){ return wrap; }

    if(occupant.morta){
      wrap.innerHTML = sanitizeHtml("<b>Stato:</b> Deceduta/o.");
      return wrap;
    }

    var cicliData = occupant.cicli[currentStage.key];
    var completedText = "";
    var phaseReady = false;
    if(currentStage.type === "gestazione"){
      var doneGest = subEntryFilled(cicliData.evento);
      phaseReady = !!doneGest;
      completedText = doneGest ? "Gestazione completata." : "Gestazione in corso.";
    } else {
      var res = countCompletedCicli(occupant, currentStage);
      if(currentStage.type === "ripro"){ phaseReady = !!(res && res.total > 0 && res.completed >= res.total && res.reproDone >= 1); }
      else { phaseReady = !!(res && res.total > 0 && res.completed >= res.total); }
      completedText = "Cicli di Produzione completati: " + res.completed + "/" + res.total + ".";
      if(currentStage.type === "ripro"){ completedText += " Riproduzione: " + (res.reproDone||0) + "/1."; }
    }

    wrap.innerHTML = sanitizeHtml("<b>Avanzamento fase vitale \u2014 " + occupant.faseAttuale + "</b><br>" + completedText +
      "<br>In alternativa, passa comunque alla fase successiva dopo <b>" + currentStage.months +
      " mesi OFFGame</b> dalla data di inizio di questa fase (" +
      (occupant.faseDataInizio !== "" ? occupant.faseDataInizio : "non specificata") +
      "), anche se i Cicli non sono completi.");

    if(ensurePhaseHistory(occupant).length){
      wrap.innerHTML = sanitizeHtml(wrap.innerHTML + "<br><small>Hai avanzato questa fase dal tool: puoi annullare l'ultimo passaggio senza perdere i dati già compilati.</small>");
    }

    var nextLabel = nextStageLabel(stages, occupant.faseAttuale);
    var btnRow = el("div");
    var hist = ensurePhaseHistory(occupant);
    if(hist.length){
      var prevState = hist[hist.length - 1];
      var btnBack = el("button", "action", "Torna a: " + prevState.faseAttuale);
      btnBack.style.marginRight = "8px";
      btnBack.title = "Annulla l'ultimo avanzamento di fase senza cancellare Cicli o altri dati già inseriti.";
      btnBack.addEventListener(EV, function(){
        undoLastPhaseAdvance(occupant);
        openStageDetails(occupant, stages, phaseConfig, occupant.faseAttuale);
        scheduleSave(0); renderAll();
      });
      btnRow.appendChild(btnBack);
    }
    if(nextLabel){
      var btn = el("button", "action", "Fai passare a: " + nextLabel);
      btn.addEventListener(EV, function(){
        pushPhaseHistory(occupant);
        occupant.faseAttuale = canonicalStageLabel(stages, nextLabel);
        occupant.faseDataInizio = "";
        openStageDetails(occupant, stages, phaseConfig, occupant.faseAttuale);
        scheduleSave(0); renderAll();
      });
      btnRow.appendChild(btn);
    } else {
      var btnD = el("button", "action danger", "Segna come Morta/o e sposta in Archivio");
      btnD.addEventListener(EV, function(){
        occupant.morta = true;
        if(listRef){
          var idx = listRef.indexOf(occupant);
          if(idx > -1){ listRef.splice(idx, 1); }
        }
        archiveStamp(occupant);
        if(archivioRef){ archivioRef.push(occupant); }
        scheduleSave(0); renderAll();
      });
      btnRow.appendChild(btnD);
    }
    if(phaseReady){
      var readyText = nextLabel ? ("✅ Fase completata — puoi passare a " + nextLabel + ".") : "✅ Fase completata — puoi concludere il ciclo vitale e spostare l'esemplare in Archivio.";
      wrap.appendChild(el("div", "phase-ready", readyText));
    }
    wrap.appendChild(btnRow);
    return wrap;
  }

  function countCompletedCicli(occupant, stage){
    var cicliData = occupant.cicli[stage.key];
    if(stage.type === "cicli"){
      var c = 0;
      for(var i=0;i<cicliData.list.length;i++){ if(subEntryFilled(cicliData.list[i])){ c = c + 1; } }
      return { completed: c, total: cicliData.list.length };
    }
    if(stage.type === "ripro"){
      var c2 = 0;
      for(var j=0;j<cicliData.list.length;j++){ if(subEntryFilled(cicliData.list[j])){ c2 = c2 + 1; } }
      var reproDone = subEntryFilled(cicliData.evento) ? 1 : 0;
      return { completed: c2, total: cicliData.list.length, reproDone: reproDone };
    }
    return null;
  }
  function buildSubEntryLine(sub, eventoLabel, ottenutiLabel){
    var out = "<i>" + eventoLabel + "</i> = " + forumBbUrl(sub.esitoLink, (sub.esitoText !== "" ? sub.esitoText : "Esito dado")) + "; " + sub.postRichiesti + " post\n";

      }
      lines.push("</details>");
    }
    lines.push("[/SPOILER]");
    return lines;

        tipo:"felix-tool-height",
        tool:"studente",
        height:h,
        altezza:h
      },"*");
    }catch(e){}
  }

  function scheduleParentHeight(){
    if(ffHeightTimer){clearTimeout(ffHeightTimer);}
    ffHeightTimer=setTimeout(function(){notifyParentHeight(false);},40);
  }

  if(typeof ResizeObserver!=="undefined"){
    new ResizeObserver(scheduleParentHeight).observe(document.querySelector(".wrap")||document.body||document.documentElement);
  }

  if(typeof MutationObserver!=="undefined"){
    var ffMutationTarget=document.querySelector(".wrap")||document.body;
    if(ffMutationTarget){
      new MutationObserver(scheduleParentHeight).observe(ffMutationTarget,{
        childList:true,subtree:true,attributes:true,characterData:true
      });
    }
  }

  window.addEventListener("resize",scheduleParentHeight);

  window.addEventListener("message",function(event){
    if(event.data && event.data.tipo==="felix-tool-height-request"){
      notifyParentHeight(true);
    }
  });

  window.addEventListener("load",function(){
    notifyParentHeight(true);
    setTimeout(function(){notifyParentHeight(true);},120);
    setTimeout(function(){notifyParentHeight(true);},500);
  });

})();
</script>
</body>
</html>
