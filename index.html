<div class="wrap">

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyCvd56bSEL02s2OY2PSk7uyFX-CYRB4Vz0",
    authDomain: "conteggi-eee1b.firebaseapp.com",
    projectId: "conteggi-eee1b",
    storageBucket: "conteggi-eee1b.firebasestorage.app",
    messagingSenderId: "481320219586",
    appId: "1:481320219586:web:87e974d618a302adfadc5b"
  };

  var fbApp = initializeApp(firebaseConfig);
  var fbDb = getFirestore(fbApp);
  var PERSON_COLLECTION = "personaggi_studenti";

  window.fbLastSaveError = null;
  window.fbSaveState = function(pgId, dataObj, sessionId, mustAlreadyExist){
    var ref = doc(fbDb, PERSON_COLLECTION, pgId);
    window.fbLastSaveError = null;
    dataObj._lastModifiedAt = serverTimestamp();
    dataObj._lastModifiedBy = "pg";
    dataObj._lastSessionId = String(sessionId || "");
    var writePromise = mustAlreadyExist ? updateDoc(ref, dataObj) : setDoc(ref, dataObj, { merge:true });
    return writePromise.then(function(){ return true; }).catch(function(e){ window.fbLastSaveError=e; console.error(e); return false; });
  };

  window.fbLoadState = function(pgId){
    return getDoc(doc(fbDb, PERSON_COLLECTION, pgId)).then(function(snap){ return snap.exists() ? snap.data() : null; });
  };

  window.fbGetAccrediti = function(pgId){
    var accCollection = PERSON_COLLECTION === "personaggi_adulti" ? "accrediti_adulti" : "accrediti_studenti";
    return getDoc(doc(fbDb, accCollection, pgId)).then(function(snap){ return snap.exists() ? snap.data() : {}; }).catch(function(e){ console.error(e); return {}; });
  };

  window.fbWriteAudit = function(pgId, eventObj){
    var ev = Object.assign({}, eventObj || {});
    ev.pgId = pgId; ev.actor = "pg"; ev.at = serverTimestamp();
    return addDoc(collection(fbDb, PERSON_COLLECTION, pgId, "audit"), ev).then(function(){return true;}).catch(function(e){console.error(e);return false;});
  };

  window.fbCreateSnapshot = function(pgId, snapshotObj){
    var snap = Object.assign({}, snapshotObj || {});
    snap.pgId = pgId; snap.actor = "pg"; snap.at = serverTimestamp(); snap.protected = false;
    return addDoc(collection(fbDb, PERSON_COLLECTION, pgId, "snapshots"), snap).then(function(){return true;}).catch(function(e){console.error(e);return false;});
  };

  window.fbReady = true;
  if(window.fbOnReady){ window.fbOnReady(); }
</script>

<script>
(function(){

  "use strict";

  function getAnonymousSessionId(kind){
    var key="ff_tracker_session_"+String(kind||"pg");
    try{
      var existing=localStorage.getItem(key);
      if(existing){return existing;}
      var id="";
      if(window.crypto && typeof window.crypto.randomUUID==="function"){id=window.crypto.randomUUID();}
      else if(window.crypto && typeof window.crypto.getRandomValues==="function"){
        var a=new Uint32Array(4);window.crypto.getRandomValues(a);id=Array.prototype.map.call(a,function(x){return x.toString(16).padStart(8,"0");}).join("");
      }else{id=Date.now().toString(36)+Math.random().toString(36).slice(2);}
      localStorage.setItem(key,id);return id;
    }catch(e){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
  }
  function cloneHistoryState(v){try{return JSON.parse(JSON.stringify(v||{}));}catch(e){return {};}}
  function historyComparableState(v){
    var c=cloneHistoryState(v||{});
    ["_lastModifiedAt","_lastModifiedBy","_lastSessionId","_archiveUnlockUntil","_dispensaBatchDraft"].forEach(function(k){delete c[k];});
    return c;
  }
  function shortHistoryValue(v){
    if(v===undefined){return "—";} if(v===null){return "null";}
    if(typeof v==="string"){return v.length>110?v.slice(0,107)+"…":v;}
    if(typeof v==="number"||typeof v==="boolean"){return String(v);}
    try{var t=JSON.stringify(v);return t.length>110?t.slice(0,107)+"…":t;}catch(e){return "[dato]";}
  }
  function diffHistory(oldVal,newVal,path,out,depth){

  function normalizeDateText(v){
    v = String(v || "").trim();
    if(v === ""){ return ""; }
    var m;
    m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if(m){ return String(m[3]).padStart(2,"0") + "/" + String(m[2]).padStart(2,"0") + "/" + m[1]; }
    m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
    if(m){ return String(m[1]).padStart(2,"0") + "/" + String(m[2]).padStart(2,"0") + "/" + m[3]; }
    var mesiIt = {gennaio:1,febbraio:2,marzo:3,aprile:4,maggio:5,giugno:6,luglio:7,agosto:8,settembre:9,ottobre:10,novembre:11,dicembre:12};
    m = v.toLowerCase().match(/^(\d{1,2})\s+([a-zàèéìòù]+)\s+(\d{4})$/i);
    if(m && mesiIt[m[2]]){ return String(m[1]).padStart(2,"0") + "/" + String(mesiIt[m[2]]).padStart(2,"0") + "/" + m[3]; }
    return v;
  }

    if(aliased){

    }
    return stages.length ? stages[0].label : raw;

  function installUniversalAutosave(){
    if(window.__ffUniversalAutosaveInstalled){ return; }
    window.__ffUniversalAutosaveInstalled = true;

    function isEditableControl(target){
      if(!target || !target.matches){ return false; }
      if(!target.matches("input, textarea, select")){ return false; }
      /* Il nome PG prima della connessione non produce comunque scritture: scheduleSave
         esce subito quando fbConnected è false. */
      return true;
    }

    /* input copre digitazione e, nei browser moderni, anche l'incolla. */
    document.addEventListener("input", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      scheduleSave(250);
    }, true);

    /* change e focusout rendono persistenti rapidamente anche checkbox, select e campi
       modificati senza dover cambiare schermata. */
    document.addEventListener("change", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      scheduleSave(80);
    }, true);
    document.addEventListener("focusout", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      scheduleSave(80);
    }, true);

    /* Fallback esplicito per l'incolla: il salvataggio parte dopo che il browser ha
       effettivamente inserito il testo e l'handler del campo ha aggiornato lo stato. */
    document.addEventListener("paste", function(ev){
      if(!isEditableControl(ev.target)){ return; }
      setTimeout(function(){ scheduleSave(80); }, 0);
    }, true);
  }

  function repairCountersFromData(){
    var changed=false;
    function idNum(v){var n=parseInt(v,10);return (!isNaN(n)&&n>0)?n:0;}
    function maxIds(list){var m=0;if(!Array.isArray(list))return 0;for(var i=0;i<list.length;i++){m=Math.max(m,idNum(list[i]&&list[i].id));}return m;}
    function lift(current,maxv,setter){if(maxv>current){setter(maxv);changed=true;}}
    lift(meseCounter,maxIds(MESI),function(v){meseCounter=v;});
    var maxPost=0;for(var mi=0;mi<MESI.length;mi++){maxPost=Math.max(maxPost,maxIds(MESI[mi]&&MESI[mi].posts));}
    lift(postCounter,maxPost,function(v){postCounter=v;});
    var maxIng=maxIds(DISPENSA.ingredienti);
    if(Array.isArray(DISPENSA.ingredienti)){for(var di=0;di<DISPENSA.ingredienti.length;di++){var aliases=DISPENSA.ingredienti[di]&&DISPENSA.ingredienti[di].legacyIds;if(Array.isArray(aliases)){for(var ai=0;ai<aliases.length;ai++){maxIng=Math.max(maxIng,idNum(aliases[ai]));}}}}
    lift(ingredienteCounter,maxIng,function(v){ingredienteCounter=v;});
    lift(movimentoCounter,maxIds(DISPENSA.movimenti),function(v){movimentoCounter=v;});
    lift(calderoneCounter,Math.max(maxIds(CALDERONI),maxIds(ARCHIVIO_CALDERONI)),function(v){calderoneCounter=v;});
    lift(piantaCounter,Math.max(maxIds(PIANTE),maxIds(ARCHIVIO_PIANTE)),function(v){piantaCounter=v;});
    lift(creaturaCounter,Math.max(maxIds(CREATURE),maxIds(ARCHIVIO_CREATURE)),function(v){creaturaCounter=v;});
    if(changed){DATA_DIRTY=true;}
    return changed;
  }

  function scheduleAuditForState(savedState){
    PENDING_AUDIT_STATE = historyComparableState(savedState);
    if(!LAST_AUDITED_STATE){ LAST_AUDITED_STATE = cloneHistoryState(PENDING_AUDIT_STATE); return; }
    if(auditFlushTimer){ clearTimeout(auditFlushTimer); }
    auditFlushTimer = setTimeout(function(){ flushAuditNow(); }, 1200);
  }
  function flushAuditNow(){
    if(auditFlushTimer){ clearTimeout(auditFlushTimer); auditFlushTimer=null; }
    if(!PENDING_AUDIT_STATE || !LAST_AUDITED_STATE || !window.fbWriteAudit || !fbConnected){ return Promise.resolve(true); }
    var target=cloneHistoryState(PENDING_AUDIT_STATE), changes=[];
    diffHistory(LAST_AUDITED_STATE,target,"",changes,0);
    if(!changes.length){ LAST_AUDITED_STATE=target; return Promise.resolve(true); }
    var ev={ sessionId:SESSION_ID, dbRevision:DB_REVISION, section:historySection(changes), summary:"Modifiche in "+historySection(changes)+" ("+changes.length+(changes.length>=30?"+":"")+" variazioni)", changes:changes.slice(0,30) };
    return window.fbWriteAudit(STUDENTE.nome,ev).then(function(ok){ if(ok){ LAST_AUDITED_STATE=target; } return ok; }).catch(function(){return false;});
  }
  function stateHasUsefulContent(st){
    if(!st)return false;
    try{return JSON.stringify(st).length>450;}catch(e){return true;}
  }
  function saveStateWithHistory(state){
    var comparable=historyComparableState(state);
    var prev=LAST_PERSISTED_STATE?cloneHistoryState(LAST_PERSISTED_STATE):null;
    var destructive=!!(prev&&anyArrayShrank(prev,comparable,0));
    var periodic=(Date.now()-LAST_SNAPSHOT_MS)>=SNAPSHOT_INTERVAL_MS;
    var needSnapshot=!!(prev&&stateHasUsefulContent(prev)&&(!SESSION_SNAPSHOT_DONE||destructive||periodic));
    var reason=!SESSION_SNAPSHOT_DONE?"Checkpoint prima delle modifiche della sessione":(destructive?"Backup automatico prima di una rimozione":"Checkpoint periodico");
    var snapPromise=Promise.resolve(true), snapshotAttempted=false;
    if(needSnapshot && window.fbCreateSnapshot && window.fbLoadState){
      snapshotAttempted=true;
      /* Fotografa lo stato realmente presente su Firebase PRIMA della nuova
         scrittura: il backup resta verificabile e ripristinabile dal Narratore. */
      snapPromise=window.fbLoadState(STUDENTE.nome).then(function(remoteBefore){
        if(!remoteBefore){ return true; }
        return window.fbCreateSnapshot(STUDENTE.nome,{state:remoteBefore,reason:reason,sessionId:SESSION_ID,sizeBytes:stateSizeBytes(remoteBefore),schemaVersion:25});
      });
    }
    return Promise.resolve(snapPromise).catch(function(e){console.error(e);return false;}).then(function(snapshotOk){
      if(snapshotAttempted && snapshotOk){ SESSION_SNAPSHOT_DONE=true; LAST_SNAPSHOT_MS=Date.now(); }
      if(destructive && snapshotAttempted && !snapshotOk){ window.fbLastSaveError={code:"snapshot-failed"}; return false; }
      return window.fbSaveState(STUDENTE.nome,state,SESSION_ID,PG_DOC_EXISTS);
    }).then(function(ok){
      if(ok){ PG_DOC_EXISTS=true; LAST_MODIFIED_AT=new Date(); LAST_MODIFIED_BY="pg"; LAST_SESSION_ID=SESSION_ID; DATA_DIRTY=false; LAST_PERSISTED_STATE=cloneHistoryState(comparable); scheduleAuditForState(comparable); }
      return ok;
    });
  }

  function serializedSaveLatest(){
    if(SAVE_IN_FLIGHT_PROMISE){ SAVE_FORCE_AGAIN=true; return SAVE_IN_FLIGHT_PROMISE; }
    SAVE_FORCE_AGAIN=false;
    function loop(){
      var state=collectState(), bytes=stateSizeBytes(state), comparable=historyComparableState(state);
      if(bytes>900000){ fbStatusText="Salvataggio troppo grande ("+sizeLabel(bytes)+"): archivia i dati vecchi con il Narratore"; updateFbIndicator(); return Promise.resolve(false); }
      var changed=!LAST_PERSISTED_STATE || JSON.stringify(comparable)!==JSON.stringify(LAST_PERSISTED_STATE);
      if(!changed && !DATA_DIRTY && !SAVE_FORCE_AGAIN){ return Promise.resolve(true); }
      if(changed){ DATA_DIRTY=true; }
      SAVE_FORCE_AGAIN=false;
      return saveStateWithHistory(state).then(function(ok){
        if(!ok){ return false; }
        var fresh=historyComparableState(collectState());
        var again=SAVE_FORCE_AGAIN || !LAST_PERSISTED_STATE || JSON.stringify(fresh)!==JSON.stringify(LAST_PERSISTED_STATE) || DATA_DIRTY;
        SAVE_FORCE_AGAIN=false;
        return again ? loop() : true;
      });
    }
    var work=loop();
    SAVE_IN_FLIGHT_PROMISE=work.then(function(ok){SAVE_IN_FLIGHT_PROMISE=null;return ok;},function(err){SAVE_IN_FLIGHT_PROMISE=null;throw err;});
    return SAVE_IN_FLIGHT_PROMISE;
  }

  function scheduleSave(delayMs, registraModifica){
    if(registraModifica !== false){ DATA_DIRTY = true; }

    if(fbSaveTimer){ clearTimeout(fbSaveTimer); }
    fbStatusText = "Salvataggio in corso…";
    fbSaveTimer = setTimeout(function(){
      var state = collectState(); var bytes=stateSizeBytes(state); var comparable=historyComparableState(state);
      if(bytes>900000){ fbStatusText="Salvataggio troppo grande ("+sizeLabel(bytes)+"): archivia i dati vecchi con il Narratore"; updateFbIndicator(); return; }
      var changed=!LAST_PERSISTED_STATE || JSON.stringify(comparable)!==JSON.stringify(LAST_PERSISTED_STATE);
      if(!changed && !DATA_DIRTY){ fbStatusText="Salvato su Firebase"; updateFbIndicator(); return; }
      if(changed){ DATA_DIRTY=true; }
      serializedSaveLatest().then(function(ok){

  function valoreG(pos){
    var scale = [30,20,15,10,8,6,4,3,2,2];
    if(pos <= 10){ return scale[pos-1]; }
    return 1;
  }
  function cumulativeG(pos){ var tot=0; for(var i=1;i<=pos;i++){ tot=tot+valoreG(i); } return tot; }
  function valorePP(post){ var v = parseInt(post && post.pp != null ? post.pp : 0, 10); if(isNaN(v) || v < 0){ return 0; } return v; }
  function meseBonusPP(mese){ var v=parseInt(mese && mese.eventoBonusPP != null ? mese.eventoBonusPP : 0,10); if(isNaN(v)||v<0){return 0;} return v; }
  function postEligibleForEventBonus(post){ return !!(post && String(post.link || "").trim() !== "" && !post.eventoBonusEscluso); }
  function eventBonusEligibleCount(posts,endExclusive){ var count=0; for(var i=0;i<endExclusive;i++){ if(postEligibleForEventBonus(posts[i])){count++;} } return count; }
  function cumulativeBasePP(posts, endExclusive){ var tot=0; for(var i=0;i<endExclusive;i++){ if(posts[i] && String(posts[i].link || "").trim() !== ""){ tot += valorePP(posts[i]); } } return tot; }
  function eventBonusTotal(mese,posts,endExclusive){ var bonus=meseBonusPP(mese); if(!bonus){return 0;} return eventBonusEligibleCount(posts,endExclusive)*bonus; }
  function cumulativePP(posts, endExclusive, mese){ return cumulativeBasePP(posts,endExclusive)+eventBonusTotal(mese,posts,endExclusive); }
  function makeEventBonusExclusionCell(post,mese,locked){
    var td=el("td"),line=el("label","chk-line"),cb=el("input"); cb.type="checkbox"; cb.checked=!!(post&&post.eventoBonusEscluso); cb.disabled=!!locked || !post || String(post.link||"").trim()==="";
    cb.addEventListener("change",function(){ if(blockIfMonthReadOnly(mese)){cb.checked=!!post.eventoBonusEscluso;return;} post.eventoBonusEscluso=!!cb.checked; scheduleSave(0); renderAll(); });
    line.appendChild(cb); line.appendChild(el("span",null,"Escludi bonus")); td.appendChild(line); return td;
  }

  function buildPostazioneFacOutput(){
    var wrap = el("div");

    if(POSTAZIONE_FAC.descrizione !== ""){ lines.push("<b>Descrizione:</b> " + POSTAZIONE_FAC.descrizione); }
    lines.push("<b>Numero di Posti disponibili:</b> " + ANNO_POSTI[STUDENTE.anno]);

      var pz = CALDERONI[k];

      voce = voce + (pz.dataLink !== "" ? "[URL=" + pz.dataLink + "]Calderone n\u00b0" + pz.numero + ":[/URL]" : "Calderone n\u00b0" + pz.numero + ":");
      voce = voce + " " + pz.nomePozione + ", " + pz.classificazione;
      listaLines.push(voce);
    }
    lines.push("<details><summary><b>Lista delle Pozioni nella Postazione</b></summary>");
    for(var m=0;m<listaLines.length;m++){ lines.push(listaLines[m]); }
    lines.push("</details>");

    for(var n=0;n<CALDERONI.length;n++){
      var postaz = CALDERONI[n];
      lines.push("");
      lines.push("[color=" + postaz.colore + "]<b>Postazione n\u00b0" + postaz.numero + "</b>[/color]");
      lines.push("<b>\u2a2f Data di creazione e link della role, se presente:</b> " + (postaz.dataLink !== "" ? "[URL=" + postaz.dataLink + "]" + postaz.dataTesto + "[/URL]" : postaz.dataTesto));
      lines.push("<b>\u2a2f Nome Pozione e Classificazione:</b> " + postaz.nomePozione + ", " + postaz.classificazione);
      lines.push("<b>\u2a2f Tipologia:</b> " + postaz.tipologia);
      lines.push("<b>\u2a2f Calderone e/o Oggetti utilizzati:</b> " + postaz.calderoneOggetti);
      lines.push("<b>\u2a2f Fasi di creazione:</b>");

      var prepSign = postaz.prepEsito === "fallita" ? 0 - Math.abs(postaz.prepValore) : Math.abs(postaz.prepValore);
      lines.push("- <u>Preparazione degli Ingredienti:</u> " + (postaz.prepLink !== "" ? "[URL=" + postaz.prepLink + "]" + postaz.prepEsito + "[/URL]" : postaz.prepEsito) + " \u2192 " + fmtPct(prepSign) + " Forza");
      var prodSign = postaz.prodEsito === "fallita" ? 0 - Math.abs(postaz.prodValore) : Math.abs(postaz.prodValore);
      lines.push("- <u>Produzione:</u> " + (postaz.prodLink !== "" ? "[URL=" + postaz.prodLink + "]" + postaz.prodEsito + "[/URL]" : postaz.prodEsito) + " \u2192 " + fmtPct(prodSign) + " Forza");
      lines.push("- <u>Uso della Bacchetta magica:</u> " + (postaz.bacchettaLink !== "" ? "[URL=" + postaz.bacchettaLink + "]" + postaz.bacchettaEsito + "[/URL]" : postaz.bacchettaEsito) + " \u2192 " + postaz.dosi + " Dosi");
      if(postaz.distillSvolta){
        var dtxt = "- <u> Distillazione:</u> " + (postaz.distillLink !== "" ? "[URL=" + postaz.distillLink + "]x[/URL]" : "x");
        if(postaz.distillEsito !== ""){ dtxt = dtxt + " \u2192 " + postaz.distillEsito; }
        lines.push(dtxt);
      } else { lines.push("- <u> Distillazione:</u> //"); }

      var forzaTotale = prepSign + prodSign;
      lines.push("<b>\u2a2f Forza totale Pozione:</b> " + fmtPct(forzaTotale) + " Forza finale");
      lines.push("- <u> Imbottigliamento e Pulizia del Calderone:</u> " + (postaz.imbottLink !== "" ? "[URL=" + postaz.imbottLink + "]" + postaz.imbottPercent + "%[/URL]" : postaz.imbottPercent + "%") + ", Calderaio " + postaz.calderaio + ", " + postaz.classificazione + " \u2192 " + postaz.postRichiesti + " post");

      lines.push("[SPOILER]");
      for(var s=0; s<postaz.postRichiesti; s++){
        var slotPost = getPostByGlobalNo(postaz.startIndex + s);
        lines.push(slotPost ? (s+1) + ": [URL=" + slotPost.link + "]x[/URL]" : (s+1) + ":");
      }
      lines.push("[/SPOILER]");
    }

    var codeBox = el("div", "dice-code"); codeBox.id = "postaz-output"; codeBox.textContent = lines.join("\n");
    wrap.appendChild(codeBox);
    return wrap;
  }

  function ensurePhaseHistory(occupant){
    if(!Array.isArray(occupant.faseHistory)){ occupant.faseHistory = []; }
    return occupant.faseHistory;

  function pushPhaseHistory(occupant){
    var hist = ensurePhaseHistory(occupant);
    hist.push({
      faseAttuale: occupant.faseAttuale,
      faseDataInizio: occupant.faseDataInizio || "",
      faseLink: occupant.faseLink || ""

  }
  function undoLastPhaseAdvance(occupant){
    var hist = ensurePhaseHistory(occupant);
    if(!hist.length){ return false; }
    var prev = hist.pop();
    occupant.faseAttuale = prev.faseAttuale;
    occupant.faseDataInizio = prev.faseDataInizio || "";
    occupant.faseLink = prev.faseLink || "";
    return true;
  }

  function buildAdvancementPanel(occupant, stages, listRef, archivioRef){
    ensureOccupantStageData(occupant, stages);
    var wrap = el("div", "guide-text");
    var phaseConfig = { tipoLabel: (stages.length && stages[0].key === "seme") ? "Pianta" : "Creatura" };
    var currentStage = null;
    for(var i=0;i<stages.length;i++){ if(stages[i].label === occupant.faseAttuale){ currentStage = stages[i]; } }
    if(!currentStage){ return wrap; }

    if(occupant.morta){
      wrap.innerHTML = sanitizeHtml("<b>Stato:</b> Deceduta/o.");
      return wrap;
    }

    var cicliData = occupant.cicli[currentStage.key];
    var completedText = "";
    var phaseReady = false;
    if(currentStage.type === "gestazione"){
      var doneGest = subEntryFilled(cicliData.evento);
      phaseReady = !!doneGest;
      completedText = doneGest ? "Gestazione completata." : "Gestazione in corso.";
    } else {
      var res = countCompletedCicli(occupant, currentStage);
      if(currentStage.type === "ripro"){ phaseReady = !!(res && res.total > 0 && res.completed >= res.total && res.reproDone >= 1); }
      else { phaseReady = !!(res && res.total > 0 && res.completed >= res.total); }
      completedText = "Cicli di Produzione completati: " + res.completed + "/" + res.total + ".";
      if(currentStage.type === "ripro"){ completedText += " Riproduzione: " + (res.reproDone||0) + "/1."; }
    }

    wrap.innerHTML = sanitizeHtml("<b>Avanzamento fase vitale \u2014 " + occupant.faseAttuale + "</b><br>" + completedText +
      "<br>In alternativa, passa comunque alla fase successiva dopo <b>" + currentStage.months +
      " mesi OFFGame</b> dalla data di inizio di questa fase (" +
      (occupant.faseDataInizio !== "" ? occupant.faseDataInizio : "non specificata") +
      "), anche se i Cicli non sono completi.");

    if(ensurePhaseHistory(occupant).length){
      wrap.innerHTML = sanitizeHtml(wrap.innerHTML + "<br><small>Hai avanzato questa fase dal tool: puoi annullare l'ultimo passaggio senza perdere i dati già compilati.</small>");
    }

    var nextLabel = nextStageLabel(stages, occupant.faseAttuale);
    var btnRow = el("div");
    var hist = ensurePhaseHistory(occupant);
    if(hist.length){
      var prevState = hist[hist.length - 1];
      var btnBack = el("button", "action", "Torna a: " + prevState.faseAttuale);
      btnBack.style.marginRight = "8px";
      btnBack.title = "Annulla l'ultimo avanzamento di fase senza cancellare Cicli o altri dati già inseriti.";
      btnBack.addEventListener(EV, function(){
        undoLastPhaseAdvance(occupant);
        openStageDetails(occupant, stages, phaseConfig, occupant.faseAttuale);
        scheduleSave(0); renderAll();
      });
      btnRow.appendChild(btnBack);
    }
    if(nextLabel){
      var btn = el("button", "action", "Fai passare a: " + nextLabel);
      btn.addEventListener(EV, function(){
        pushPhaseHistory(occupant);
        occupant.faseAttuale = canonicalStageLabel(stages, nextLabel);
        occupant.faseDataInizio = "";
        openStageDetails(occupant, stages, phaseConfig, occupant.faseAttuale);
        scheduleSave(0); renderAll();
      });
      btnRow.appendChild(btn);
    } else {
      var btnD = el("button", "action danger", "Segna come Morta/o e sposta in Archivio");
      btnD.addEventListener(EV, function(){
        occupant.morta = true;
        if(listRef){
          var idx = listRef.indexOf(occupant);
          if(idx > -1){ listRef.splice(idx, 1); }
        }
        archiveStamp(occupant);
        if(archivioRef){ archivioRef.push(occupant); }
        scheduleSave(0); renderAll();
      });
      btnRow.appendChild(btnD);
    }
    if(phaseReady){
      var readyText = nextLabel ? ("✅ Fase completata — puoi passare a " + nextLabel + ".") : "✅ Fase completata — puoi concludere il ciclo vitale e spostare l'esemplare in Archivio.";
      wrap.appendChild(el("div", "phase-ready", readyText));
    }
    wrap.appendChild(btnRow);
    return wrap;
  }

  function countCompletedCicli(occupant, stage){

      var c = 0;
      for(var i=0;i<cicliData.list.length;i++){ if(subEntryFilled(cicliData.list[i])){ c = c + 1; } }
      return { completed: c, total: cicliData.list.length };
    }
    if(stage.type === "ripro"){
      var c2 = 0;
      for(var j=0;j<cicliData.list.length;j++){ if(subEntryFilled(cicliData.list[j])){ c2 = c2 + 1; } }
      var reproDone = subEntryFilled(cicliData.evento) ? 1 : 0;

    lines.push("[SPOILER]<b>Post Cicli di Produzione/Riproduzione</b>");
    for(var s2=0;s2<stages.length;s2++){
      var stage = stages[s2];
      var cicliData = occupant.cicli[stage.key];
      lines.push("<details><summary><u><b>\u2a2f " + stage.label + "</b></u></summary>");
      if(stage.type === "gestazione"){ lines.push(buildSubEntryLine(cicliData.evento, "Gestazione", null)); }
      if(stage.type === "cicli"){
        for(var i=0;i<cicliData.list.length;i++){ lines.push(buildSubEntryLine(cicliData.list[i], "Ciclo di Produzione " + (i+1), "Ingredienti ottenuti")); lines.push(""); }
      }
      if(stage.type === "ripro"){
        lines.push(buildSubEntryLine(cicliData.evento, "Riproduzione", stage.ottenuti)); lines.push("");
        for(var j=0;j<cicliData.list.length;j++){ lines.push(buildSubEntryLine(cicliData.list[j], "Ciclo di Produzione " + (j+1), "Ingredienti ottenuti")); lines.push(""); }
      }
      lines.push("</details>");
    }
    lines.push("[/SPOILER]");
    return lines;
  }

  /* ==================================================== */
  /* STEP 5/6 - CUBICOLO / RECINTO                          */
  /* ==================================================== */
  function renderOccupantFacilityStep(container, kind){
    var isCubicolo = kind === "cubicolo";
    var FAC = isCubicolo ? CUBICOLO_FAC : RECINTO_FAC;
    var LIST = isCubicolo ? PIANTE : CREATURE;
    var ARCHIVIO = isCubicolo ? ARCHIVIO_PIANTE : ARCHIVIO_CREATURE;
    var stages = isCubicolo ? plantStages() : creatureStages();
    var config = { tipoLabel: isCubicolo ? "Pianta" : "Creatura", agendaLabels: isCubicolo ? AGENDA_PLANT : AGENDA_CREATURE, specieLabel: isCubicolo ? "Specie, se nota" : "Specie e sesso, se noto" };
    var struttAttiva = isCubicolo ? STRUTTURE.cubicolo : STRUTTURE.recinto;
    var titolo = isCubicolo ? "Cubicolo" : "Recinto";
    var listaLabel = isCubicolo ? "Lista delle Piante nel Cubicolo" : "Lista delle Creature nel Recinto";

    var p = el("div", "panel");
    if(!struttAttiva){
      p.appendChild(el("div", "guide-text", "Non hai attivato il " + titolo + " nella schermata «Dati Personaggio e Strutture»."));
      container.appendChild(p); return;
    }
    p.appendChild(el("h2", null, "Dati del " + titolo));
    p.appendChild(el("p", null, "<b>Posti disponibili:</b> " + ANNO_POSTI[STUDENTE.anno] + " (Anno " + STUDENTE.anno + ") \u2014 Classificazione sempre fra X e XXX."));

    if(!isCubicolo){
      var artiglBox = el("div", "guide-text");
      artiglBox.innerHTML = "<b>Rischio Artigliatite</b> \u2014 se un tuo PG subisce ONGame una ferita da taglio per via di una Creatura Magica, tira questo dado: la contrae se 1-3.";
      p.appendChild(artiglBox);
      p.appendChild(el("div", "divider"));
    }

    var d7 = el("div"); d7.appendChild(el("label", null, "Descrizione (facoltativa)"));
    var ta = el("textarea"); ta.value = FAC.descrizione;
    ta.addEventListener("input", function(){ FAC.descrizione = ta.value; });
    d7.appendChild(ta); p.appendChild(d7);

    p.appendChild(el("div", "divider"));
    p.appendChild(el("h4", null, config.tipoLabel === "Pianta" ? "Piante presenti" : "Creature presenti"));
    for(var i=0;i<LIST.length;i++){ p.appendChild(buildOccupantCard(LIST[i], stages, config, LIST, ARCHIVIO)); }
    var addBtn = el("button", "action", "+ Aggiungi " + config.tipoLabel);
    addBtn.addEventListener(EV, function(){
      if(LIST.length >= ANNO_POSTI[STUDENTE.anno]){
        alert("Hai gi\u00e0 raggiunto il numero massimo consentito dal tuo Anno Scolastico.");
        return;
      }
      var o = newOccupant(stages);
      if(isCubicolo){ piantaCounter = piantaCounter + 1; o.id = piantaCounter; }
      else { creaturaCounter = creaturaCounter + 1; o.id = creaturaCounter; }
      LIST.push(o);
      scheduleSave(0); renderAll();
    });
    p.appendChild(addBtn);

    if(!isCubicolo){
      p.appendChild(el("div", "divider"));
      p.appendChild(el("h4", null, "Medicheria (1 sola Creatura di passaggio)"));
      var card = el("div", "card");
      var row = el("div", "row");
      var d1 = el("div"); d1.appendChild(el("label", null, "Nome"));
      var i1 = el("input"); i1.type="text"; i1.value = MEDICHERIA.nome;
      i1.addEventListener("input", function(){ MEDICHERIA.nome = i1.value; });
      d1.appendChild(i1); row.appendChild(d1);
      var d2 = el("div"); d2.appendChild(el("label", null, "Specie"));
      var i2 = el("input"); i2.type="text"; i2.value = MEDICHERIA.specie;
      i2.addEventListener("input", function(){ MEDICHERIA.specie = i2.value; });
      d2.appendChild(i2); row.appendChild(d2);
      var d3 = el("div"); d3.appendChild(el("label", null, "Classificazione"));
      d3.appendChild(buildSelect(CLASSI_STUD, MEDICHERIA.classificazione, function(v){ MEDICHERIA.classificazione = v; }));
      row.appendChild(d3);
      var d4 = el("div"); d4.appendChild(el("label", null, "Link abitacolo"));
      var i4 = el("input"); i4.type="text"; i4.value = MEDICHERIA.link;
      i4.addEventListener("input", function(){ MEDICHERIA.link = i4.value; });
      d4.appendChild(i4); row.appendChild(d4);
      card.appendChild(row);
      p.appendChild(card);
    }

    p.appendChild(el("div", "divider"));
    p.appendChild(el("h4", null, "Archivio (" + (config.tipoLabel === "Pianta" ? "Piante decedute" : "Creature decedute") + ")"));
    if(ARCHIVIO.length === 0){
      p.appendChild(el("p", "small-note", "Nessuna " + (config.tipoLabel === "Pianta" ? "pianta" : "creatura") + " nell'archivio."));
    }
    for(var ai=0; ai<ARCHIVIO.length; ai++){
      (function(occ){
        var lockedOcc=archiveLocked(occ);
        var archCard = el("div", "card" + (lockedOcc ? " archive-locked" : ""));
        var ah = el("h3");
        ah.appendChild(el("span", null, (occ.nome !== "" ? occ.nome : "(senza nome)") + " †"));
        var btnGroup = el("div");
        var btnRestore = el("button", "action small", lockedOcc ? "🔒 Consolidata" : "Ripristina"); btnRestore.disabled=lockedOcc;
        btnRestore.addEventListener(EV, function(){
          if(blockIfArchiveLocked(occ)){ return; }
          occ.morta = false; occ._archivedAt="";
          var idx = ARCHIVIO.indexOf(occ);
          if(idx > -1){ ARCHIVIO.splice(idx, 1); }
          LIST.push(occ);
          scheduleSave(0); renderAll();
        });
        btnGroup.appendChild(btnRestore);
        var btnDelete = el("button", "action danger small", "Elimina definitivamente"); btnDelete.disabled=lockedOcc;
        btnDelete.addEventListener(EV, function(){
          if(blockIfArchiveLocked(occ)){ return; }
          var nomeOcc=occ.nome!==""?occ.nome:(config.tipoLabel+" senza nome");
          if(!confirm("Eliminare definitivamente dall’Archivio «"+nomeOcc+"»?\n\nL’operazione verrà comunque protetta da uno snapshot automatico prima del salvataggio.")){ return; }
          var idx2 = ARCHIVIO.indexOf(occ);
          if(idx2 > -1){ ARCHIVIO.splice(idx2, 1); }
          scheduleSave(0); renderAll();
        });
        btnGroup.appendChild(btnDelete);
        ah.appendChild(btnGroup);
        archCard.appendChild(ah);
        if(lockedOcc){archCard.appendChild(el("div","archive-lock-note",archiveLockText(occ)));}
        archCard.appendChild(el("p", "small-note", "Classificazione " + occ.classificazione + " — ultima fase: " + occ.faseAttuale));
        p.appendChild(archCard);
      })(ARCHIVIO[ai]);
    }

    p.appendChild(el("div", "divider"));

    container.appendChild(p);
  }

  function buildFacilityOutput(FAC, LIST, ARCHIVIO, stages, config, listaLabel, isCubicolo){
    var wrap = el("div");
    var lines = [];
    if(FAC.descrizione !== ""){ lines.push("<b>Descrizione:</b> " + FAC.descrizione); }
    lines.push("<b>Numero di posti disponibili:</b> " + ANNO_POSTI[STUDENTE.anno]);

    var listaLines = [];
    for(var k=0;k<LIST.length;k++){
      var oc = LIST[k];
      var voce = "- " + oc.nome + ", " + oc.specieSesso + ", " + oc.classificazione;
      if(oc.dataLink !== ""){ voce = voce + " [URL=" + oc.dataLink + "]link[/URL]"; }
      listaLines.push(voce);
    }
    lines.push("<details><summary><b>" + listaLabel + "</b></summary>");
    for(var m=0;m<listaLines.length;m++){ lines.push(listaLines[m]); }
    lines.push("</details>");

    if(!isCubicolo){
      var voceM = "- " + MEDICHERIA.nome + ", " + MEDICHERIA.specie + ", " + MEDICHERIA.classificazione;
      if(String(MEDICHERIA.link || "").trim() !== ""){ voceM = voceM + " [URL=" + MEDICHERIA.link + "]link[/URL]"; }
      lines.push("<details><summary><b>Creatura in Medicheria</b></summary>");
      lines.push(voceM);
      lines.push("</details>");
    }

    var tutti = LIST.concat(ARCHIVIO);
    for(var n=0;n<tutti.length;n++){
      lines.push("");
      var occLines = buildOccupantOutputLines(tutti[n], stages, config);
      for(var q=0;q<occLines.length;q++){ lines.push(occLines[q]); }
    }

    var codeId = "fac-output-" + (isCubicolo ? "cubicolo" : "recinto");
    var codeBox = el("div", "dice-code"); codeBox.id = codeId; codeBox.textContent = lines.join("\n");
    wrap.appendChild(codeBox);
    return wrap;
  }

  /* ==================================================== */
  /* STEP 7 - ESPORTA PER IL TOOL ADULTI                    */
  /* ==================================================== */
  function transferFingerprint(obj){
    var raw="";try{raw=JSON.stringify(obj||{});}catch(e){raw=String(Date.now());}
    var h=2166136261;for(var i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619);}
    return (h>>>0).toString(36);
  }

  function renderEsportaStep(container){
    var p = el("div", "panel");
    p.appendChild(el("h2", null, "Diventa Adulto: Esporta i tuoi dati"));
    p.appendChild(el("div", "guide-text",
      "Il regolamento permette di spostare Pozioni, Piante e Creature e mantenere anche la propria Dispensa dalla Postazione/Cubicolo/Recinto in un nuovo Laboratorio/Serra/Riserva quando il PG diventa Adulto. " +
      "Scegli cosa vuoi portare con te, genera il pacchetto qui sotto, copialo e incollalo nello Step \u00abImporta da Studente\u00bb dello strumento Gestione PG Adulto: tutto il progresso gi\u00e0 fatto (Cicli, post accumulati) verr\u00e0 mantenuto."));

    var opts = { calderoni:true, piante:true, creature:true, dispensa:true };

    var chk1 = el("div", "chk-line");
    var box1 = el("input"); box1.type="checkbox"; box1.checked = true;
    box1.addEventListener("change", function(){ opts.calderoni = box1.checked; });
    chk1.appendChild(box1); chk1.appendChild(el("span", null, "Includi le Pozioni della Postazione (" + (CALDERONI.length + ARCHIVIO_CALDERONI.length) + ", comprese archiviate)"));
    p.appendChild(chk1);

    var chk2 = el("div", "chk-line");
    var box2 = el("input"); box2.type="checkbox"; box2.checked = true;
    box2.addEventListener("change", function(){ opts.piante = box2.checked; });
    chk2.appendChild(box2); chk2.appendChild(el("span", null, "Includi le Piante del Cubicolo (" + (PIANTE.length + ARCHIVIO_PIANTE.length) + ", comprese archiviate)"));
    p.appendChild(chk2);

    var chk3 = el("div", "chk-line");
    var box3 = el("input"); box3.type="checkbox"; box3.checked = true;
    box3.addEventListener("change", function(){ opts.creature = box3.checked; });
    chk3.appendChild(box3); chk3.appendChild(el("span", null, "Includi le Creature del Recinto (" + (CREATURE.length + ARCHIVIO_CREATURE.length) + ", comprese archiviate)"));
    p.appendChild(chk3);

    var chk4 = el("div", "chk-line");
    var box4 = el("input"); box4.type="checkbox"; box4.checked = true;
    box4.addEventListener("change", function(){ opts.dispensa = box4.checked; });
    chk4.appendChild(box4); chk4.appendChild(el("span", null, "Includi la Dispensa degli Ingredienti (" + DISPENSA.ingredienti.length + " voci)"));
    p.appendChild(chk4);

    var genBtn = el("button", "action", "Genera pacchetto di trasferimento");
    var outWrap = el("div"); outWrap.id = "esporta-out";
    genBtn.addEventListener(EV, function(){
      var payload = { transferVersion:2, sourcePg:STUDENTE.nome, mesi: MESI, globalPostCounter: globalPostCounter };
      if(opts.calderoni){ payload.calderoni = CALDERONI; payload.archivioCalderoni = ARCHIVIO_CALDERONI; }
      if(opts.piante){ payload.piante = PIANTE; payload.archivioPiante = ARCHIVIO_PIANTE; }
      if(opts.creature){ payload.creature = CREATURE; payload.archivioCreature = ARCHIVIO_CREATURE; payload.medicheria = MEDICHERIA; }
      if(opts.dispensa){ payload.dispensa = DISPENSA; }
      payload.transferId="stud-"+transferFingerprint(payload);
      var json = JSON.stringify(payload);
      outWrap.innerHTML = "";
      var copyBtn2 = el("button", "copy-btn", "Copia pacchetto");
      copyBtn2.addEventListener(EV, function(){
        var handledAsync = false;
        if(navigator.clipboard && navigator.clipboard.writeText){
          handledAsync = true;
          navigator.clipboard.writeText(json).then(function(){ flashCopied(copyBtn2, true); })
            .catch(function(){ var ok = fallbackCopyText(json); flashCopied(copyBtn2, ok); });
        }
        if(!handledAsync){ var ok2 = fallbackCopyText(json); flashCopied(copyBtn2, ok2); }
      });
      outWrap.appendChild(copyBtn2);
      outWrap.appendChild(el("p", "small-note", "Pacchetto pronto: copialo e incollalo nello strumento Gestione PG Adulto, Step \u00abImporta da Studente\u00bb."));
    });
    p.appendChild(genBtn);
    p.appendChild(outWrap);

    container.appendChild(p);
  }

  installUniversalAutosave();
  renderAll();

  function notifyParentHeight(){
    if(window.parent===window){return;}
    var h=Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0);
    try{window.parent.postMessage({tipo:"felix-tool-height",tool:"studente",height:h},"*");}catch(e){}
  }
  if(typeof ResizeObserver!=="undefined"){new ResizeObserver(function(){notifyParentHeight();}).observe(document.documentElement);}
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden" && fbConnected){
      if(DATA_DIRTY){ scheduleSave(0); }
      if(PENDING_AUDIT_STATE){ flushAuditNow(); }
    }
  });
  window.addEventListener("load",notifyParentHeight);

})();
</script>
