  function taccProgress(value,def,state,key){
    value=taccNum(value); var unit=def.unit?" "+def.unit:"";
    if(def.repeatAfter&&def.repeatEvery){
      var reached=(def.thresholds||[]).filter(function(x){return value>=x;});
      var msg="Totale: "+value+unit+". ";
      if(reached.length){msg+="Soglie raggiunte: "+reached.join(", ")+". ";}
      var nextThreshold=(def.thresholds||[]).find(function(x){return value<x;});
      if(nextThreshold){msg+="Prossimo traguardo: "+nextThreshold+unit+".";}
      else if(value<def.repeatAfter){msg+="Prossimo traguardo: "+def.repeatAfter+unit+".";}
      else{var next=def.repeatAfter+Math.ceil((value-def.repeatAfter+1)/def.repeatEvery)*def.repeatEvery;msg+="Da qui, nuovo riscatto ogni "+def.repeatEvery+unit+"; prossimo a "+next+unit+".";}
      return {complete:value>=(def.thresholds&&def.thresholds[0]||def.repeatAfter),text:msg};
    }
    if(def.repeatEvery){
      var n=Math.floor(value/def.repeatEvery),claimed=Math.max(0,parseInt((state.claimed||{})[key],10)||0),pending=Math.max(0,n-claimed);
      var rem=value%def.repeatEvery,need=rem===0?def.repeatEvery:def.repeatEvery-rem;
      return {complete:n>0,text:"Totale: "+value+unit+" · traguardi maturati: "+n+" · già riscattati: "+claimed+" · da riscattare: "+pending+" · al prossimo: "+need+unit+"."};
    }
    if(def.thresholds&&def.thresholds.length){
      var reached2=def.thresholds.filter(function(x){return value>=x;}),next2=def.thresholds.find(function(x){return value<x;});
      return {complete:reached2.length===def.thresholds.length,text:"Totale: "+value+unit+" · soglie raggiunte: "+(reached2.length?reached2.join(", "):"nessuna")+(next2?" · prossima: "+next2+unit:" · tutte le soglie raggiunte")+"."};
    }
    var goal=taccNum(def.goal),missing=Math.max(0,goal-value);
    return {complete:goal>0&&value>=goal,text:goal?((value>=goal?"Completato: ":"Progressi: ")+value+" / "+goal+unit+(missing?" · mancano "+missing+unit:"")):"Totale: "+value+unit};
  }

  function flushTaccuinoCloudBeforeLock(){

       sempre a pubblicare l'ultima copia. Se fallisce, non fingiamo che sia tutto

    return Promise.resolve(taccCloudPush(true)).catch(function(e){console.error(e);return false;}).then(function(ok){
      if(ok){return true;}
      return confirm("Il Taccuino non è stato sincronizzato nel cloud. Gli altri utenti potrebbero vedere ancora la versione precedente.\n\nLa copia locale in questo browser resta disponibile. Vuoi disconnetterti comunque?");

    return serializedSaveLatest().then(function(ok){

  function lockEditingKeepPg(btn){
    if(!EDIT_UNLOCKED||EDIT_DISCONNECT_PENDING){return Promise.resolve(true);}
    EDIT_DISCONNECT_PENDING=true;
    if(fbSaveTimer){clearTimeout(fbSaveTimer);fbSaveTimer=null;}
    if(TACC_CLOUD_TIMER){clearTimeout(TACC_CLOUD_TIMER);TACC_CLOUD_TIMER=null;}
    if(btn){btn.disabled=true;btn.textContent="Disconnessione…";}
    /* Il salvataggio normale è già automatico. Qui facciamo un ultimo tentativo
       best-effort, ma non permettiamo più a rete/Taccuino/strutture condivise di
       intrappolare l'utente in modifica. Dopo 4,5 s si procede comunque al logout. */
    var finalSave=Promise.all([serializedSaveLatest(),Promise.resolve(taccCloudPush(true)).catch(function(e){console.error(e);return false;})]).then(function(vals){
      return vals.every(function(v){return v!==false;});
    }).catch(function(e){console.error(e);return false;});
    var boundedSave=Promise.race([
      finalSave,
      new Promise(function(resolve){setTimeout(function(){resolve(false);},4500);})
    ]);
    return boundedSave.then(function(saveOk){
      return Promise.resolve(window.fbEndEditSession?window.fbEndEditSession():true).catch(function(e){console.error(e);return false;}).then(function(){
        clearPasswordSessionNotice(STUDENTE.nome);
        EDIT_UNLOCKED=false;

        fbStatusText=saveOk?"Sola visualizzazione":"Sola visualizzazione · ultimo salvataggio cloud non confermato";
        renderAll();
        return true;
      });
    }).catch(function(e){
      console.error(e);
      /* Anche un errore inatteso del salvataggio non deve lasciare attiva la UI di modifica. */
      return Promise.resolve(window.fbEndEditSession?window.fbEndEditSession():true).catch(function(_e){console.error(_e);}).then(function(){
        clearPasswordSessionNotice(STUDENTE.nome);EDIT_UNLOCKED=false;EDIT_DISCONNECT_PENDING=false;fbStatusText="Sola visualizzazione · ultimo salvataggio cloud non confermato";renderAll();return true;
      });
    });
  }

          if(ev){ev.preventDefault();ev.stopPropagation();if(ev.stopImmediatePropagation){ev.stopImmediatePropagation();}}
          requestGeneralPostRemoval(mese.id,post.id,post.globalNo,idx);
        }
        var removePointerEvent=(typeof window.PointerEvent!=="undefined")?"pointerdown":"mousedown";
        rmBtn.addEventListener(removePointerEvent,activateGeneralPostRemoval);
        /* Il click generato dal mouse è già gestito su pointerdown. detail===0 copre
           attivazione da tastiera/tecnologie assistive senza eseguire due volte. */
        rmBtn.addEventListener("click",function(ev){
          if(ev&&ev.detail===0){activateGeneralPostRemoval(ev);return;}
          if(ev){ev.preventDefault();ev.stopPropagation();}
        });
        rmBtn.addEventListener("keydown",function(ev){
          if(ev&&(ev.key==="Enter"||ev.key===" ")){activateGeneralPostRemoval(ev);}

        tdRm.appendChild(rmBtn);
        tr.appendChild(tdRm);
        tbl.appendChild(tr);
      })(mese.posts[i], i);
    }

    var addBtn = el("button", "action small", "+ Aggiungi post");
    /* Non rendere il pulsante morto soltanto mentre Firebase sta verificando gli accrediti:
       al click facciamo una verifica esplicita e poi procediamo. */
    addBtn.disabled = locked || accreditato || isImportedStudentMonth(mese);
    function addPostAfterChecks(){
      if(blockIfMonthReadOnly(mese)){return;}
      /* La riga vuota è una BOZZA UI: non avanza postCounter e non tocca Firebase.
         Diventa un vero Post soltanto quando l'utente inizia a compilarla. In questo
         modo il semplice click su «Aggiungi post» non può generare conflitti. */
      mese.posts.push({ id:"draft_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7), globalNo:null, link: "", nota: "", pp: "", eventoBonusEscluso:false, bonusUtilizzi:{}, staffTokenUsato:false, staffTokenStaffId:"", staffTokenStaffName:"", staffTokenUsedAt:"" });

    addBtn.addEventListener(EV, function(){
      if(fbConnected && !accreditiVerified()){

        refreshNarratorSocial(function(ok){

          if(!ok){alert("Non riesco ancora a verificare gli accrediti su Firebase. Riprova tra qualche secondo.");return;}
          addPostAfterChecks();
        });
        return;
      }
      addPostAfterChecks();
    });
    var postActions=el("div","month-post-actions");

    return card;

  function valoreG(pos){
    var scale = [30,20,15,10,8,6,4,3,2,2];
    if(pos <= 10){ return scale[pos-1]; }
    return 1;
  }
  function cumulativeG(pos){ var tot=0; for(var i=1;i<=pos;i++){ tot=tot+valoreG(i); } return tot; }
  function valorePP(post){ var v = parseInt(post && post.pp != null ? post.pp : 0, 10); if(isNaN(v) || v < 0){ return 0; } return v; }
  function meseBonusPP(mese){ var v=parseInt(mese && mese.eventoBonusPP != null ? mese.eventoBonusPP : 0,10); if(isNaN(v)||v<0){return 0;} return v; }
  function meseBonusGaleoni(mese){ var v=parseInt(mese && mese.eventoBonusGaleoni != null ? mese.eventoBonusGaleoni : 0,10); if(isNaN(v)||v<0){return 0;} return v; }
  function meseBonusAltro(mese){ return String(mese && mese.eventoBonusAltro != null ? mese.eventoBonusAltro : "").trim(); }
  function newBonusId(){ return "b_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8); }

  function normalizeBonusMode(v){return ["all","posts","first","manual"].indexOf(v)>=0?v:"all";}
  function normalizeBonusValueMode(v){return ["fixed","variable"].indexOf(v)>=0?v:"fixed";}
  function normalizeVariableTarget(v){return ["pp","galeoni","altro"].indexOf(v)>=0?v:"pp";}

  function ensureBonusExtras(mese){
    if(!mese){return [];}
    if(!Array.isArray(mese.bonusAggiuntivi)){mese.bonusAggiuntivi=[];}
    for(var i=0;i<mese.bonusAggiuntivi.length;i++){
      var b=mese.bonusAggiuntivi[i]||{};
      if(!b.id){b.id=newBonusId();}
      b.descrizione=String(b.descrizione||"");
      b.pp=Math.max(0,parseInt(b.pp,10)||0);
      b.galeoni=Math.max(0,parseInt(b.galeoni,10)||0);
      b.altro=String(b.altro||"");
      b.modalita=normalizeBonusMode(b.modalita);
      b.primiPost=Math.max(0,parseInt(b.primiPost,10)||0);
      b.valore=normalizeBonusValueMode(b.valore);
      b.maxUtilizzi=Math.max(0,parseInt(b.maxUtilizzi,10)||0);
      b.usatiIniziali=Math.max(0,parseInt(b.usatiIniziali,10)||0);
      b.usatiConfermati=b.usatiConfermati===true;
      if(b.maxUtilizzi>0){b.usatiIniziali=Math.min(b.usatiIniziali,b.maxUtilizzi);}
      b.variabileSu=normalizeVariableTarget(b.variabileSu);
      b.utilizziManuali=Math.max(0,parseInt(b.utilizziManuali,10)||0);
      if(b.maxUtilizzi>0){b.utilizziManuali=Math.min(b.utilizziManuali,Math.max(0,b.maxUtilizzi-b.usatiIniziali));}
      mese.bonusAggiuntivi[i]=b;
    }
    return mese.bonusAggiuntivi;
  }

  function primaryBonusItem(mese){
    return {
      id:"__primary__", primary:true,
      descrizione:String(mese&&mese.eventoBonusDescrizione||""),
      pp:meseBonusPP(mese),
      galeoni:meseBonusGaleoni(mese),
      altro:meseBonusAltro(mese),
      modalita:normalizeBonusMode(mese&&mese.eventoBonusModalita),
      primiPost:Math.max(0,parseInt(mese&&mese.eventoBonusPrimiPost,10)||0),
      valore:normalizeBonusValueMode(mese&&mese.eventoBonusValore),
      maxUtilizzi:Math.max(0,parseInt(mese&&mese.eventoBonusMaxUtilizzi,10)||0),
      usatiIniziali:Math.max(0,parseInt(mese&&mese.eventoBonusUsatiIniziali,10)||0),
      usatiConfermati:mese&&mese.eventoBonusUsatiConfermati===true,
      variabileSu:normalizeVariableTarget(mese&&mese.eventoBonusVariabileSu),
      utilizziManuali:Math.max(0,parseInt(mese&&mese.eventoBonusUtilizziManuali,10)||0)
    };
  }
  function allMonthBonuses(mese){
    var out=[primaryBonusItem(mese)],extras=ensureBonusExtras(mese);
    for(var i=0;i<extras.length;i++){
      var b=extras[i];
      out.push({
        id:String(b.id),primary:false,
        descrizione:String(b.descrizione||""),
        pp:Math.max(0,parseInt(b.pp,10)||0),
        galeoni:Math.max(0,parseInt(b.galeoni,10)||0),
        altro:String(b.altro||"").trim(),
        modalita:normalizeBonusMode(b.modalita),
        primiPost:Math.max(0,parseInt(b.primiPost,10)||0),
        valore:normalizeBonusValueMode(b.valore),
        maxUtilizzi:Math.max(0,parseInt(b.maxUtilizzi,10)||0),
        usatiIniziali:Math.max(0,parseInt(b.usatiIniziali,10)||0),
        usatiConfermati:b.usatiConfermati===true,
        variabileSu:normalizeVariableTarget(b.variabileSu),
        utilizziManuali:Math.max(0,parseInt(b.utilizziManuali,10)||0)
      });
    }
    return out;
  }
  function bonusIsActive(b){
    return !!(b && (
      String(b.descrizione||"").trim()!=="" ||
      b.pp>0 || b.galeoni>0 || String(b.altro||"").trim()!=="" ||
      b.modalita!=="all" || b.primiPost>0 || b.maxUtilizzi>0
    ));
  }
  function activeMonthBonuses(mese){
    var all=allMonthBonuses(mese),out=[];
    for(var i=0;i<all.length;i++){if(bonusIsActive(all[i]))out.push(all[i]);}
    return out;
  }
  function bonusDisplayName(b,idx){
    var d=String(b&&b.descrizione||"").trim();
    return d||("Bonus "+(idx+1));
  }

  function primaryBonusFieldName(field){
    return {
      descrizione:"eventoBonusDescrizione",pp:"eventoBonusPP",galeoni:"eventoBonusGaleoni",altro:"eventoBonusAltro",
      modalita:"eventoBonusModalita",primiPost:"eventoBonusPrimiPost",valore:"eventoBonusValore",maxUtilizzi:"eventoBonusMaxUtilizzi",
      usatiIniziali:"eventoBonusUsatiIniziali",usatiConfermati:"eventoBonusUsatiConfermati",variabileSu:"eventoBonusVariabileSu",utilizziManuali:"eventoBonusUtilizziManuali"
    }[field];
  }
  function getEditableBonusField(mese,bonus,isPrimary,field){
    if(isPrimary){var k=primaryBonusFieldName(field);return mese[k];}
    return bonus[field];
  }
  function setEditableBonusField(mese,bonus,isPrimary,field,value){
    if(isPrimary){mese[primaryBonusFieldName(field)]=value;}else{bonus[field]=value;}
  }

  function postExcludedFromBonus(post,b){
    if(!post||!b){return false;}
    if(b.primary){return !!post.eventoBonusEscluso;}
    return !!(post.bonusEsclusi&&post.bonusEsclusi[b.id]);
  }
  function setPostExcludedFromBonus(post,b,value){
    if(!post||!b){return;}
    if(b.primary){post.eventoBonusEscluso=!!value;return;}
    if(!post.bonusEsclusi||typeof post.bonusEsclusi!=="object"){post.bonusEsclusi={};}
    if(value){post.bonusEsclusi[b.id]=true;}else{delete post.bonusEsclusi[b.id];}
  }
  function getBonusUsageRecord(post,b,create){
    if(!post||!b){return null;}
    if(!post.bonusUtilizzi||typeof post.bonusUtilizzi!=="object"||Array.isArray(post.bonusUtilizzi)){
      if(!create){return null;}
      post.bonusUtilizzi={};
    }
    var id=String(b.id);
    var r=post.bonusUtilizzi[id];
    if(!r&&create){r={used:false,pp:0,galeoni:0,altro:"",link:""};post.bonusUtilizzi[id]=r;}
    if(r){
      r.used=!!r.used;
      r.pp=Math.max(0,parseInt(r.pp,10)||0);
      r.galeoni=Math.max(0,parseInt(r.galeoni,10)||0);
      r.altro=String(r.altro||"");
      r.link=String(r.link||"");
    }
    return r||null;
  }
  function postUsesLimitedBonus(post,b){
    var r=getBonusUsageRecord(post,b,false);
    return !!(r&&r.used&&isValidPostLink(post&&post.link));
  }
  function bonusPostsUsedThisMonth(b,posts,endExclusive){
    var c=0,limit=Math.min(posts.length,endExclusive==null?posts.length:endExclusive);
    if(b.modalita!=="posts"){return 0;}
    for(var i=0;i<limit;i++){if(postUsesLimitedBonus(posts[i],b))c++;}
    return c;
  }
  function bonusUsedPostRefs(b,posts){
    var out=[],localNo=0;
    if(!b||b.modalita!=="posts"){return out;}
    posts=Array.isArray(posts)?posts:[];
    for(var i=0;i<posts.length;i++){
      var post=posts[i];
      if(!post||!isValidPostLink(post.link)){continue;}
      localNo++;
      if(!postUsesLimitedBonus(post,b)){continue;}
      var globalNo=parseInt(post.globalNo,10);
      var label="Post "+localNo;
      if(!isNaN(globalNo)&&globalNo>0){label+=" (N. globale "+globalNo+")";}
      out.push(label);
    }
    return out;
  }
  function bonusUsedThisMonth(b,posts){
    if(b.modalita==="posts"){return bonusPostsUsedThisMonth(b,posts,posts.length);}
    if(b.modalita==="manual"){return Math.max(0,parseInt(b.utilizziManuali,10)||0);}
    return 0;
  }
  function bonusCurrentUses(b,posts){return Math.max(0,parseInt(b.usatiIniziali,10)||0)+bonusUsedThisMonth(b,posts);}
  function bonusRemainingUses(b,posts){
    if(!(b.maxUtilizzi>0)){return Infinity;}
    return Math.max(0,b.maxUtilizzi-bonusCurrentUses(b,posts));
  }
  function bonusUsageClass(b,posts){
    if(!(b.maxUtilizzi>0)){return "neutral";}
    var current=bonusCurrentUses(b,posts),monthUsed=bonusUsedThisMonth(b,posts);
    if(current>=b.maxUtilizzi){return "exhausted";}
    if(monthUsed>0){return "update";}
    return "neutral";
  }
  function bonusUsageStatusText(b,posts){
    if(!(b.maxUtilizzi>0)){return "";}
    var start=Math.max(0,parseInt(b.usatiIniziali,10)||0),monthUsed=bonusUsedThisMonth(b,posts),current=start+monthUsed;
    if(current>=b.maxUtilizzi){return current+"/"+b.maxUtilizzi+" — ESAURITO: rimuovere dal Bagaglio in Scheda PG.";}
    if(monthUsed>0){return current+"/"+b.maxUtilizzi+" — aggiornare nel Bagaglio in Scheda PG (da "+start+"/"+b.maxUtilizzi+" a "+current+"/"+b.maxUtilizzi+").";}
    return current+"/"+b.maxUtilizzi+" utilizzi.";
  }
  function bonusBagWarnings(mese,posts){
    var bonuses=activeMonthBonuses(mese),out=[];
    for(var i=0;i<bonuses.length;i++){
      var b=bonuses[i];
      if((b.modalita!=="posts"&&b.modalita!=="manual")||!(b.maxUtilizzi>0)){continue;}
      var used=bonusUsedThisMonth(b,posts);
      if(used<=0){continue;}
      var current=bonusCurrentUses(b,posts);
      if(current>=b.maxUtilizzi){
        out.push({kind:"remove",text:bonusDisplayName(b,i)+": "+current+"/"+b.maxUtilizzi+" — RIMUOVERE DAL BAGAGLIO IN SCHEDA PG."});
      }else{
        out.push({kind:"update",text:bonusDisplayName(b,i)+": aggiornare gli utilizzi nel Bagaglio da "+b.usatiIniziali+"/"+b.maxUtilizzi+" a "+current+"/"+b.maxUtilizzi+"."});
      }
    }
    return out;
  }

  function postEligibleForBonus(post,b,posts){
    if(!post||!isValidPostLink(post.link)){return false;}
    if(b.modalita==="all"){return true;}
    if(b.modalita==="posts"){return postUsesLimitedBonus(post,b);}
    if(b.modalita==="first"){
      var max=Math.max(0,parseInt(b.primiPost,10)||0);if(max<=0){return false;}
      posts=Array.isArray(posts)?posts:[];var seen=0;
      for(var i=0;i<posts.length;i++){if(!posts[i]||!isValidPostLink(posts[i].link)){continue;}seen++;if(posts[i]===post){return seen<=max;}}
      return false;
    }
    return false;
  }
  function bonusEligibleCount(b,posts,endExclusive){
    if(b.modalita==="manual"){return Math.max(0,parseInt(b.utilizziManuali,10)||0);}
    var count=0,limit=Math.min(endExclusive,posts.length);
    for(var i=0;i<limit;i++){if(postEligibleForBonus(posts[i],b,posts))count++;}
    return count;
  }
  function bonusPPOnPost(b,post){
    if(!postEligibleForBonus(post,b,window.__ELFO_CURRENT_BONUS_POSTS||[])){return 0;}
    if(b.modalita==="posts"&&b.valore==="variable"){
      var r=getBonusUsageRecord(post,b,false);
      return b.variabileSu==="pp"&&r?Math.max(0,parseInt(r.pp,10)||0):0;
    }
    return Math.max(0,parseInt(b.pp,10)||0);
  }
  function bonusGOnPost(b,post){
    if(!postEligibleForBonus(post,b,window.__ELFO_CURRENT_BONUS_POSTS||[])){return 0;}
    if(b.modalita==="posts"&&b.valore==="variable"){
      var r=getBonusUsageRecord(post,b,false);
      return b.variabileSu==="galeoni"&&r?Math.max(0,parseInt(r.galeoni,10)||0):0;
    }
    return Math.max(0,parseInt(b.galeoni,10)||0);
  }
  function bonusAltroOnPost(b,post){
    if(!postEligibleForBonus(post,b,window.__ELFO_CURRENT_BONUS_POSTS||[])){return "";}
    if(b.modalita==="posts"&&b.valore==="variable"){
      var r=getBonusUsageRecord(post,b,false);
      return b.variabileSu==="altro"&&r?String(r.altro||"").trim():"";
    }
    return String(b.altro||"").trim();
  }
  function bonusManualPPTotal(b){return b.modalita==="manual"?Math.max(0,parseInt(b.utilizziManuali,10)||0)*Math.max(0,parseInt(b.pp,10)||0):0;}
  function bonusManualGTotal(b){return b.modalita==="manual"?Math.max(0,parseInt(b.utilizziManuali,10)||0)*Math.max(0,parseInt(b.galeoni,10)||0):0;}

  function cumulativeBasePP(posts,endExclusive){
    /* post.pp è un residuo delle vecchie versioni della Camera Blindata.
       Non deve più essere sommato: i PP sono gestiti dai Bonus generici. */
    return 0;
  }
  function eventBonusTotal(mese,posts,endExclusive){
    window.__ELFO_CURRENT_BONUS_POSTS=posts;
    var bonuses=activeMonthBonuses(mese),tot=0,limit=Math.min(endExclusive,posts.length);
    for(var b=0;b<bonuses.length;b++){
      for(var i=0;i<limit;i++)tot+=bonusPPOnPost(bonuses[b],posts[i]);
      if(endExclusive>=posts.length)tot+=bonusManualPPTotal(bonuses[b]);
    }
    tot+=staffTokenCountForPosts(posts,endExclusive,mese);
    return tot;
  }
  function eventBonusGaleoniTotal(mese,posts,endExclusive){
    window.__ELFO_CURRENT_BONUS_POSTS=posts;
    var bonuses=activeMonthBonuses(mese),tot=0,limit=Math.min(endExclusive,posts.length);
    for(var b=0;b<bonuses.length;b++){
      for(var i=0;i<limit;i++)tot+=bonusGOnPost(bonuses[b],posts[i]);
      if(endExclusive>=posts.length)tot+=bonusManualGTotal(bonuses[b]);
    }
    return tot;
  }
  function bonusPPForPost(mese,post){
    window.__ELFO_CURRENT_BONUS_POSTS=Array.isArray(mese&&mese.posts)?mese.posts:[];
    var bonuses=activeMonthBonuses(mese),tot=0;
    for(var i=0;i<bonuses.length;i++)tot+=bonusPPOnPost(bonuses[i],post);
    if(staffTokenIsUsed(post,mese)&&isValidPostLink(post&&post.link))tot+=1;
    return tot;
  }
  function bonusGForPost(mese,post){
    window.__ELFO_CURRENT_BONUS_POSTS=Array.isArray(mese&&mese.posts)?mese.posts:[];
    var bonuses=activeMonthBonuses(mese),tot=0;
    for(var i=0;i<bonuses.length;i++)tot+=bonusGOnPost(bonuses[i],post);
    return tot;
  }
  function bonusAltroForPost(mese,post){
    window.__ELFO_CURRENT_BONUS_POSTS=Array.isArray(mese&&mese.posts)?mese.posts:[];
    var bonuses=activeMonthBonuses(mese),out=[];
    for(var i=0;i<bonuses.length;i++){var a=bonusAltroOnPost(bonuses[i],post);if(a)out.push(a);}
    return out.join(", ");
  }
  function postBonusTotals(mese,post){
    return {
      pp:bonusPPForPost(mese,post),
      galeoni:bonusGForPost(mese,post),
      altro:bonusAltroForPost(mese,post)
    };
  }
  function appendMoneyParts(cell,parts,altro){
    var shown=false;
    if(parts.galeoni>0){cell.appendChild(el("span","cb-total-line","+"+parts.galeoni+" G"));shown=true;}
    if(parts.pp>0){cell.appendChild(el("span","cb-total-line","+"+parts.pp+" PP"));shown=true;}
    if(altro){cell.appendChild(el("span","cb-total-altro","Altro: "+altro));shown=true;}
    if(!shown){cell.appendChild(el("span","cb-bonus-none","—"));}

  function cumulativePP(posts,endExclusive,mese){return cumulativeBasePP(posts,endExclusive)+eventBonusTotal(mese,posts,endExclusive);}
  function cumulativeGWithEvent(posts,endExclusive,mese){
    var linked=0;for(var i=0;i<endExclusive;i++){if(posts[i]&&isValidPostLink(posts[i].link))linked++;}
    return cumulativeG(linked)+eventBonusGaleoniTotal(mese,posts,endExclusive);
  }
  function latestCreditInfo(mese,posts){
    posts=Array.isArray(posts)?posts:[];
    var idx=-1,linkedPos=0;
    for(var i=0;i<posts.length;i++){if(posts[i]&&isValidPostLink(posts[i].link)){linkedPos++;idx=i;}}
    if(idx<0){return null;}
    var post=posts[idx];
    return {
      index:idx,localNo:linkedPos,linkedPos:linkedPos,
      globalNo:parseInt(post.globalNo,10)>0?parseInt(post.globalNo,10):null,
      galeoni:valoreG(linkedPos)+bonusGForPost(mese,post),
      pp:bonusPPForPost(mese,post),
      altro:bonusAltroForPost(mese,post)
    };

  function manualCreditParts(mese){
    var bonuses=activeMonthBonuses(mese),pp=0,g=0,altro=[];
    for(var i=0;i<bonuses.length;i++){
      var b=bonuses[i];if(b.modalita!=="manual"||!(b.utilizziManuali>0))continue;
      pp+=bonusManualPPTotal(b);g+=bonusManualGTotal(b);
      if(b.altro)altro.push(bonusDisplayName(b,i)+": "+b.altro);
    }
    return {pp:pp,galeoni:g,altro:altro};
  }
  function monthlyBonusAltroParts(mese,posts){
    posts=Array.isArray(posts)?posts:[];
    window.__ELFO_CURRENT_BONUS_POSTS=posts;
    var bonuses=activeMonthBonuses(mese),out=[];
    for(var i=0;i<bonuses.length;i++){
      var b=bonuses[i];
      if(b.modalita==="manual"){continue;}
      var counts={},order=[];
      for(var p=0;p<posts.length;p++){
        var value=String(bonusAltroOnPost(b,posts[p])||"").trim();
        if(!value){continue;}
        if(!Object.prototype.hasOwnProperty.call(counts,value)){counts[value]=0;order.push(value);}
        counts[value]++;
      }
      for(var v=0;v<order.length;v++){
        var label=order[v],count=counts[label];
        out.push(bonusDisplayName(b,i)+": "+label+(count>1?" ×"+count:""));
      }
    }
    return out;
  }

  function monthlySocialDecay(postCount){
    var n=Math.max(0,parseInt(postCount,10)||0);
    return n<=3?-1:(n<=9?-.5:0);
  }
  function currentSocialLossParts(postCount){
    if(!EDIT_UNLOCKED){return [];}
    var decay=monthlySocialDecay(postCount),parts=[];
    if(decay>=0){return parts;}
    var defs=socialFieldDefs(),values=normalizeSocialValues(PARAMETRI_SOCIALI);
    for(var i=0;i<defs.length;i++){
      var d=defs[i],before=socialNumber(values[d.key]);
      if(before===null)continue;
      var after=before+decay;
      if(Number.isFinite(d.min))after=Math.max(d.min,after);
      if(Number.isFinite(d.max))after=Math.min(d.max,after);
      after=Math.round(after*100)/100;
      var delta=Math.round((after-before)*100)/100;
      if(delta<0)parts.push("−"+fmtSocialValue(Math.abs(delta))+" "+d.label);
    }
    return parts;
  }

  function bonusValueText(b,post){
    var parts=[];
    if(b.modalita==="posts"&&b.valore==="variable"){
      var r=getBonusUsageRecord(post,b,false);
      if(!r||!r.used)return "";
      if(b.variabileSu==="pp"&&r.pp>0)parts.push("+"+r.pp+" PP");
      if(b.variabileSu==="galeoni"&&r.galeoni>0)parts.push("+"+r.galeoni+" G");
      if(b.variabileSu==="altro"&&String(r.altro||"").trim())parts.push(String(r.altro).trim());
      return parts.join(" · ");
    }
    if(b.pp>0)parts.push("+"+b.pp+" PP");
    if(b.galeoni>0)parts.push("+"+b.galeoni+" G");
    if(String(b.altro||"").trim())parts.push(String(b.altro).trim());
    return parts.join(" · ");
  }

          if(!confirm("Azzerare tutti i Bonus di questo Mese?"))return;

          meseObj.eventoBonusDescrizione="";
          meseObj.eventoBonusPP=0;
          meseObj.eventoBonusGaleoni=0;
          meseObj.eventoBonusAltro="";
          meseObj.eventoBonusModalita="all";
          meseObj.eventoBonusPrimiPost=0;
          meseObj.eventoBonusValore="fixed";
          meseObj.eventoBonusMaxUtilizzi=0;
          meseObj.eventoBonusUsatiIniziali=0;
          meseObj.eventoBonusUsatiConfermati=false;
          meseObj.eventoBonusVariabileSu="pp";
          meseObj.eventoBonusUtilizziManuali=0;
          meseObj.bonusAggiuntivi=[];

          for(var cbi=0;cbi<meseObj.posts.length;cbi++){
            meseObj.posts[cbi].eventoBonusEscluso=false;
            meseObj.posts[cbi].bonusEsclusi={};
            meseObj.posts[cbi].bonusUtilizzi={};
          }
          scheduleSave(0);renderAll();
        });
        bonusActions.appendChild(clearBonus);
      }
      bonusBox.appendChild(bonusActions);
    }
    if(bonusLocked){
      var bonusLockMsg=monthIsAccredited(meseObj)?"Il Mese è già accreditato: i Bonus sono congelati finché il Narratore non revoca l'accredito.":"Il Mese è in un archivio consolidato: il Bonus non è più modificabile.";
      bonusBox.appendChild(el("p","small-note",bonusLockMsg));
    }
    p.appendChild(bonusBox);

    var postiDelMese = meseObj.posts;
    var totFilled = 0;
    for(var j=0;j<postiDelMese.length;j++){ if(isValidPostLink(postiDelMese[j].link)){ totFilled = totFilled + 1; } }
    var totGBase = totFilled > 0 ? cumulativeG(totFilled) : 0;
    var totGEvento = eventBonusGaleoniTotal(meseObj, postiDelMese, postiDelMese.length);
    var totG = totGBase + totGEvento;
    var totPPBase = cumulativeBasePP(postiDelMese, postiDelMese.length);
    var totPPEvento = eventBonusTotal(meseObj, postiDelMese, postiDelMese.length);
    var totPP = totPPBase + totPPEvento;
    var latestCredit = latestCreditInfo(meseObj, postiDelMese);

    var manualCredit=manualCreditParts(meseObj);
    if((latestCredit||manualCredit.pp>0||manualCredit.galeoni>0||manualCredit.altro.length) && !monthIsAccredited(meseObj)){
      var creditParts=[];
      var creditLabel="";
      if(latestCredit){
        creditLabel="Post "+latestCredit.localNo;
      }else{
        creditLabel="Bonus del mese";
      }

      /* Il riquadro rosso mostra sempre il TOTALE effettivo del mese,
         non il valore del solo ultimo post. Viene ricostruito ad ogni renderAll(). */
      creditParts.push("+"+totG+" G");
      creditParts.push("+"+totPP+" PP");

      var allMonthAltro=monthlyBonusAltroParts(meseObj,postiDelMese);
      if(manualCredit.altro.length){allMonthAltro=allMonthAltro.concat(manualCredit.altro);}
      if(allMonthAltro.length){creditParts.push("Altro: "+allMonthAltro.join(", "));}

      var socialLosses=currentSocialLossParts(totFilled);
      if(socialLosses.length)creditParts.push("Parametri Sociali: "+socialLosses.join(", "));

      p.appendChild(el("div","cb-credit-alert","<b>DA ACCREDITARE — "+creditLabel+": </b><span class=\"cb-credit-values\">"+creditParts.join(" · ")+"</span>"));
    }
    var bagWarnings=bonusBagWarnings(meseObj,postiDelMese);
    for(var bwi=0;bwi<bagWarnings.length;bwi++){
      p.appendChild(el("div",bagWarnings[bwi].kind==="remove"?"bag-remove-warning":"bag-update-warning",bagWarnings[bwi].text));
    }

    var staffTokenHistorical=staffTokenMonthHasHistory(postiDelMese,meseObj);
    var totals = el("div", "totals");
    totals.appendChild(el("div", "box", "Totale Post<br><b>" + totFilled + "</b>"));
    totals.appendChild(el("div", "box", "Totale Galeoni<br><b>" + totG + " G</b>"));
    totals.appendChild(el("div", "box", "Totale PP<br><b>" + totPP + " PP</b>"));
    if(STAFF_TOKEN_STATE.associated||staffTokenHistorical){totals.appendChild(el("div","box","Staff Token usati<br><b>"+staffTokenCountForPosts(postiDelMese,postiDelMese.length,meseObj)+"</b>"));}
    p.appendChild(totals);
    var bonusItems=activeMonthBonuses(meseObj);
    for(var bsi=0;bsi<bonusItems.length;bsi++){
      var bi=bonusItems[bsi],parts=[],modeText="";
      if(bi.modalita==="all"){
        if(bi.pp>0)parts.push("+"+bi.pp+" PP per post");
        if(bi.galeoni>0)parts.push("+"+bi.galeoni+" G per post");
        if(bi.altro)parts.push("Altro: "+bi.altro);
        modeText="Post ammessi: "+bonusEligibleCount(bi,postiDelMese,postiDelMese.length)+" su "+totFilled;
      }else if(bi.modalita==="first"){
        if(bi.pp>0)parts.push("+"+bi.pp+" PP per post");
        if(bi.galeoni>0)parts.push("+"+bi.galeoni+" G per post");
        if(bi.altro)parts.push("Altro: "+bi.altro);
        modeText="Solo primi "+Math.max(0,parseInt(bi.primiPost,10)||0)+" post · applicati a "+bonusEligibleCount(bi,postiDelMese,postiDelMese.length)+" post validi";
      }else if(bi.modalita==="posts"){
        if(bi.valore==="variable"){
          parts.push("valore variabile in "+(bi.variabileSu==="pp"?"PP":(bi.variabileSu==="galeoni"?"Galeoni":"Altro"))+" per utilizzo");
          var vpp=0,vg=0;
          for(var _vi=0;_vi<postiDelMese.length;_vi++){vpp+=bonusPPOnPost(bi,postiDelMese[_vi]);vg+=bonusGOnPost(bi,postiDelMese[_vi]);}
          if(vpp>0)parts.push("+"+vpp+" PP nel mese");
          if(vg>0)parts.push("+"+vg+" G nel mese");
        }else{
          if(bi.pp>0)parts.push("+"+bi.pp+" PP per utilizzo");
          if(bi.galeoni>0)parts.push("+"+bi.galeoni+" G per utilizzo");
          if(bi.altro)parts.push("Altro: "+bi.altro);
        }
        var usedRefs=bonusUsedPostRefs(bi,postiDelMese);
        modeText="Utilizzi: "+bonusCurrentUses(bi,postiDelMese)+(bi.maxUtilizzi>0?"/"+bi.maxUtilizzi:"");
        if(usedRefs.length){modeText+=" · "+usedRefs.join(", ");}
      }else{
        if(bi.pp>0)parts.push("+"+bi.pp+" PP per utilizzo");
        if(bi.galeoni>0)parts.push("+"+bi.galeoni+" G per utilizzo");
        if(bi.altro)parts.push("Altro: "+bi.altro);
        modeText="Utilizzi manuali: "+bonusCurrentUses(bi,postiDelMese)+(bi.maxUtilizzi>0?"/"+bi.maxUtilizzi:"");
      }
      if(!parts.length)parts.push("nessun valore economico");
      p.appendChild(el("div","guide-text","<b>"+bonusDisplayName(bi,bsi)+":</b> "+parts.join(" · ")+" · <b>"+modeText+"</b>"));
    }

    var tblLive = el("table", "posts");
    staffTokenHistorical=staffTokenMonthHasHistory(postiDelMese,meseObj);
    var staffTokenColumn=STAFF_TOKEN_STATE.associated||staffTokenHistorical;
    var staffTokenHead=staffTokenColumn?"<th>ST</th>":"";
    tblLive.appendChild(el("tr", null, "<th>N.</th><th>Link</th><th>Galeoni accumulati</th><th>N. globale</th><th>Bonus</th>"+staffTokenHead+"<th>Totale Bonus</th>"));

    var showUpToLive = postiDelMese.length;
    if(showUpToLive < 1){ showUpToLive = 0; }

    var localPostNo = 0;
    for(var li=0; li<showUpToLive; li++){
      let lp = postiDelMese[li];
      if(!lp || !isValidPostLink(lp.link)){continue;}
      localPostNo++;

      var tr = el("tr");
      var isLatestCreditRow = !!(latestCredit && li===latestCredit.index);
      if(isLatestCreditRow){tr.classList.add("cb-latest-row");}

      tr.appendChild(el("td",null,String(localPostNo)));
      tr.appendChild(makeLinkCell(lp.link, "Apri il post"));

      var linkedUpTo = 0;
      for(var gx=0; gx<=li; gx++){
        if(isValidPostLink(postiDelMese[gx].link)){ linkedUpTo++; }
      }
      tr.appendChild(el("td","g-value",(cumulativeG(linkedUpTo) + eventBonusGaleoniTotal(meseObj, postiDelMese, li + 1)) + " G"));

      var globalTd=el("td");
      var globalNo=parseInt(lp.globalNo,10);
      var monthTone=Math.max(0,MESI.indexOf(meseObj)) % 3;
      if(!isNaN(globalNo) && globalNo>0){
        globalTd.appendChild(el("span","global-post-number global-month-tone-"+monthTone,String(globalNo)));
      }else{
        globalTd.appendChild(el("span","cb-bonus-none","—"));
      }
      tr.appendChild(globalTd);

      tr.appendChild(makeEventBonusExclusionCell(lp,meseObj,bonusLocked));
      if(staffTokenColumn){
        tr.appendChild(STAFF_TOKEN_STATE.associated
          ? makeStaffTokenCell(lp,meseObj,bonusLocked)
          : makeStaffTokenHistoricalCell(lp,meseObj));
      }

      /* Totale Bonus del singolo post: somma tutti i bonus applicati
         (PP, Galeoni e Altro), inclusi eventuali vecchi PP manuali salvati. */
      var bonusTotals=postBonusTotals(meseObj,lp);
      var bonusTotalTd=el("td","cb-total-bonus");
      appendMoneyParts(bonusTotalTd,bonusTotals,bonusTotals.altro);
      tr.appendChild(bonusTotalTd);

      tblLive.appendChild(tr);
    }

    if(showUpToLive === 0 || totFilled===0){
      p.appendChild(el("p", "small-note", "Nessun post ancora in questo Mese: aggiungine allo Step precedente per vedere qui Galeoni, N. globale, Bonus e totali."));
    } else {
      p.appendChild(el("h4", null, "Progressivo del mese"));
      p.appendChild(tblLive);
    }

    container.appendChild(p);
  }

  function renderStruttureStep(container){
    var p = el("div", "panel");
    p.appendChild(el("h2", null, "Le tue Strutture"));
    p.appendChild(el("div", "guide-text", "Puoi avere tutte, alcune o nessuna di queste strutture oltre alla Camera Blindata: seleziona quelle che possiedi."));
    var opts = [
      { key:"postazione", label:"Ho una Postazione di Pozioni" },
      { key:"cubicolo", label:"Ho un Cubicolo (Serra n\u00b07)" },
      { key:"recinto", label:"Ho un Recinto (Cura delle Creature Magiche)" }
    ];
    for(var i=0;i<opts.length;i++){
      (function(o){
        var chk = el("div", "chk-line");
        var box = el("input"); box.type="checkbox"; box.checked = STRUTTURE[o.key];
        box.addEventListener("change", function(){ STRUTTURE[o.key] = box.checked; renderAll(); });
        chk.appendChild(box);
        chk.appendChild(el("span", null, o.label));
        p.appendChild(chk);
      })(opts[i]);
    }
    container.appendChild(p);
  }

  function decodeDispensaHtmlEntities(s){

  function parseDispensaBulkLine(raw){
    var line=String(raw||"").trim();
    if(!line){return null;}

    /* Intestazioni che possono essere copiate insieme agli Ingredienti. */
    if(/^RISULTATI\s+RACCOLTA\s*:?\s*$/i.test(line)){return null;}
    if(/^\*{0,2}\s*Ingredienti\s+(?:X|XX|XXX|XXXX|XXXXX)\s*\*{0,2}\s*:?\s*$/i.test(line)){return null;}

    /* Formati accettati:
       - X: Nome <i ...></i> (...)
       • Nome [1]
       Nome
       3 | Nome
       La Classificazione resta quella ufficiale del Glossario. */
    line=line.replace(/^\*{1,2}|\*{1,2}$/g,"").trim();
    line=line.replace(/^\s*[-•*]\s*/,"");
    line=line.replace(/^(?:X|XX|XXX|XXXX|XXXXX)\s*:\s*/i,"");

    var qty=1;

    /* Quantità all'inizio: 3 | Nome, 3 x Nome, ecc. */
    var qm=line.match(/^(\d+)\s*(?:\||x|×|-)\s*(.+)$/i);
    if(qm){
      qty=Math.max(1,parseInt(qm[1],10)||1);
      line=qm[2].trim();
    }

    /* Quantità alla fine, come negli elenchi:
       • Cuore di coccodrillo [1]
       • Cuore di coccodrillo [3] */
    var bracketQty=line.match(/^(.*?)\s*\[(\d+)\]\s*$/);
    if(bracketQty){
      line=bracketQty[1].trim();
      qty=Math.max(1,parseInt(bracketQty[2],10)||1);
    }

    /* Elimina le icone HTML copiate come codice e, se l'utente copia
       la versione visiva, anche i simboli equivalenti. */
    line=line.replace(/<i\b[^>]*>\s*<\/i>/gi," ");
    line=line.replace(/<[^>]+>/g," ");
    line=decodeDispensaHtmlEntities(line);
    line=line.replace(/[🚫⚗✔✅]/g," ");
    line=line.replace(/\(\s*\)/g," ");
    line=line.replace(/\s+/g," ").trim();

    if(!line){return null;}
    return {qty:qty,name:line};
  }

  function newSubEntry(){
    return {
      esitoLink:"", esitoText:"", postRichiesti:0, startIndex:nextGlobalPostNumber(),
      ottenuti:"", ottenutiLink:"", ottenutiQuantita:""
    };

  function normalizeSubEntry(sub){
    if(!sub || typeof sub!=="object"){ return newSubEntry(); }
    if(sub.esitoLink==null){sub.esitoLink="";}
    if(sub.esitoText==null){sub.esitoText="";}
    if(sub.postRichiesti==null){sub.postRichiesti=0;}
    if(sub.startIndex==null){sub.startIndex=nextGlobalPostNumber();}
    if(sub.ottenuti==null){sub.ottenuti="";}
    if(sub.ottenutiLink==null){sub.ottenutiLink="";}
    if(sub.ottenutiQuantita==null){sub.ottenutiQuantita="";}
    if(!sub.harvest||typeof sub.harvest!=="object"||Array.isArray(sub.harvest)){sub.harvest={};}
    return sub;
  }

  function subEntryProgress(sub){
    sub=normalizeSubEntry(sub);
    var total=Math.max(0,num(sub.postRichiesti,0));
    var filled=0;
    for(var i=0;i<total;i++){
      var post=getPostByGlobalNo(sub.startIndex+i);
      if(post && String(post.link||"").trim()!==""){filled++;}
    }
    return {filled:filled,total:total};
  }

  function newOccupant(stages){

  function cleanCreatureImportValue(value){
    var s=String(value==null?"":value).trim();
    if(!s){return "";}
    var noDashes=s.replace(/[\u2013\u2014-]/g,"").trim().toLowerCase();
    if(noDashes==="" || noDashes==="da compilare"){return "";}
    return s;
  }

  function creatureImportLabelKey(label){
    var s=String(label||"").toLowerCase().replace(/\s+/g," ").trim();
    if(s==="destinazione"){return "destinazione";}
    if(s==="nome"){return "nome";}
    if(/^data\s*\/\s*riferimento$/.test(s)){return "dataRiferimento";}
    if(s==="link principale"){return "linkPrincipale";}
    if(s==="classificazione"){return "classificazione";}
    if(s==="link classificazione"){return "classificazioneLink";}
    if(/^specie(?:\s*\/\s*sesso)?$/.test(s)){return "specieSesso";}
    if(s==="link specie"){return "specieLink";}
    if(s==="parenti" || /^parenti\s*\/\s*origine$/.test(s)){return "parenti";}
    if(s==="fase attuale"){return "faseAttuale";}
    if(s==="link fase"){return "faseLink";}
    if(s==="legalità" || s==="legalita"){return "legalita";}
    if(s==="professione controllo"){return "professioneControllo";}
    if(s==="protezioni controllo"){return "protezioniControllo";}
    if(s==="facce protezione"){return "facceProtezione";}
    if(s==="controllo illegale collocazione"){return "controlloIllegaleCollocazione";}
    if(s==="controllo illegale coltivazione"){return "controlloIllegaleColtivazione";}
    if(s==="controllo illegale cura"){return "controlloIllegaleCura";}
    if(s==="controllo illegale allevamento"){return "controlloIllegaleAllevamento";}
    if(s==="note"){return "note";}
    return "";
  }

  function parseCreatureImportText(raw){
    var text=String(raw||"").trim();
    var fields={}, count=0;
    if(!text){return {ok:false,error:"Il testo da importare è vuoto.",fields:fields};}
    var re=/(DESTINAZIONE|Data\s*\/\s*riferimento|Link\s+principale|Link\s+Classificazione|Specie(?:\s*\/\s*Sesso)?|Link\s+Specie|Fase\s+attuale|Link\s+Fase|Classificazione|Parenti(?:\s*\/\s*origine)?|Legalità|Legalita|Professione\s+controllo|Protezioni\s+controllo|Facce\s+protezione|Controllo\s+illegale\s+Collocazione|Controllo\s+illegale\s+Coltivazione|Controllo\s+illegale\s+Cura|Controllo\s+illegale\s+Allevamento|Nome|Note)\s*:\s*/gi;
    var matches=[], m;
    while((m=re.exec(text))!==null){matches.push({label:m[1],start:m.index,valueStart:re.lastIndex});}
    if(!matches.length){return {ok:false,error:"Formato non riconosciuto: non trovo le etichette Nome, Classificazione, Fase attuale, ecc.",fields:fields};}
    for(var i=0;i<matches.length;i++){
      var key=creatureImportLabelKey(matches[i].label);
      if(!key){continue;}
      var end=(i+1<matches.length)?matches[i+1].start:text.length;
      fields[key]=cleanCreatureImportValue(text.slice(matches[i].valueStart,end));
      count++;
    }
    return {ok:count>0,fields:fields,error:count>0?"":"Nessun campo riconosciuto."};
  }

  function splitCreatureImportBlocks(raw){
    var text=String(raw||"").trim();
    if(!text){return [];}
    var re=/DESTINAZIONE\s*:/gi, starts=[], m;
    while((m=re.exec(text))!==null){starts.push(m.index);}
    if(starts.length<=1){return [text];}
    var out=[];
    if(starts[0]>0 && text.slice(0,starts[0]).trim()){out.push(text.slice(0,starts[0]).trim());}
    for(var i=0;i<starts.length;i++){
      var end=(i+1<starts.length)?starts[i+1]:text.length;
      var block=text.slice(starts[i],end).trim();
      if(block){out.push(block);}
    }
    return out;
  }

  function appendCreatureImportNote(current, extra){
    var a=String(current||"").trim(), b=String(extra||"").trim();
    if(!b){return a;}
    return a ? (a+" · "+b) : b;
  }

  function creatureFromImportText(raw, stages, allowedClasses, expectedDestination){
    var parsed=parseCreatureImportText(raw);
    if(!parsed.ok){return {ok:false,error:parsed.error};}
    var f=parsed.fields||{};
    var dest=String(f.destinazione||"").toLowerCase();
    if(dest && expectedDestination && dest.indexOf(expectedDestination)<0){
      return {ok:false,error:"La DESTINAZIONE indicata («"+f.destinazione+"») non corrisponde a questo "+(expectedDestination==="recinto"?"Recinto":"Riserva")+"."};
    }

    var o=newOccupant(stages);
    o.nome=cleanCreatureImportValue(f.nome);
    o.dataLink=cleanCreatureImportValue(f.linkPrincipale);
    o.classificazioneLink=cleanCreatureImportValue(f.classificazioneLink);
    o.specieSesso=cleanCreatureImportValue(f.specieSesso);
    o.specieLink=cleanCreatureImportValue(f.specieLink);
    o.parenti=cleanCreatureImportValue(f.parenti) || "//";
    o.faseLink=cleanCreatureImportValue(f.faseLink);
    o.note=cleanCreatureImportValue(f.note);

    var cls=cleanCreatureImportValue(f.classificazione).toUpperCase().replace(/\s+/g,"");
    if(cls){
      if(allowedClasses.indexOf(cls)<0){return {ok:false,error:"Classificazione «"+cls+"» non ammessa in questa struttura."};}
      o.classificazione=cls;
    }

    var fase=cleanCreatureImportValue(f.faseAttuale);
    if(fase){
      var rawFase=fase.toLowerCase(), acceptedStage=false;
      var stageAliases={"infante":1,"adolescente":1,"adulta":1,"anziana":1,"cucciolo":1,"uovo":1};
      for(var si=0;si<stages.length;si++){
        if(String(stages[si].label||"").toLowerCase()===rawFase){acceptedStage=true;break;}
      }
      if(stageAliases[rawFase]){acceptedStage=true;}
      if(!acceptedStage){return {ok:false,error:"Fase attuale «"+fase+"» non riconosciuta."};}
      o.faseAttuale=canonicalStageLabel(stages,fase);
    }

    var dataRef=cleanCreatureImportValue(f.dataRiferimento);
    if(dataRef){
      var dm=dataRef.match(/\b(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{4}|\d{4}-\d{1,2}-\d{1,2}|\d{1,2}\s+(?:gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\s+\d{4})\b/i);
      if(dm){
        o.dataTesto=normalizeDateText(dm[1]);
        var resto=(dataRef.slice(0,dm.index)+" "+dataRef.slice(dm.index+dm[1].length)).replace(/^[\s\-\u2013\u2014|·:;,]+|[\s\-\u2013\u2014|·:;,]+$/g,"").trim();
        if(resto){o.note=appendCreatureImportNote(o.note,"Riferimento: "+resto);}
      }else{
        o.note=appendCreatureImportNote(o.note,"Riferimento: "+dataRef);
      }
    }

    var importKind=expectedDestination==="cubicolo"?"pianta":"creatura";o.legalita=/illegale/i.test(String(f.legalita||""))?"illegale":"legale";var ix=ensureEntityIllegalState(o);ix.professione=cleanCreatureImportValue(f.professioneControllo);ix.protezioni=cleanCreatureImportValue(f.protezioniControllo);ix.facceProtezione=Math.max(0,num(f.facceProtezione,0));ix.controlli.collocazione=cleanCreatureImportValue(f.controlloIllegaleCollocazione);ix.controlli.coltivazione=cleanCreatureImportValue(f.controlloIllegaleColtivazione);ix.controlli.cura=cleanCreatureImportValue(f.controlloIllegaleCura);ix.controlli.allevamento=cleanCreatureImportValue(f.controlloIllegaleAllevamento);
    ensureOccupantStageData(o,stages);
    return {ok:true,occupant:o,destination:f.destinazione||""};
  }

  function parseItalianDateOnly(value){
    var m=String(value||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m){return null;}
    var d=Number(m[1]),mo=Number(m[2])-1,y=Number(m[3]);
    var dt=new Date(y,mo,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==mo||dt.getDate()!==d){return null;}
    dt.setHours(0,0,0,0);
    return dt;
  }
  function addCalendarMonths(dt, months){
    var y=dt.getFullYear(),m=dt.getMonth()+Math.max(0,Number(months)||0),d=dt.getDate();
    var last=new Date(y,m+1,0).getDate();
    var out=new Date(y,m,Math.min(d,last));
    out.setHours(0,0,0,0);
    return out;
  }
  function formatItalianDateOnly(dt){

  function countCompletedCicli(occupant, stage){
    var cicliData = occupant.cicli[stage.key];
    if(stage.type === "cicli"){
      var c = 0;
      for(var i=0;i<cicliData.list.length;i++){ if(subEntryFilled(cicliData.list[i])){ c = c + 1; } }
      return { completed: c, total: cicliData.list.length };
    }
    if(stage.type === "ripro"){
      var c2 = 0;
      for(var j=0;j<cicliData.list.length;j++){ if(subEntryFilled(cicliData.list[j])){ c2 = c2 + 1; } }
      var reproDone = subEntryFilled(cicliData.evento) ? 1 : 0;
      return { completed: c2, total: cicliData.list.length, reproDone: reproDone };
    }
    return null;
  }
  function buildSubEntryLine(sub, eventoLabel, ottenutiLabel, options){
    options=options||{};
    sub=normalizeSubEntry(sub);
    var pr=subEntryProgress(sub);
    var out="<i>"+eventoLabel+"</i> = "+forumBbUrl(sub.esitoLink,(sub.esitoText!==""?sub.esitoText:"Esito dado"))+
      "; n° post "+pr.filled+"/"+pr.total+"\n";

    if(pr.total>0){
      out+="<ol>";
      for(var i=0;i<pr.total;i++){
        var post=getPostByGlobalNo(sub.startIndex+i);
        out+="<li>"+(post?forumBbUrl(post.link,"Post "+(i+1)):"Post "+(i+1))+"</li>";
      }
      out+="</ol>";
    }

    if(ottenutiLabel){
      var resultParts=[];
      if(options.isReproduction && String(sub.ottenutiQuantita||"").trim()!==""){
        resultParts.push(String(sub.ottenutiQuantita).trim());
      }
      if(String(sub.ottenuti||"").trim()!==""){resultParts.push(String(sub.ottenuti).trim());}
      var resultText=resultParts.join(" · ")||"//";
      var obtainedLink=forumBbUrlOptional(sub.ottenutiLink,"qui");
      if(obtainedLink){resultText=obtainedLink+" "+resultText;}
      out+="\n<u>"+ottenutiLabel+":</u> "+resultText;
    }
    return out;
  }


  function buildOccupantOutputLines(occupant, stages, config){
    var lines = [];

    lines.push("<b>\u2a2f Classificazione:</b> " + classTxt);
    var illegalLines=illegalOutputLines(occupant,config.tipoLabel==="Pianta"?"pianta":"creatura");for(var ili=0;ili<illegalLines.length;ili++){lines.push(illegalLines[ili]);}
    var specieTxt = forumBbUrl(occupant.specieLink, occupant.specieSesso);

    if(config.tipoLabel!=="Pianta"){ lines.push("<b>\u2a2f Parenti:</b> " + occupant.parenti); }

    for(var s=0;s<stages.length;s++){

      if(st.type === "gestazione" || st.type === "passaggio"){ continue; }

      if(st.type === "cicli"){ lines.push("- " + st.label + " " + res.completed + "/" + res.total + " Cicli di Produzione completati"); }

    for(var s2=0;s2<stages.length;s2++){
      var stage = stages[s2];
      var cicliData = occupant.cicli[stage.key];

      if(stage.type === "passaggio"){ lines.push(buildSubEntryLine(cicliData.evento, "Passaggio alla Germinazione", null, {isReproduction:false})); }
      if(stage.type === "gestazione"){ lines.push(buildSubEntryLine(cicliData.evento, "Gestazione / Schiusa", null, {isReproduction:true})); }
      if(stage.type === "cicli"){
        for(var i=0;i<cicliData.list.length;i++){ lines.push(buildSubEntryLine(cicliData.list[i], "Ciclo di Produzione " + (i+1), "Ingredienti ottenuti", {isReproduction:false})); lines.push(""); }
      }
      if(stage.type === "ripro"){
        lines.push(buildSubEntryLine(cicliData.evento, "Riproduzione", stage.ottenuti, {isReproduction:true})); lines.push("");

      recomputePosts();
      var duplicateGlobals=duplicateGlobalNumbers();
      if(duplicateGlobals.length){
        alert("Non posso generare il trasferimento: sono presenti numeri globali duplicati ("+duplicateGlobals.join(", ")+"). Chiedi al Narratore di verificarli prima di passare il PG al Tool Adulti, così non vengono trasferiti riferimenti ambigui.");
        return;
      }
      var activeRefs=collectActiveGlobalPostReferences(),missingPastRefs=[];
      Object.keys(activeRefs).forEach(function(k){var n=parseInt(k,10);if(n>0&&n<=globalPostCounter&&!getPostByGlobalNo(n)){missingPastRefs.push(n);}});
      missingPastRefs.sort(function(a,b){return a-b;});
      if(missingPastRefs.length){
        var shown=missingPastRefs.slice(0,12).join(", ")+(missingPastRefs.length>12?" …":"");
        alert("Non posso generare il trasferimento: alcune lavorazioni fanno ancora riferimento a Post globali non più disponibili ("+shown+"). Prima del passaggio ad Adulto, fai verificare questi riferimenti al Narratore.");
        return;
      }
      var payload = { transferVersion:2, sourcePg:STUDENTE.nome, mesi: MESI, globalPostCounter: globalPostCounter };
      if(opts.calderoni){ payload.calderoni = CALDERONI; payload.archivioCalderoni = ARCHIVIO_CALDERONI; }
      if(opts.piante){ payload.piante = PIANTE; payload.archivioPiante = ARCHIVIO_PIANTE; }
      if(opts.creature){ payload.creature = CREATURE; payload.archivioCreature = ARCHIVIO_CREATURE; payload.medicheria = MEDICHERIA; }
      if(opts.dispensa){ payload.dispensa = DISPENSA; }
      payload.transferId="stud-"+transferFingerprint(payload);
      var json = JSON.stringify(payload);
      outWrap.innerHTML = "";
      var copyBtn2 = el("button", "copy-btn", "Copia pacchetto");
      copyBtn2.addEventListener(EV, function(){
        var handledAsync = false;
        if(navigator.clipboard && navigator.clipboard.writeText){
          handledAsync = true;
          navigator.clipboard.writeText(json).then(function(){ flashCopied(copyBtn2, true); })
            .catch(function(){ var ok = fallbackCopyText(json); flashCopied(copyBtn2, ok); });
        }
        if(!handledAsync){ var ok2 = fallbackCopyText(json); flashCopied(copyBtn2, ok2); }
      });
      outWrap.appendChild(copyBtn2);
      outWrap.appendChild(el("p", "small-note", "Pacchetto pronto: copialo e incollalo nello strumento Gestione PG Adulto, Step \u00abImporta da Studente\u00bb."));
    });
    p.appendChild(genBtn);
    p.appendChild(outWrap);

    container.appendChild(p);
  }

  installUniversalAutosave();
  renderAll();
  function bootPublicPgDirectoryAndRestore(){ensurePublicDirectory(false);restoreBrowserPgSession();}
  var previousFbOnReady=window.fbOnReady;
  window.fbOnReady=function(){
    if(typeof previousFbOnReady==="function"){try{previousFbOnReady();}catch(e){console.error(e);}}
    bootPublicPgDirectoryAndRestore();
  };
  if(window.fbReady){bootPublicPgDirectoryAndRestore();}

  var ffLastSentHeight=0;
  var ffHeightTimer=0;

  function getFelixContentHeight(){
    var wrap=document.querySelector(".wrap");
    if(wrap){
      var r=wrap.getBoundingClientRect();
      return Math.max(1,Math.ceil(r.bottom-Math.min(0,r.top)));
    }
    return Math.max(1,Math.ceil(document.body?document.body.getBoundingClientRect().height:1));
  }

  function notifyParentHeight(force){
    if(window.parent===window){return;}
    var h=getFelixContentHeight();
    if(!force && Math.abs(h-ffLastSentHeight)<2){return;}
    ffLastSentHeight=h;
    try{
      window.parent.postMessage({
        tipo:"felix-tool-height",
        tool:"studente",
        height:h,
        altezza:h
      },"*");
    }catch(e){}
  }

  function scheduleParentHeight(){
    if(ffHeightTimer){clearTimeout(ffHeightTimer);}
    ffHeightTimer=setTimeout(function(){notifyParentHeight(false);},40);
  }

  if(typeof ResizeObserver!=="undefined"){
    new ResizeObserver(scheduleParentHeight).observe(document.querySelector(".wrap")||document.body||document.documentElement);
  }

  if(typeof MutationObserver!=="undefined"){
    var ffMutationTarget=document.querySelector(".wrap")||document.body;
    if(ffMutationTarget){
      new MutationObserver(scheduleParentHeight).observe(ffMutationTarget,{
        childList:true,subtree:true,attributes:true,characterData:true
      });
    }
  }

  window.addEventListener("resize",scheduleParentHeight);

  window.addEventListener("message",function(event){
    if(event.data && event.data.tipo==="felix-tool-height-request"){
      notifyParentHeight(true);
    }
  });

  window.addEventListener("load",function(){
    notifyParentHeight(true);
    setTimeout(function(){notifyParentHeight(true);},120);
    setTimeout(function(){notifyParentHeight(true);},500);
  });

})();
</script>
</body>
</html>
